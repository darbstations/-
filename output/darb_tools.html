11\",\"n\":\"\",\"r\":\"\",\"p\":{\"car\":[],\"rest\":[],\"cafe\":[],\"mkt\":[],\"oth\":[]}},{\"c\":\"JA156\",\"n\":\"\",\"r\":\"\",\"p\":{\"car\":[],\"rest\":[],\"cafe\":[],\"mkt\":[],\"oth\":[]}}];\nconst CATS=[['car','خدمات السيارات'],['rest','المطاعم'],['cafe','المقاهي'],['mkt','الماركت'],['oth','أخرى']];\nconst PK=[\n {id:'ind',name:'باقة الأفراد',target:'السيارات الصغيرة',seg:'s',ad:'adS',def:{price:500,fuel:300}},\n {id:'big',name:'باقة الأفراد - سيارة كبيرة',target:'السيارات الكبيرة',seg:'f',ad:'adL',def:{price:500,fuel:300}},\n {id:'fam',name:'باقة العائلات',target:'السيارات العائلية الكبيرة',seg:'f',ad:'adF',def:{price:500,fuel:300}}\n];\nconst fmt=n=>Math.round(n).toLocaleString('en-US');\nconst fmt2=n=>(Math.round(n*100)/100).toLocaleString('en-US');\nconst sar=n=>fmt2(n)+' ر.س';\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst KEY='darb-pkg-v2';\nconst WASH_TYPES=['غسيل خارجي','غسيل داخلي','غسيل داخلي وخارجي','غسيل شامل','غسيل بالبخار','تلميع','غسيل محرك'];\nlet store={};\ntry{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){store={}}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}\n\nfunction defaultsFor(st){\n  const o={adS:0,adL:0,adF:0}; PK.forEach(pk=>o[pk.id]={...pk.def,items:[]}); return o;\n}\nfunction cfg(st){ if(!store[st.c]) store[st.c]=defaultsFor(st); const c=store[st.c];\n  PK.forEach(pk=>{if(!c[pk.id]) c[pk.id]={...pk.def,items:[]}; if(c[pk.ad]===undefined) c[pk.ad]=0;});\n  PK.forEach(pk=>{const p=c[pk.id]; if(p&&p.washN!==undefined){ if(+p.washN>0) p.items.unshift({kind:'wash',partner:'',item:'غسيل',qty:+p.washN,price:+p.washC||0,cost:+p.washD||0}); delete p.washN; delete p.washC; delete p.washD; }});\n  return c; }\n\nlet cur=STATIONS.find(s=>s.c==='MK007')||STATIONS[0];\n\nfunction fillSelect(){\n  const q=$('q').value.trim();\n  const list=STATIONS.filter(s=>!q||(s.n+' '+s.c+' '+s.r).in .innerHTML=CATS.map(([k,t])=>`<div class=\"pcat\"><span class=\"t\">${t}<\/span><span>${s.p[k].length?s.p[k].map(x=>`<span class=\"chip\">${esc(x)}<\/span>`).join(''):'<span class=\"muted\" style=\"font-size:12.5px\">لا يوجد<\/span>'}<\/span><\/div>`).join('');\n}\n\nfunction calc(c){\n  const sum=(k,f)=>c.items.filter(i=>(i.kind||'prod')===k).reduce((a,i)=>a+(+i.qty||0)*(+f(i)||0),0);\n  const washCust=sum('wash',i=>i.price), washDarb=sum('wash',i=>i.cost), washMargin=washCust-washDarb;\n  const prod=sum('prod',i=>i.price), prodDarb=sum('prod',i=>i.cost), prodMargin=prod-prodDarb;\n  const aff=sum('aff',i=>i.price), affDarb=sum('aff',i=>i.cost), affMargin=aff-affDarb;\n  const price=+c.price||0, cust=washCust+prod+aff, darb=washDarb+prodDarb+affDarb, costPrice=price-cust+darb;\n  return {washCust,washDarb,prod,prodDarb,aff,affDarb,cust,darb,price,costPrice,profit:price-costPrice};\n}\n\nfunction partnerOptions(){\n  return CATS.flatMap(([k,t])=>cur.p[k].map(x=>`<option value=\"${esc(x)}\">${t}<\/option>`)).join('');\n}\n\nfunction renderPkgs(){\n  const c=cfg(cur);\n  $('pkgs').innerHTML=PK.map(pk=>{\n    const p=c[pk.id];\n    return `<article class=\"panel pkg\" data-pk=\"${pk.id}\">\n      <div class=\"pkg-h\"><h2>${pk.name}<\/h2><span class=\"tag\">تستهدف ${pk.target}<\/span><\/div>\n      <label class=\"f\">نبذة عن الباقة<textarea id=\"${pk.id}-desc\" data-d=\"1\" rows=\"3\" placeholder=\"اكتب وصف الباقة اللي يظهر للعميل في التطبيق\">${esc(p.desc||'')}<\/textarea><\/label>\n      <div class=\"row2\">\n        <label class=\"f\">قيمة الباقة كاملة (ر.س)<input id=\"${pk.id}-price\" data-k=\"price\" type=\"number\" min=\"0\" step=\"10\" value=\"${p.price}\"><\/label>\n        <label class=\"f\"><span><span class=\"dot\" style=\"background:var(--fuel)\"><\/span>منها بنزين (ر.س)<\/span><input id=\"${pk.id}-fuel\" data-k=\"fuel\" type=\"number\" min=\"0\" step=\"10\" value=\"${p.fuel}\"><\/label>\n      <\/div>\n      <div class=\"sec\">\n        <div class=\"sec-h\" id=\"${pk.id}-n${i}\" data-f=\"item\" value=\"${esc(it.item||'')}\" placeholder=\"${af?'المنتج الخارجي':'مثال: وجبة'}\">`}<\/td>\n          <td><input id=\"${pk.id}-q${i}\" data-f=\"qty\" type=\"number\" min=\"0\" step=\"1\" value=\"${it.qty}\"><\/td>\n          <td><input id=\"${pk.id}-r${i}\" data-f=\"price\" type=\"number\" min=\"0\" step=\"0.5\" value=\"${it.price}\"><\/td>\n          <td><input id=\"${pk.id}-c${i}\" data-f=\"cost\" type=\"number\" min=\"0\" step=\"0.5\" value=\"${it.cost??''}\" placeholder=\"0\"><\/td>\n          <td class=\"tot\" id=\"${pk.id}-t${i}\"><\/td>\n          <td class=\"tot\" id=\"${pk.id}-m${i}\"><\/td>\n          <td><button type=\"button\" class=\"x\" data-del=\"${i}\" aria-label=\"حذف\">×<\/button><\/td><\/tr>`}).join('')}<\/tbody><\/table><\/div>\n        ${p.items.length?'':'<div class=\"hint\">ما في منتجات ولا غسلات. اضغط «＋ منتج» أو «＋ غسلة» وحدد الشريك من قائمة شركاء المحطة.<\/div>'}\n        <div class=\"hint\">ما تدفعه درب يُضاف على سعر التكلفة، وما يدفعه العميل يُطرح منه.<\/div>\n        ${p.items.some(i=>i.ex)?'<div class=\"ex\">المنتجات المعبأة مسبقًا أمثلة، عدّلها أو احذفها.<\/div>':''}\n      <\/div>\n      <div class=\"sec\">\n        <div class=\"sum\" id=\"${pk.id}-sum\"><\/div>\n        <div class=\"remain\" id=\"${pk.id}-remain\"><\/div>\n        <div class=\"darbbox\" id=\"${pk.id}-darb\"><\/div>\n      <\/div>\n    <\/article>`}).join('')+`<datalist id=\"plist\">${partnerOptions()}<\/datalist>`;\n  PK.forEach(pk=>updatePkg(pk.id));\n}\n\nfunction updatePkg(id){\n  const p=cfg(cur)[id], r=calc(p);\n  p.items.forEach((it,i)=>{const el=$(`${id}-t${i}`); if(el) el.textContent=sar((+it.qty||0)*(+it.price||0)); const m=$(`${id}-m${i}`); if(m) m.textContent=sar((+it.qty||0)*(+it.cost||0));});\n  const nW=p.items.filter(i=>i.kind==='wash').reduce((a,i)=>a+(+i.qty||0),0), nP=p.items.filter(i=>(i.kind||'prod')==='prod').length, nA=p.items.filter(i=>i.kind==='aff').length, showA=id==='fam'||r.aff||r.affDarb;\n  const row=(l,v,st='')=>`<div style=\"${st}\"><span>${l}<\/span><span class=\"num\">${v}<\/span><\/div>`;\n  $(`${id}-sum`).innerHTML=\n    row('قيمة الباقة',sar(r.price))+\n    row('<span class=\"dot\" style=\"background:var(--fuel)\"><\/span>منها بنزين',sar(+p.fuel||0))+\n    row('ما يدفعه العميل للغسلات والمنتجات','− '+sar(r.cust))+\n    row('ما تدفعه درب','+ '+sar(r.darb))+\n    row('سعر التكلفة',sar(r.costPrice),'border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:700');\n  const ok=r.profit>=0, el=$(`${id}-remain`);\n  el.className='remain '+(ok?'ok':'bad');\n  el.innerHTML=`<span>${ok?'ربحك من الباقة':'خسارة في الباقة'}<\/span><span class=\"big num\">${sar(Math.abs(r.profit))}<\/span>`;\n  const line=(l,v)=>`<div style=\"display:flex;justify-content:space-between\"><span>${l}<\/span><b class=\"num\">${sar(v)}<\/b><\/div>`;\n  $(`${id}-darb`).innerHTML=\n    `<div class=\"hint\" style=\"font-weight:600\">التفصيل<\/div>`+\n    line(`<span class=\"dot\" style=\"background:var(--wash)\"><\/span>الغسلات (${nW}): ما يدفعه العميل`,r.washCust)+line('الغسلات: ما تدفعه درب',r.washDarb)+\n    line(`<span class=\"dot\" style=\"background:var(--prod)\"><\/span>منتجات الشركاء (${nP}): ما يدفعه العميل`,r.prod)+line('منتجات الشركاء: ما تدفعه درب',r.prodDarb)+\n    (showA?line(`<span class=\"dot\" style=\"background:var(--aff)\"><\/span>منتجات خارجية - أفلييت (${nA}): ما يدفعه العميل`,r.aff)+line('منتجات خارجية: ما تدفعه درب',r.affDarb):'')+\n    `<div class=\"hint\">سعر التكلفة = قيمة الباقة − ما يدفعه العميل + ما تدفعه درب · الربح = قيمة الباقة − سعر التكلفة<\/div>`;\n  renderPotential();\n}\n\nfunction renderPotential(){\n  const c=cfg(cur), s=cur;\n  PK.forEach(pk=>$(pk.ad).value=c[pk.ad]);\n  if(!s.v){$('potTbl').innerHTML='<tr><td class=\"muted\">لا توجد بيانات حركة لهذه المحطة.<\/td><\/tr>';return;}\n  const rows=PK.map(pk=>{\n    const cars=(pk.seg==='s'?s.s:s.f)*30, ad=(+c[pk.ad]||0)/100, n=cars*ad, p=c[pk.id], r=calc(p);\n    return {pk,cars,n,rev:n*r.price,fuel:n*(+p.fuel||0),cust:n*r.cust,darb:n*r.darb,cost:n*r.costPrice,profit:n*r.profit};\n  });\n  const T=k=>rows.reduce((a,r)=>a+r[k],0);\n  $('potTbl').innerHTML=`<thead><tr><th>الباقة<\/th><th>سيارات مستهدفة / شهر<\/th><th>مشتركون / شهر<\/th><th>إيراد الباقات<\/th><th>منها بنزين<\/th><th>ما يدفعه العملاء<\/th><th>ما تدفعه درب<\/th><th>سعر التكلفة<\/th><th>ربحك<\/th><\/tr><\/thead><tbody>\n  ${rows.map(r=>`<tr><td>${r.pk.name}<\/td><td>${fmt(r.cars)}<\/td><td>${fmt(r.n)}<\/td><td>${sar(r.rev)}<\/td><td>${sar(r.fuel)}<\/td><td>${sar(r.cust)}<\/td><td>${sar(r.darb)}<\/td><td>${sar(r.cost)}<\/td><td style=\"${r.profit<0?'color:var(--bad)':''}\">${sar(r.profit)}<\/td><\/tr>`).join('')}\n  <tr style=\"font-weight:700\"><td>الإجمالي<\/td><td>${fmt((s.s+s.f)*30)}<\/td><td>${fmt(T('n'))}<\/td><td>${sar(T('rev'))}<\/td><td>${sar(T('fuel'))}<\/td><td>${sar(T('cust'))}<\/td><td>${sar(T('darb'))}<\/td><td>${sar(T('cost'))}<\/td><td>${sar(T('profit'))}<\/td><\/tr><\/tbody><caption class=\"hint\" style=\"caption-side:bottom;text-align:right;padding-top:6px\">باقة الأفراد للسيارة الكبيرة وباقة العائلات تستهدفان نفس السيارات الكبيرة، فالإجمالي يحسبها مرة وحدة.<\/caption>`;\n}\n\nfunction renderAll(){renderStation();renderPkgs();}\n\n$('q').addEventListener('input',fillSelect);\n$('station').addEventListener('change',e=>{cur=STATIONS.find(s=>s.c===e.target.value);renderAll();});\n$('pkgs').addEventListener('input',e=>{\n  const art=e.target.closest('[data-pk]'); if(!art) return; const id=art.dataset.pk, p=cfg(cur)[id];\n  if(e.target.dataset.d){p.desc=e.target.value;save();return;}\n  if(e.target.dataset.k){p[e.target.dataset.k]=e.target.value===''?0:+e.target.value;}\n  else if(e.target.dataset.f){const i=+e.target.closest('tr').dataset.i, f=e.target.dataset.f;\n    if(f==='kind'){p.items[i].kind=e.target.value;p.items[i].item=e.target.value==='wash'?WASH_TYPES[0]:'';if(e.target.value==='aff')p.items[i].partner='';save();renderPkgs();return;}\n    if(f==='item'&&e.target.value==='__other'){e.target.closest('td').innerHTML=`<input id=\"${id}-n${i}\" data-f=\"item\" placeholder=\"اكتب نوع الغسيل\">`;const el=$(`${id}-n${i}`);el.focus();p.items[i].item='';save();updatePkg(id);return;}\n    p.items[i][f]=(f==='qty'||f==='price'||f==='cost')?(+e.target.value||0):e.target.value; p.items[i].ex=false;}\n  save(); updatePkg(id);\n});\n$('pkgs').addEventListener('click',e=>{\n  const art=e.target.closest('[data-pk]'); if(!art) return; const id=art.dataset.pk, p=cfg(cur)[id];\n  if(e.target.dataset.add){const k=e.target.dataset.kind||'prod';p.items.push({kind:k,partner:'',item:k==='wash'?WASH_TYPES[0]:'',qty:1,price:0,cost:0});save();renderPkgs();const i=p.items.length-1;const el=$(`${id}-p${i}`);if(el)el.focus();}\n  if(e.target.dataset.del!==undefined){p.items.splice(+e.target.dataset.del,1);save();renderPkgs();}\n});\n['adS','adL','adF'].forEach(k=>$(k).addEventListener('input',e=>{cfg(cur)[k]=+e.target.value||0;save();renderPotential();}));\n$('resetBtn').addEventListener('click',()=>{store[cur.c]=defaultsFor(cur);save();renderAll();toast('رجعت إعدادات هذه المحطة للبداية');});\n$('copyBtn').addEventListener('click',()=>{\n  const c=cfg(cur), L=[];\n  L.push(['المحطة',cur.n,cur.c].join('\\t'));\n  PK.forEach(pk=>{const p=c[pk.id],r=calc(p);\n    L.push('',pk.name,['نبذة',(p.desc||'').replace(/\\s+/g,' ')].join('\\t'),['قيمة الباقة',p.price].join('\\t'),['بنزين',p.fuel].join('\\t'),\n      ['ما يدفعه العميل',r.cust].join('\\t'),['ما تدفعه درب',r.darb].join('\\t'),['سعر التكلفة',r.costPrice].join('\\t'),['ربحك من الباقة',r.profit].join('\\t'),\n      ['النوع','الشريك','المنتج / نوع الغسيل','العدد','ما يدفعه العميل','ما تدفعه درب','إجمالي العميل','إجمالي درب'].join('\\t'));\n    p.items.forEach(i=>L.push([i.kind==='wash'?'غسلة':i.kind==='aff'?'منتج خارجي (أفلييت)':'منتج',i.partner,i.item,i.qty,i.price,i.cost||0,(+i.qty||0)*(+i.price||0),(+i.qty||0)*(+i.cost||0)].join('\\t')));});\n  const txt=L.join('\\n');\n  const done=()=>toast('نُسخ الملخص، الصقه في إكسل');\n  try{navigator.clipboard.writeText(txt).then(done,()=>fallback(txt))}catch(e){fallback(txt)}\n});\nfunction fallback(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('نُسخ الملخص، الصقه في إكسل')}catch(e){toast('تعذّر النسخ')}ta.remove();}\nlet tt;function toast(m){const el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2200);}\n\nfillSelect(); renderAll();\n<\/script>\n<\/body><\/html>", "restaurants": "<!doctype html><html lang=\"ar\" dir=\"rtl\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}<\/style><\/head><body><title>باقات درب مع خصومات المطاعم<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap\">\n<style>\n/* Layout: station strip on top, two package builders side by side, each with a live budget gauge */\n:root{\n  --bg:#F6F5F3; --surface:#FFFFFF; --ink:#24201C; --ink2:#6B645C; --line:#E4E0DA;\n  --accent:#E8631A; --accent-soft:#FDEBDD; --fuel:#3E6E8E; --wash:#2F9C95; --prod:#E8631A; --darb:#7A5AA8; --aff:#B0457B; --disc:#8A6D1F;\n  --ok:#2E7D4F; --ok-soft:#E3F2E8; --bad:#C0392B; --bad-soft:#FBE4E1;\n  --display:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif;\n  --body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --bg:#181614; --surface:#221F1C; --ink:#F1ECE6; --ink2:#A89F95; --line:#3A3530;\n  --accent:#F38A4A; --accent-soft:#3D2717; --fuel:#7FAED0; --wash:#5CC6BE; --prod:#F38A4A; --darb:#B49AE0; --aff:#E58AB8; --disc:#D9B44A;\n  --ok:#6FCF97; --ok-soft:#1E3326; --bad:#F08A7E; --bad-sof :grid;grid-template-columns:minmax(220px,320px) 1fr;gap:18px}\n.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}\n.stat{border-inline-start:3px solid var(--line);padding:2px 10px}\n.stat .k{font-size:12px;color:var(--ink2)} .stat .v{font-family:var(--display);font-size:20px;font-weight:700}\n.stat.s{border-color:var(--fuel)} .stat.fm{border-color:var(--accent)} .stat.h{border-color:var(--ink2)}\n.mix{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin-top:10px}\n.mix i{display:block;height:100%}\n.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin-top:6px}\n.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px;vertical-align:middle}\n.partners{display:grid;gap:8px;margin-top:14px}\n.pcat{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}\n.pcat .t{font-size:12px;color:var(--ink2);min-width:92px;font-weight:600}\n.chip{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);margin:2px 0 2px 4px}\n.nodata{font-size:13px;color:var(--ink2);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px}\n.pkgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}\n.pkg{display:grid;gap:14px;align-content:start}\n.pkg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}\n.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}\n.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}\n.sec{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}\n.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}\n.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}\n.gauge{disp \":[],\"oth\":[]}},{\"c\":\"MK311\",\"n\":\"\",\"r\":\"\",\"p\":{\"car\":[],\"rest\":[],\"cafe\":[],\"mkt\":[],\"oth\":[]}},{\"c\":\"JA156\",\"n\":\"\",\"r\":\"\",\"p\":{\"car\":[],\"rest\":[],\"cafe\":[],\"mkt\":[],\"oth\":[]}}];\nconst CATS=[['car','خدمات السيارات'],['rest','المطاعم'],['cafe','المقاهي'],['mkt','الماركت'],['oth','أخرى']];\nconst PK=[\n {id:'ind',name:'باقة الأفراد',target:'السيارات الصغيرة',seg:'s',ad:'adS',def:{price:500,fuel:300}},\n {id:'big',name:'باقة الأفراد - سيارة كبيرة',target:'السيارات الكبيرة',seg:'f',ad:'adL',def:{price:500,fuel:300}},\n {id:'fam',name:'باقة العائلات',target:'السيارات العائلية الكبيرة',seg:'f',ad:'adF',def:{price:500,fuel:300}}\n];\nconst fmt=n=>Math.round(n).toLocaleString('en-US');\nconst fmt2=n=>(Math.round(n*100)/100).toLocaleString('en-US');\nconst sar=n=>fmt2(n)+' ر.س';\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst KEY='darb-pkg-disc-v1';\nconst WASH_TYPES=['غسيل خارجي','غسيل داخلي','غسيل داخلي وخارجي','غسيل شامل','غسيل بالبخار','تلميع','غسيل محرك'];\nlet store={};\ntry{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){store={}}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}\n\nfunction defaultsFor(st){\n  const o={adS:0,adL:0,adF:0}; PK.forEach(pk=>o[pk.id]={...pk.def,items:[],disc:[]}); return o;\n}\nfunction cfg(st){ if(!store[st.c]) store[st.c]=defaultsFor(st); const c=store[st.c];\n  PK.forEach(pk=>{if(!c[pk.id]) c[pk.id]={...pk.def,items:[],disc:[]}; if(!c[pk.id].disc) c[pk.id].disc=[]; if(c[pk.ad]===undefined) c[pk.ad]=0;});\n  PK.forEach(pk=>{const p=c[pk.id]; if(p&&p.washN!==undefined){ if(+p.washN>0) p.items.unshift({kind:'wash',partner:'',item:'غسيل',qty:+p.washN,price:+p.washC||0,cost:+p.washD||0}); delete p.washN; delete p.washC; delete p.washD; }});\n  return c; }\n\nlet cur=STATIONS.find(s=>s.c==='MK007')||STATIONS[0];\n\nfunction fillSelect(){\n  const q=$('q').value.trim();\n  const list=STATIONS.filter(s=>!q||(s.n+' '+s.c+' '+s.r).includes(q));\n  $('station').innerHTML=list.map(s=>`<option value=\"${s.c}\"${s.c===cur.c?' selected':''}>${esc(s.n||'بدون اسم')} — ${s.c}${s.r?' ('+esc(s.r)+')':''}${s.v?'':' · بلا بيانات حركة'}<\/option>`).join('');\n  if(list.length&&!list.some(s=>s.c===cur.c)){cur=list[0];renderAll();}\n}\n\nfunction renderStation(){\n  const s=cur, tot=s.v||0;\n  const allP=CATS.reduce((a,[k])=>a+s.p[k].length,0);\n  $('stnMeta').textContent=`${allP} شريك في المحطة`+(s.v?` · ${fmt(s.v)} زيارة يوميًا`:'');\n  if(s.v){\n    const ps=s.s/tot*100, pf=s.f/tot*100, ph=s.h/tot*100;\n    $('stnStats').innerHTML=`<div class=\"stats\">\n      <div class=\"stat s\"><div class=\"k\">سيارات صغيرة / شهر<\/div><div class=\"v num\">${fmt(s.s*30)}<\/div><div class=\"k num\">${ps.toFixed(0)}٪ من الحركة<\/div><\/div>\n      <div class=\"stat fm\"><div class=\"k\">عائلية كبيرة / شهر<\/div><div class=\"v num\">${fmt(s.f*30)}<\/div><div class=\"k num\">${pf.toFixed(0)}٪ من الحركة<\/div><\/div>\n      <div class=\"stat h\"><div class=\"k\">شاحنات وحافلات / شهر<\/div><div class=\"v num\">${fmt(s.h*30)}<\/div><div class=\"k num\">${ph.toFixed(0)}٪ من الحركة<\/div><\/div>\n      <div class=\"stat\"><div class=\"k\">إجمالي الزيارات / شهر<\/div><div class=\"v num\">${fmt(tot*30)}<\/div><div class=\"k\">تقدير<\/div><\/div>\n    <\/div>\n    <div class=\"mix\" aria-hidden=\"true\"><i style=\"width:${ps}%;background:var(--fuel)\"><\/i><i style=\"width:${pf}%;background:var(--accent)\"><\/i><i style=\"width:${ph}%;background:var(--ink2)\"><\/i><\/div>\n    <div class=\"legend\"><span><b style=\"background:var(--fuel)\"><\/b>صغيرة<\/span><span><b style=\"background:var(--accent)\"><\/b>عائلية كبيرة (بنزين)<\/span><span><b style=\"background:var(--ink2)\"><\/b>شاحنات وحافلات (ديزل)<\/span><\/div>`;\n  } else {\n    $('stnStats').innerHTML=`<div class=\"nodata\">لا توجد بيانات مبيعات لهذه المحطة في ملف التحليل، لذلك لا تظهر نسب السيارات ولا العائد المتوقع. تقدر تبني الباقات عادي.<\/div>`;\n  }\n  $('stnPartners').innerHTML=CATS.map(([k,t])=>`<div class=\"pcat\"><span class=\"t\">${t}<\/span><span>${s.p[k].length?s.p[k].map(x=>`<span class=\"chip\">${esc(x)}<\/span>`).join(''):'<span class=\"muted\" style=\"font-size:12.5px\">لا يوجد<\/span>'}<\/span><\/div>`).join('');\n}\n\nfunction calc(c){\n  const sum=(k,f)=>c.items.filter(i=>(i.kind||'prod')===k).reduce((a,i)=>a+(+i.qty||0)*(+f(i)||0),0);\n  const washCust=sum('wash',i=>i.price), washDarb=sum('wash',i=>i.cost), washMargin=washCust-washDarb;\n  const prod=sum('prod',i=>i.price), prodDarb=sum('prod',i=>i.cost), prodMargin=prod-prodDarb;\n  const aff=sum('aff',i=>i.price), affDarb=sum('aff',i=>i.cost), affMargin=aff-affDarb;\n  const D=c.disc||[], discVal=D.reduce((a,d)=>a+(+d.uses||0)*(+d.val||0),0), discDarb=D.reduce((a,d)=>a+(+d.uses||0)*(+d.darb||0),0);\n  const price=+c.price||0, cust=washCust+prod+aff, darb=washDarb+prodDarb+affDarb+discDarb, costPrice=price-cust+darb;\n  return {washCust,washDarb,prod,prodDarb,aff,affDarb,discVal,discDarb,discRest:discVal-discDarb,cust,darb,price,costPrice,profit:price-costPrice};\n}\n\nfunction restOptions(){return cur.p.rest.map(x=>`<option value=\"${esc(x)}\"><\/option>`).join('');}\nfunction partnerOptions(){\n  return CATS.flatMap(([k,t])=>cur.p[k].map(x=>`<option value=\"${esc(x)}\">${t}<\/option>`)).join('');\n}\n\nfunction renderPkgs(){\n  const c=cfg(cur);\n  $('pkgs').innerHTML=PK.map(pk=>{\n    const p=c[pk.id];\n    return `<article class=\"panel pkg\" data-pk=\"${pk.id}\">\n      <div class=\"pkg-h\"><h2>${pk.name}<\/h2><span class=\"tag\">تستهدف ${pk.target}<\/span><\/div>\n      <label class=\"f\">نبذة عن الباقة<textarea id=\"${pk.id}-desc\" data-d=\"1\" rows=\"3\" placeholder=\"اكتب وصف الباقة اللي يظهر للعميل في التطبيق\">${esc(p.desc||'')}<\/textarea><\/label>\n      <div class=\"row2\">\n        <label class=\"f\">قيمة الباقة كاملة (ر.س)<input id=\"${pk.id}-price\" data-k=\"price\" type=\"number\" min=\"0\" step=\"10\" value=\"${p.price}\"><\/label>\n        <label class=\"f\"><span><span class=\"dot\" style=\"background:var(--fuel)\"><\/span>منها بنزين (ر.س)<\/span><input id=\"${pk.id}-fuel\" data-k=\"fuel\" type=\"number\" min=\"0\" step=\"10\" value=\"${p.fuel}\"><\/label>\n      <\/div>\n      <div class=\"sec\">\n        <div class=\"sec-h\"><h3><span class=\"dot\" style=\"background:var(--prod)\"><\/span>${pk.id==='fam'?'منتجات الشركاء والغسلات والأفلييت':'منتجات الشركاء والغسلات'}<\/h3><div style=\"display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end\"><button type=\"button\" class=\"pri\" data-add=\"${pk.id}\" data-kind=\"prod\">＋ منتج<\/button><button type=\"button\" class=\"pri\" data-add=\"${pk.id}\" data-kind=\"wash\" style=\"background:var(--wash);border-color:var(--wash)\">＋ غسلة<\/button>${pk.id==='fam'?'<button type=\"button\" class=\"pri\" data-add=\"fam\" data-kind=\"aff\" style=\"background:var(--aff);border-color:var(--aff)\">＋ منتج خارجي (أفلييت)<\/button>':''}<\/div><\/div>\n        <div class=\"tbl\"><table class=\"prod\"><thead><tr><th>النوع<\/th><th>الشريك<\/th><th>المنتج / نوع الغسيل<\/th><th>العدد<\/th><th>ما يدفعه العميل<\/th><th>ما تدفعه درب<\/th><th style=\"text-align:left\">إجمالي العميل<\/th><th style=\"text-align:left\">إجمالي درب<\/th><th><\/th><\/tr><\/thead>\n        <tbody id=\"${pk.id}-items\">${p.items.map((it,i)=>{const kd=it.kind||'prod',w=kd==='wash',af=kd==='aff';return `<tr data-i=\"${i}\">\n          <td><select id=\"${pk.id}-k${i}\" data-f=\"kind\" aria-label=\"النوع\" style=\"border-color:${w?'var(--wash)':af?'var(--aff)':'var(--line)'}\"><option value=\"prod\"${kd==='prod'?' selected':''}>منتج<\/option><option value=\"wash\"${w?' selected':''}>غسلة<\/option>${pk.id==='fam'||af?`<option value=\"aff\"${af?' selected':''}>خارجي (أفلييت)<\/option>`:''}<\/select><\/td>\n          <td><input id=\"${pk.id}-p${i}\" data-f=\"partner\" ${af?'':'list=\"plist\"'} value=\"${esc(it.partner||'')}\" placeholder=\"${af?'اسم الجهة الخارجية':'اختر أو اكتب'}\"><\/td>\n          <td>${w?`<select id=\"${pk.id}-n${i}\" data-f=\"item\" aria-label=\"نوع الغسيل\">${(WASH_TYPES.includes(it.item)||!it.item?WASH_TYPES:[it.item,...WASH_TYPES]).map(t=>`<option${t===it.item?' selected':''}>${esc(t)}<\/option>`).join('')}<option value=\"__other\">نوع آخر…<\/option><\/select>`:`<input id=\"${pk.id}-n${i}\" data-f=\"item\" value=\"${esc(it.item||'')}\" placeholder=\"${af?'المنتج الخارجي':'مثال: وجبة'}\">`}<\/td>\n          <td><input id=\"${pk.id}-q${i}\" data-f=\"qty\" type=\"number\" min=\"0\" step=\"1\" value=\"${it.qty}\"><\/td>\n          <td><input id=\"${pk.id}-r${i}\" data-f=\"price\" type=\"number\" min=\"0\" step=\"0.5\" value=\"${it.price}\"><\/td>\n          <td><input id=\"${pk.id}-c${i}\" data-f=\"cost\" type=\"number\" min=\"0\" step=\"0.5\" value=\"${it.cost??''}\" placeholder=\"0\"><\/td>\n          <td class=\"tot\" id=\"${pk.id}-t${i}\"><\/td>\n          <td class=\"tot\" id=\"${pk.id}-m${i}\"><\/td>\n          <td><button type=\"button\" class=\"x\" data-del=\"${i}\" aria-label=\"حذف\">×<\/button><\/td><\/tr>`}).join('')}<\/tbody><\/table><\/div>\n        ${p.items.length?'':'<div class=\"hint\">ما في منتجات ولا غسلات. اضغط «＋ منتج» أو «＋ غسلة» وحدد الشريك من قائمة شركاء المحطة.<\/div>'}\n        <div class=\"hint\">ما تدفعه درب يُضاف على سعر التكلفة، وما يدفعه العميل يُطرح منه.<\/div>\n        ${p.items.some(i=>i.ex)?'<div class=\"ex\">المنتجات المعبأة مسبقًا أمثلة، عدّلها أو احذفها.<\/div>':''}\n      <\/div>\n      <div class=\"sec\">\n        <div class=\"sec-h\"><h3><span class=\"dot\" style=\"background:var(--disc)\"><\/span>خصومات المطاعم<\/h3><button type=\"button\" class=\"pri\" data-adddisc=\"${pk.id}\" style=\"background:var(--disc);border-color:var(--disc)\">＋ خصم مطعم<\/button><\/div>\n        ${(p.disc||[]).length?`<div class=\"tbl\"><table class=\"prod disc\"><thead><tr><th>المطعم<\/th><th>الخصم<\/th><th>مرات الاستخدام<\/th><th>قيمة الخصم للمرة<\/th><th>ما تدفعه درب للمرة<\/th><th style=\"text-align:left\">إجمالي الخصم<\/th><th style=\"text-align:left\">إجمالي درب<\/th><th><\/th><\/tr><\/thead><tbody>${p.disc.map((d,i)=>`<tr data-j=\"${i}\">\n          <td><input id=\"${pk.id}-dr${i}\" data-g=\"rest\" list=\"rlist\" value=\"${esc(d.rest||'')}\" placeholder=\"اختر أو اكتب\"><\/td>\n          <td><input id=\"${pk.id}-dd${i}\" data-g=\"desc\" value=\"${esc(d.desc||'')}\" placeholder=\"مثال: 20٪ على الوجبات\"><\/td>\n          <td><input id=\"${pk.id}-du${i}\" data-g=\"uses\" type=\"number\" min=\"0\" step=\"1\" value=\"${d.uses}\"><\/td>\n          <td><input id=\"${pk.id}-dv${i}\" data-g=\"val\" type=\"number\" min=\"0\" step=\"0.5\" value=\"${d.val}\"><\/td>\n          <td><input id=\"${pk.id}-dz${i}\" data-g=\"darb\" type=\"number\" min=\"0\" step=\"0.5\" value=\"${d.darb}\"><\/td>\n          <td class=\"tot\" id=\"${pk.id}-dt${i}\"><\/td>\n          <td class=\"tot\" id=\"${pk.id}-dm${i}\"><\/td>\n          <td><button type=\"button\" class=\"x\" data-deldisc=\"${i}\" aria-label=\"حذف\">×<\/button><\/td><\/tr>`).join('')}<\/tbody><\/table><\/div>`:'<div class=\"hint\">ما في خصومات مطاعم. اضغط «＋ خصم مطعم».<\/div>'}\n        <div class=\"hint\">قيمة الخصم يستفيد منها العميل عند المطعم، وما تدفعه درب منها يُضاف على سعر التكلفة، والباقي على المطعم.<\/div>\n      <\/div>\n      <div class=\"sec\">\n        <div class=\"sum\" id=\"${pk.id}-sum\"><\/div>\n        <div class=\"remain\" id=\"${pk.id}-remain\"><\/div>\n        <div class=\"darbbox\" id=\"${pk.id}-darb\"><\/div>\n      <\/div>\n    <\/article>`}).join('')+`<datalist id=\"plist\">${partnerOptions()}<\/datalist><datalist id=\"rlist\">${restOptions()}<\/datalist>`;\n  PK.forEach(pk=>updatePkg(pk.id));\n}\n\nfunction updatePkg(id){\n  const p=cfg(cur)[id], r=calc(p);\n  p.items.forEach((it,i)=>{const el=$(`${id}-t${i}`); if(el) el.textContent=sar((+it.qty||0)*(+it.price||0)); const m=$(`${id}-m${i}`); if(m) m.textContent=sar((+it.qty||0)*(+it.cost||0));});\n  (p.disc||[]).forEach((d,i)=>{const t=$(`${id}-dt${i}`); if(t) t.textContent=sar((+d.uses||0)*(+d.val||0)); const m=$(`${id}-dm${i}`); if(m) m.textContent=sar((+d.uses||0)*(+d.darb||0));});\n  const nW=p.items.filter(i=>i.kind==='wash').reduce((a,i)=>a+(+i.qty||0),0), nP=p.items.filter(i=>(i.kind||'prod')==='prod').length, nA=p.items.filter(i=>i.kind==='aff').length, showA=id==='fam'||r.aff||r.affDarb;\n  const row=(l,v,st='')=>`<div style=\"${st}\"><span>${l}<\/span><span class=\"num\">${v}<\/span><\/div>`;\n  $(`${id}-sum`).innerHTML=\n    row('قيمة الباقة',sar(r.price))+\n    row('<span class=\"dot\" style=\"background:var(--fuel)\"><\/span>منها بنزين',sar(+p.fuel||0))+\n    row('ما يدفعه العميل للغسلات والمنتجات','− '+sar(r.cust))+\n    row('ما تدفعه درب','+ '+sar(r.darb))+\n    row('سعر التكلفة',sar(r.costPrice),'border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:700');\n  const ok=r.profit>=0, el=$(`${id}-remain`);\n  el.className='remain '+(ok?'ok':'bad');\n  el.innerHTML=`<span>${ok?'ربحك من الباقة':'خسارة في الباقة'}<\/span><span class=\"big num\">${sar(Math.abs(r.profit))}<\/span>`;\n  const line=(l,v)=>`<div style=\"display:flex;justify-content:space-between\"><span>${l}<\/span><b class=\"num\">${sar(v)}<\/b><\/div>`;\n  $(`${id}-darb`).innerHTML=\n    `<div class=\"hint\" style=\"font-weight:600\">التفصيل<\/div>`+\n    line(`<span class=\"dot\" style=\"background:var(--wash)\"><\/span>الغسلات (${nW}): ما يدفعه العميل`,r.washCust)+line('الغسلات: ما تدفعه درب',r.washDarb)+\n    line(`<span class=\"dot\" style=\"background:var(--prod)\"><\/span>منتجات الشركاء (${nP}): ما يدفعه العميل`,r.prod)+line('منتجات الشركاء: ما تدفعه درب',r.prodDarb)+\n    line(`<span class=\"dot\" style=\"background:var(--disc)\"><\/span>خصومات المطاعم (${(p.disc||[]).length}): قيمة الخصم للعميل`,r.discVal)+line('خصومات المطاعم: ما تدفعه درب',r.discDarb)+line('خصومات المطاعم: على المطعم',r.discRest)+\n    (showA?line(`<span class=\"dot\" style=\"background:var(--aff)\"><\/span>منتجات خارجية - أفلييت (${nA}): ما يدفعه العميل`,r.aff)+line('منتجات خارجية: ما تدفعه درب',r.affDarb):'')+\n    `<div class=\"hint\">سعر التكلفة = قيمة الباقة − ما يدفعه العميل + ما تدفعه درب · الربح = قيمة الباقة − سعر التكلفة<\/div>`;\n  renderPotential();\n}\n\nfunction renderPotential(){\n  const c=cfg(cur), s=cur;\n  PK.forEach(pk=>$(pk.ad).value=c[pk.ad]);\n  if(!s.v){$('potTbl').innerHTML='<tr><td class=\"muted\">لا توجد بيانات حركة لهذه المحطة.<\/td><\/tr>';return;}\n  const rows=PK.map(pk=>{\n    const cars=(pk.seg==='s'?s.s:s.f)*30, ad=(+c[pk.ad]||0)/100, n=cars*ad, p=c[pk.id], r=calc(p);\n    return {pk,cars,n,rev:n*r.price,fuel:n*(+p.fuel||0),cust:n*r.cust,darb:n*r.darb,cost:n*r.costPrice,profit:n*r.profit};\n  });\n  const T=k=>rows.reduce((a,r)=>a+r[k],0);\n  $('potTbl').innerHTML=`<thead><tr><th>الباقة<\/th><th>سيارات مستهدفة / شهر<\/th><th>مشتركون / شهر<\/th><th>إيراد الباقات<\/th><th>منها بنزين<\/th><th>ما يدفعه العملاء<\/th><th>ما تدفعه درب<\/th><th>سعر التكلفة<\/th><th>ربحك<\/th><\/tr><\/thead><tbody>\n  ${rows.map(r=>`<tr><td>${r.pk.name}<\/td><td>${fmt(r.cars)}<\/td><td>${fmt(r.n)}<\/td><td>${sar(r.rev)}<\/td><td>${sar(r.fuel)}<\/td><td>${sar(r.cust)}<\/td><td>${sar(r.darb)}<\/td><td>${sar(r.cost)}<\/td><td style=\"${r.profit<0?'color:var(--bad)':''}\">${sar(r.profit)}<\/td><\/tr>`).join('')}\n  <tr style=\"font-weight:700\"><td>الإجمالي<\/td><td>${fmt((s.s+s.f)*30)}<\/td><td>${fmt(T('n'))}<\/td><td>${sar(T('rev'))}<\/td><td>${sar(T('fuel'))}<\/td><td>${sar(T('cust'))}<\/td><td>${sar(T('darb'))}<\/td><td>${sar(T('cost'))}<\/td><td>${sar(T('profit'))}<\/td><\/tr><\/tbody><caption class=\"hint\" style=\"caption-side:bottom;text-align:right;padding-top:6px\">باقة الأفراد للسيارة الكبيرة وباقة العائلات تستهدفان نفس السيارات الكبيرة، فالإجمالي يحسبها مرة وحدة.<\/caption>`;\n}\n\nfunction renderAll(){renderStation();renderPkgs();}\n\n$('q').addEventListener('input',fillSelect);\n$('station').addEventListener('change',e=>{cur=STATIONS.find(s=>s.c===e.target.value);renderAll();});\n$('pkgs').addEventListener('input',e=>{\n  const art=e.target.closest('[data-pk]'); if(!art) return; const id=art.dataset.pk, p=cfg(cur)[id];\n  if(e.target.dataset.d){p.desc=e.target.value;save();return;}\n  if(e.target.dataset.g){const j=+e.target.closest('tr').dataset.j,g=e.target.dataset.g;p.disc[j][g]=(g==='uses'||g==='val'||g==='darb')?(+e.target.value||0):e.target.value;save();updatePkg(id);return;}\n  if(e.target.dataset.k){p[e.target.dataset.k]=e.target.value===''?0:+e.target.value;}\n  else if(e.target.dataset.f){const i=+e.target.closest('tr').dataset.i, f=e.target.dataset.f;\n    if(f==='kind'){p.items[i].kind=e.target.value;p.items[i].item=e.target.value==='wash'?WASH_TYPES[0]:'';if(e.target.value==='aff')p.items[i].partner='';save();renderPkgs();return;}\n    if(f==='item'&&e.target.value==='__other'){e.target.closest('td').innerHTML=`<input id=\"${id}-n${i}\" data-f=\"item\" placeholder=\"اكتب نوع الغسيل\">`;const el=$(`${id}-n${i}`);el.focus();p.items[i].item='';save();updatePkg(id);return;}\n    p.items[i][f]=(f==='qty'||f==='price'||f==='cost')?(+e.target.value||0):e.target.value; p.items[i].ex=false;}\n  save(); updatePkg(id);\n});\n$('pkgs').addEventListener('click',e=>{\n  const art=e.target.closest('[data-pk]'); if(!art) return; const id=art.dataset.pk, p=cfg(cur)[id];\n  if(e.target.dataset.add){const k=e.target.dataset.kind||'prod';p.items.push({kind:k,partner:'',item:k==='wash'?WASH_TYPES[0]:'',qty:1,price:0,cost:0});save();renderPkgs();const i=p.items.length-1;const el=$(`${id}-p${i}`);if(el)el.focus();}\n  if(e.target.dataset.del!==undefined){p.items.splice(+e.target.dataset.del,1);save();renderPkgs();}\n  if(e.target.dataset.adddisc){p.disc=p.disc||[];p.disc.push({rest:'',desc:'',uses:1,val:0,darb:0});save();renderPkgs();const el=$(`${id}-dr${p.disc.length-1}`);if(el)el.focus();}\n  if(e.target.dataset.deldisc!==undefined){p.disc.splice(+e.target.dataset.deldisc,1);save();renderPkgs();}\n});\n['adS','adL','adF'].forEach(k=>$(k).addEventListener('input',e=>{cfg(cur)[k]=+e.target.value||0;save();renderPotential();}));\n$('resetBtn').addEventListener('click',()=>{store[cur.c]=defaultsFor(cur);save();renderAll();toast('رجعت إعدادات هذه المحطة للبداية');});\n$('copyBtn').addEventListener('click',()=>{\n  const c=cfg(cur), L=[];\n  L.push(['المحطة',cur.n,cur.c].join('\\t'));\n  PK.forEach(pk=>{const p=c[pk.id],r=calc(p);\n    L.push('',pk.name,['نبذة',(p.desc||'').replace(/\\s+/g,' ')].join('\\t'),['قيمة الباقة',p.price].join('\\t'),['بنزين',p.fuel].join('\\t'),\n      ['ما يدفعه العميل',r.cust].join('\\t'),['ما تدفعه درب',r.darb].join('\\t'),['سعر التكلفة',r.costPrice].join('\\t'),['ربحك من الباقة',r.profit].join('\\t'),\n      ['النوع','الشريك','المنتج / نوع الغسيل','العدد','ما يدفعه العميل','ما تدفعه درب','إجمالي العميل','إجمالي درب'].join('\\t'));\n    if((p.disc||[]).length){L.push(['خصومات المطاعم'].join('\\t'),['المطعم','الخصم','مرات الاستخدام','قيمة الخصم للمرة','ما تدفعه درب للمرة','إجمالي الخصم','إجمالي درب'].join('\\t'));p.disc.forEach(d=>L.push([d.rest,d.desc,d.uses,d.val,d.darb,(+d.uses||0)*(+d.val||0),(+d.uses||0)*(+d.darb||0)].join('\\t')));L.push(['النوع','الشريك','المنتج / نوع الغسيل','العدد','ما يدفعه العميل','ما تدفعه درب','إجمالي العميل','إجمالي درب'].join('\\t'));}\n    p.items.forEach(i=>L.push([i.kind==='wash'?'غسلة':i.kind==='aff'?'منتج خارجي (أفلييت)':'منتج',i.partner,i.item,i.qty,i.price,i.cost||0,(+i.qty||0)*(+i.price||0),(+i.qty||0)*(+i.cost||0)].join('\\t')));});\n  const txt=L.join('\\n');\n  const done=()=>toast('نُسخ الملخص، الصقه في إكسل');\n  try{navigator.clipboard.writeText(txt).then(done,()=>fallback(txt))}catch(e){fallback(txt)}\n});\nfunction fallback(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('نُسخ الملخص، الصقه في إكسل')}catch(e){toast('تعذّر النسخ')}ta.remove();}\nlet tt;function toast(m){const el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2200);}\n\nfillSelect(); renderAll();\n<\/script>\n<\/body><\/html>"};
const KEYS=["explorer", "packages", "restaurants"];
function syncTheme(f){try{const t=document.documentElement.getAttribute('data-theme');const r=f.contentDocument&&f.contentDocument.documentElement;if(!r)return;t?r.setAttribute('data-theme',t):r.removeAttribute('data-theme');}catch(e){}}
function show(k){
  if(!KEYS.includes(k))k=KEYS[0];
  KEYS.forEach(x=>{const f=document.getElementById('f-'+x),b=document.getElementById('t-'+x),on=x===k;f.hidden=!on;b.setAttribute('aria-selected',on);
    if(on&&!f.dataset.loaded){f.dataset.loaded='1';f.addEventListener('load',()=>syncTheme(f));f.srcdoc=DOCS[x];}});
  try{history.replaceState(null,'','#'+k)}catch(e){}
  try{localStorage.setItem('darb-tools-tab',k)}catch(e){}
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.k)));
new MutationObserver(()=>KEYS.forEach(x=>syncTheme(document.getElementById('f-'+x)))).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
let start=(location.hash||'').slice(1);if(!KEYS.includes(start)){try{start=localStorage.getItem('darb-tools-tab')||''}catch(e){start=''}}
show(start);
</script>
