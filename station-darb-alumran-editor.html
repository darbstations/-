<title>درب العمران — مخطط المستأجرين (قابل للتعديل)</title>

<style>
*{box-sizing:border-box}
body{margin:0; background:#F4F1EC; font-family:"Tahoma","Segoe UI","Noto Sans Arabic",sans-serif}
.bar{position:sticky; top:0; z-index:20; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  background:#ffffff; border-bottom:1px solid #e3ddd3; padding:10px 16px}
.bar b{font-size:15px; color:#2A1D14}
.bar .sp{flex:1}
.btn{font:inherit; font-size:13.5px; font-weight:700; padding:9px 16px; border-radius:100px;
  border:1px solid #E8760C; background:#E8760C; color:#fff; cursor:pointer}
.btn.ghost{background:#fff; color:#C85E05}
.btn:hover{filter:brightness(.95)}
.tip{font-size:12.5px; color:#8a7a68}
.sheet{max-width:1500px; margin:0 auto; padding:14px; background:#fff}
svg{display:block; width:100%; height:auto}
.unit .sel, .unit.sel rect:first-child{stroke:#111 !important; stroke-width:3.5 !important}
#panel{position:fixed; inset-block-end:16px; inset-inline-end:16px; z-index:30; width:290px;
  background:#fff; border:1px solid #e3ddd3; border-radius:16px; padding:16px;
  box-shadow:0 20px 44px -20px rgba(0,0,0,.35); display:none}
#panel.open{display:block}
#panel h3{margin:0 0 12px; font-size:15px; color:#2A1D14}
#panel label{display:block; font-size:12.5px; color:#6E5A48; margin:10px 0 5px; font-weight:700}
#panel input, #panel select{width:100%; font:inherit; font-size:14px; padding:9px 11px;
  border:1px solid #ddd5c8; border-radius:9px; background:#fff}
#panel .row{display:flex; gap:8px}
#hint{position:fixed; inset-block-end:16px; inset-inline-end:16px; z-index:25;
  background:#2A1D14; color:#F4E9DB; font-size:13px; padding:11px 16px; border-radius:100px}
@media print{ .bar,#panel,#hint{display:none} .sheet{max-width:none;padding:0} @page{size:A3 landscape;margin:8mm} }
</style></head><body>

<div id="panel">
  <h3>تعديل الوحدة</h3>
  <label>اسم المستأجر</label>
  <input id="fName" placeholder="اتركه فارغاً إن كانت شاغرة">

  <input id="fNum" placeholder="مثال: 86">
  <label>الحالة</label>
  <select id="fStatus">
    <option value="leased">تم التأجير</option>
    <option value="reserved">تم الحجز</option>
    <option value="vacant">محل تجاري — شاغر</option>
    <option value="dt">درايف ثرو — شاغر</option>
    <option value="market">سوبر ماركت</option>
  </select>
  <div class="row" style="margin-top:14px">
    <button class="btn ghost" id="btnClose" style="width:100%">إغلاق</button>
  </div>
</div>

<script>
var STATUS = {
  leased:   { c:'#22B04C', b:'#157A33', t:'#ffffff', label:'تم التأجير', short:'مؤجر' },
  reserved: { c:'#A8A8A8', b:'#7d7d7d', t:'#ffffff', label:'تم الحجز', short:'محجوز' },
  vacant:   { c:'#F5C542', b:'#C79A1E', t:'#6b5510', label:'محل تجاري — شاغر', short:'شاغر' },
  dt:       { c:'#F58220', b:'#C05F0A', t:'#ffffff', label:'درايف ثرو — شاغر', short:'شاغر' },
  market:   { c:'#63C5F2', b:'#2E86B8', t:'#ffffff', label:'سوبر ماركت', short:'سوبر ماركت' }
};
var ORDER = ['leased','reserved','vacant','dt','market'];
var NS = 'http://www.w3.org/2000/svg';
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function txt(x,y,size,fill,s,extra){
  return '<text x="'+x+'" y="'+y+'" font-size="'+size+'" text-anchor="middle" fill="'+fill+'" font-weight="700" font-family="Tahoma,sans-serif" '+(extra||'')+'>'+esc(s)+'</text>';
}
var LTR = 'font-family="Arial,sans-serif" direction="ltr" unicode-bidi="isolate"';

function drawUnit(g){
  var d = g.dataset, S = STATUS[d.status] || STATUS.vacant;
  var x=+d.x, y=+d.y, w=+d.w, h=+d.h, size=+d.size, cx=x+w/2, cy=y+h/2;
  var s = '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+d.r+'" fill="'+S.c+'" stroke="'+S.b+'" stroke-width="1.5"/>';
  if(d.aisles==='1'){ for(var i=0;i<6;i++){ var ax=950+i*80; s += '<line x1="'+ax+'" y1="570" x2="'+ax+'" y2="810" stroke="#ffffff" stroke-width="4" opacity="0.5"/>'; } }
  var name = d.name, num = d.num, out = (d.lx !== '');
  if(d.plate==='1'){
    var pw = Math.max(name.length*size*0.75+40, 110), ph = size*2.6;
    var py = d.logo==='mac' ? cy+4 : cy-ph/2;
    s += '<rect x="'+(cx-pw/2)+'" y="'+py+'" width="'+pw+'" height="'+ph+'" rx="9" fill="#ffffff" stroke="#e2e2e2"/>';
    if(d.logo==='mac'){
      s += '<g transform="translate('+cx+' '+(cy-9)+')" fill="none" stroke="#FFC72C" stroke-width="7.5" stroke-linecap="round">'
         + '<path d="M-26,17 C-26,-15 -9,-15 -1.5,9"/><path d="M1.5,9 C9,-15 26,-15 26,17"/></g>';
      s += txt(cx, py+ph*0.68, size, '#1a1a1a', name);
    } else {
      s += txt(cx, py+ph*0.66, size, S.b, name);
    }
    if(num) s += txt(cx, py+ph+14, 13, '#555555', num, LTR);
  } else if(!out){
    if(d.vert==='1'){
      s += '<g transform="rotate(-90 '+cx+' '+cy+')">';
      if(name) s += txt(cx, cy-5, size, S.t, name);
      if(num)  s += txt(cx, cy+11, size-4, S.t, num, LTR);
      s += '</g>';
    } else if(name){
      var parts = name.split(' ');
      var two = parts.length>1 && w < 90;
      if(two){
        s += txt(cx, cy-6, size, S.t, parts[0]);
        s += txt(cx, cy+size+2, size, S.t, parts.slice(1).join(' '));
        if(num) s += txt(cx, cy+size*2+12, 10, S.t, num, LTR);
      } else {
        s += txt(cx, cy+size*0.35, size, S.t, name);
        if(num) s += txt(cx, cy+size*0.35+16, 10, S.t, num, LTR);
      }
    } else if(num){
      s += txt(cx, cy+4, 11, S.t, num, LTR);
    } else {
      s += txt(cx, cy+size*0.35, size, S.t, S.short);
    }
  }
  g.innerHTML = s;
  var lbl = document.getElementById(g.id+'L');
  if(out){
    if(!lbl){ lbl = document.createElementNS(NS,'text'); lbl.id = g.id+'L'; document.getElementById('plan').appendChild(lbl); }
    lbl.setAttribute('x', d.lx); lbl.setAttribute('y', d.ly);
    lbl.setAttribute('font-size', d.lsize); lbl.setAttribute('text-anchor', d.lanchor);
    lbl.setAttribute('font-weight','700'); lbl.setAttribute('font-family','Tahoma,sans-serif');
    lbl.setAttribute('fill', d.status==='leased' ? '#157A33' : (d.status==='reserved' ? '#7d7d7d' : (d.status==='dt' ? '#C05F0A' : '#9a7a12')));
    lbl.textContent = name || S.short;
    lbl.style.cursor='pointer';
    lbl.onclick = function(){ select(g); };
  }
}

function drawLegend(){
  var used = {}; var gs = document.querySelectorAll('.unit');
  for(var i=0;i<gs.length;i++) used[gs[i].dataset.status] = 1;
  var keys = ORDER.filter(function(k){ return used[k]; });
  var box = document.getElementById('legend'); box.innerHTML = '';
  var items = keys.map(function(k){
    var S = STATUS[k];
    var t = document.createElementNS(NS,'text');
    t.setAttribute('y', 1370); t.setAttribute('font-size', 19); t.setAttribute('x', 0);
    t.setAttribute('fill','#333333'); t.setAttribute('font-weight','700');
    t.setAttribute('font-family','Tahoma,sans-serif');
    t.textContent = S.label; box.appendChild(t);
    var r = document.createElementNS(NS,'rect');
    r.setAttribute('y',1352); r.setAttribute('width',24); r.setAttribute('height',24); r.setAttribute('rx',5);
    r.setAttribute('fill',S.c); r.setAttribute('stroke',S.b); r.setAttribute('stroke-width',1.3);
    box.appendChild(r);
    return { t:t, r:r };
  });
  var right = 1960;
  items.forEach(function(it){
    right -= 24; it.r.setAttribute('x', right);
    var bb = it.t.getBBox();
    it.t.setAttribute('x', (right - 9) - (bb.x + bb.width));
    right = (right - 9) - bb.width - 30;
  });
}

var cur = null;
function select(g){
  if(cur) cur.classList.remove('sel');
  cur = g; g.classList.add('sel');
  var d = g.dataset;
  document.getElementById('fName').value = d.name;
  document.getElementById('fNum').value = d.num;
  document.getElementById('fStatus').value = d.status;
  document.getElementById('panel').classList.add('open');
  document.getElementById('hint').style.display = 'none';
}
function apply(){
  if(!cur) return;
  cur.dataset.name = document.getElementById('fName').value;
  cur.dataset.num = document.getElementById('fNum').value;
  cur.dataset.status = document.getElementById('fStatus').value;
  drawUnit(cur); drawLegend();
}

function boot(){
  var gs = document.querySelectorAll('.unit');
  for(var i=0;i<gs.length;i++){
    drawUnit(gs[i]);
    gs[i].style.cursor = 'pointer';
    gs[i].addEventListener('click', (function(g){ return function(){ select(g); }; })(gs[i]));
  }
  drawLegend();
  ['fName','fNum','fStatus'].forEach(function(id){
    document.getElementById(id).addEventListener('input', apply);
  });
  document.getElementById('planTitle').onclick = function(){
    var v = prompt('عنوان المخطط:', this.textContent);
    if(v!==null) this.textContent = v;
  };
  document.getElementById('planTitle').style.cursor='pointer';
  document.getElementById('btnClose').onclick = function(){
    document.getElementById('panel').classList.remove('open');
    if(cur) cur.classList.remove('sel'); cur = null;
  };
  document.getElementById('btnPng').onclick = exportPng;
  document.getElementById('btnSave').onclick = saveHtml;
}

function cleanSvg(){
  var svg = document.getElementById('plan').cloneNode(true);
  var sel = svg.querySelectorAll('.sel');
  for(var i=0;i<sel.length;i++) sel[i].classList.remove('sel');
  svg.setAttribute('xmlns', NS);
  return new XMLSerializer().serializeToString(svg);
}
function exportPng(){
  var data = cleanSvg();
  var img = new Image();
  img.onload = function(){
    var cv = document.createElement('canvas');
    cv.width = 1980*2; cv.height = 1400*2;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    var a = document.createElement('a');
    a.download = 'darb-alumran-plan.png';
    a.href = cv.toDataURL('image/png');
    a.click();
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(data);
}
function saveHtml(){
  var doc = '<!doctype html>' + document.documentElement.outerHTML;
  var a = document.createElement('a');
  a.download = 'darb-alumran-plan.html';
  a.href = URL.createObjectURL(new Blob([doc], {type:'text/html'}));
  a.click();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
</body></html>
