لة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>عامل المضخة يسلّم الكرت</h3><p>مع تسليم الباقي يعطي العامل السائق كرت الغسيل ويشير إلى رمز QR.</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>JA069</b> · كورنيش جيزان</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>من يتحمّل ماذا</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <p class=\"note\">درب لا تتحمّل قيمة العرض ولا تكلفة التعاقد مع المؤثّرين. مساهمة الشريك هي العرض، ومساهمة درب هي التنفيذ والوصول.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>JA069</b> · كورنيش جيزان</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>جازان — كورنيش جيزان</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n      <p class=\"note\">عند معدل التقاط ٥٪ فقط في هذه المحطة، الناتج ١٬٣٨٣ سيارة في الشهر — أي ١٣٬٨٣٠ ريالًا عند سعر ١٠ ريالات.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>JA069</b> · كورنيش جيزان</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">للتواصل</p>\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <p class=\"lede\">شركاء درب في المحطات — وأنت التالي في محطة كورنيش جيزان.</p>\n  <div class=\"brandrow\"><img src=\"@@brand1@@\" alt=\"\"><img src=\"@@brand2@@\" alt=\"\"><img src=\"@@brand3@@\" alt=\"\"><img src=\"@@brand4@@\" alt=\"\"><img src=\"@@brand5@@\" alt=\"\"><img src=\"@@brand6@@\" alt=\"\"><img src=\"@@brand7@@\" alt=\"\"></div>\n  <div class=\"grid\" style=\"margin-top:22px\">\n    <div class=\"card\"><div class=\"k\">فريق الحملة</div><div class=\"d\">المسؤول: ………<br>الجوال: ………<br>البريد: ………</div></div>\n    <div class=\"card\"><div class=\"k\">المحطة</div><div class=\"d\">كورنيش جيزان · JA069<br>جازان</div></div>\n    <div class=\"card\"><div class=\"k\">مصدر الأرقام</div><div class=\"d\">تحليلات مبيعات محطات درب — حركة اليوم الكامل، ٦ أشهر من البيانات.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>JA069</b> · كورنيش جيزان</span></div>\n</section>\n", "MK002": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — المعيصم · MK002 · مكة</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <p class=\"sub\">دعوة لمغسلة السيارات في محطة المعيصم للمشاركة في حملة الغسيل. الأرقام أدناه من تحليلات هذه المحطة نفسها، على مدار اليوم الكامل.</p>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٩١٣</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">٢٧٬٣٩٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٤٧٫٤ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٥ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في المعيصم نحو ٩١٣ سيارة كل يوم للتزوّد بالوقود، أي ٢٧٬٣٩٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٤٧٪ من حركة اليوم والصباح ٢٥٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٢ · العملاء المستهدفون</p>\n  <h2>من نستهدف بالحملة داخل محطة المعيصم</h2>\n  <p class=\"lede\">هؤلاء أبرز شرائح أصحاب السيارات في هذه المحطة بحسب تحليل سلوك حركتها، وذروة مرورهم عند الساعة ٥ مساءً.</p>\n  <div class=\"gains\"><div class=\"gain\"><span class=\"mark\"></span><div><b>🕋 المعتمر والزائر</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🌆 رائد المساء</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🏠 ابن الحي الوفي</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>💵 عميل الكاش</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div></div>\n  <div class=\"grid\">\n    <div class=\"card accent\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٥ مساءً</div><div class=\"d\">أعلى ساعة حركة — أفضل وقت لتكثيف توزيع الكروت.</div></div>\n    <div class=\"card\"><div class=\"k\">نصيب المساء</div><div class=\"v\">٤٧٪</div><div class=\"d\">حصة الفترة المسائية من حركة اليوم الكامل في هذه المحطة.</div></div>\n    <div class=\"card\"><div class=\"k\">متوسط التعبئة</div><div class=\"v\">٢١٫٠<small>لترًا</small></div><div class=\"d\">حجم التعبئة الواحدة — مؤشر على وقت وقوف السيارة تحت المظلة.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">٩١٣ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">٩</td><td class=\"num\">٢٧٤</td><td class=\"num\">٢٬٧٣٩ ر.س</td><td class=\"num\">٤٬١٠٩ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">٢٧</td><td class=\"num\">٨٢٢</td><td class=\"num\">٨٬٢١٧ ر.س</td><td class=\"num\">١٢٬٣٢٦ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٥٪</td><td class=\"num\">٤٦</td><td class=\"num\">١٬٣٧٠</td><td class=\"num\">١٣٬٦٩٥ ر.س</td><td class=\"num\">٢٠٬٥٤٢ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٨٪</td><td class=\"num\">٧٣</td><td class=\"num\">٢٬١٩١</td><td class=\"num\">٢١٬٩١٢ ر.س</td><td class=\"num\">٣٢٬٨٦٨ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">١١٠</td><td class=\"num\">٣٬٢٨٧</td><td class=\"num\">٣٢٬٨٦٨ ر.س</td><td class=\"num\">٤٩٬٣٠٢ ر.س</td></tr></tbody>\n  </table>\n  <p class=\"note\">نموذج حسابي مبني على حركة الوقود الفعلية في هذه المحطة وعلى فرضية سعر الغسلة، وليس مبيعات مسجّلة. الرقم الحقيقي يُثبَّت بعد أسبوعين من قياس عمليات مسح QR.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع الكروت على مدار اليوم، ولوحات المضخات ولافتات الطريق.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>حتى ٩١٣ كرت يوميًا عند المضخة</b><span>عمال المحطة يسلّمون كرت العرض للسائق على مدار اليوم في هذه المحطة.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>عامل المضخة يسلّم الكرت</h3><p>مع تسليم الباقي يعطي العامل السائق كرت الغسيل ويشير إلى رمز QR.</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>من يتحمّل ماذا</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <p class=\"note\">درب لا تتحمّل قيمة العرض ولا تكلفة التعاقد مع المؤثّرين. مساهمة الشريك هي العرض، ومساهمة درب هي التنفيذ والوصول.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>مكة — المعيصم</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n      <p class=\"note\">عند معدل التقاط ٥٪ فقط في هذه المحطة، الناتج ١٬٣٧٠ سيارة في الشهر — أي ١٣٬٦٩٥ ريالًا عند سعر ١٠ ريالات.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">للتواصل</p>\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <p class=\"lede\">شركاء درب في المحطات — وأنت التالي في محطة المعيصم.</p>\n  <div class=\"brandrow\"><img src=\"@@brand1@@\" alt=\"\"><img src=\"@@brand2@@\" alt=\"\"><img src=\"@@brand3@@\" alt=\"\"><img src=\"@@brand4@@\" alt=\"\"><img src=\"@@brand5@@\" alt=\"\"><img src=\"@@brand6@@\" alt=\"\"><img src=\"@@brand7@@\" alt=\"\"></div>\n  <div class=\"grid\" style=\"margin-top:22px\">\n    <div class=\"card\"><div class=\"k\">فريق الحملة</div><div class=\"d\">المسؤول: ………<br>الجوال: ………<br>البريد: ………</div></div>\n    <div class=\"card\"><div class=\"k\">المحطة</div><div class=\"d\">المعيصم · MK002<br>مكة</div></div>\n    <div class=\"card\"><div class=\"k\">مصدر الأرقام</div><div class=\"d\">تحليلات مبيعات محطات درب — حركة اليوم الكامل، ٦ أشهر من البيانات.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n", "MK035": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — الجمعية الوسام · MK035 · الطائف</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <p class=\"sub\">دعوة لمغسلة السيارات في محطة الجمعية الوسام للمشاركة في حملة الغسيل. الأرقام أدناه من تحليلات هذه المحطة نفسها، على مدار اليوم الكامل.</p>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٨٢٣</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">٢٤٬٦٩٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٦٦٫٣ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٥ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في الجمعية الوسام نحو ٨٢٣ سيارة كل يوم للتزوّد بالوقود، أي ٢٤٬٦٩٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٥٠٪ من حركة اليوم والصباح ٢٢٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٢ · العملاء المستهدفون</p>\n  <h2>من نستهدف بالحملة داخل محطة الجمعية الوسام</h2>\n  <p class=\"lede\">هؤلاء أبرز شرائح أصحاب السيارات في هذه المحطة بحسب تحليل سلوك حركتها، وذروة مرورهم عند الساعة ٥ مساءً.</p>\n  <div class=\"gains\"><div class=\"gain\"><span class=\"mark\"></span><div><b>🚚 الناقل التجاري</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🌆 رائد المساء</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🛣️ عابر الطريق</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>💵 عميل الكاش</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div></div>\n  <div class=\"grid\">\n    <div class=\"card accent\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٥ مساءً</div><div class=\"d\">أعلى ساعة حركة — أفضل وقت لتكثيف توزيع الكروت.</div></div>\n    <div class=\"card\"><div class=\"k\">نصيب المساء</div><div class=\"v\">٥٠٪</div><div class=\"d\">حصة الفترة المسائية من حركة اليوم الكامل في هذه المحطة.</div></div>\n    <div class=\"card\"><div class=\"k\">متوسط التعبئة</div><div class=\"v\">٣١٫٢<small>لترًا</small></div><div class=\"d\">حجم التعبئة الواحدة — مؤشر على وقت وقوف السيارة تحت المظلة.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">٨٢٣ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">٨</td><td class=\"num\">٢٤٧</td><td class=\"num\">٢٬٤٦٩ ر.س</td><td class=\"num\">٣٬٧٠٤ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">٢٥</td><td class=\"num\">٧٤١</td><td class=\"num\">٧٬٤٠٧ ر.س</td><td class=\"num\">١١٬١١٠ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٥٪</td><td class=\"num\">٤١</td><td class=\"num\">١٬٢٣٤</td><td class=\"num\">١٢٬٣٤٥ ر.س</td><td class=\"num\">١٨٬٥١٨ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٨٪</td><td class=\"num\">٦٦</td><td class=\"num\">١٬٩٧٥</td><td class=\"num\">١٩٬٧٥٢ ر.س</td><td class=\"num\">٢٩٬٦٢٨ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">٩٩</td><td class=\"num\">٢٬٩٦٣</td><td class=\"num\">٢٩٬٦٢٨ ر.س</td><td class=\"num\">٤٤٬٤٤٢ ر.س</td></tr></tbody>\n  </table>\n  <p class=\"note\">نموذج حسابي مبني على حركة الوقود الفعلية في هذه المحطة وعلى فرضية سعر الغسلة، وليس مبيعات مسجّلة. الرقم الحقيقي يُثبَّت بعد أسبوعين من قياس عمليات مسح QR.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع الكروت على مدار اليوم، ولوحات المضخات ولافتات الطريق.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>حتى ٨٢٣ كرت يوميًا عند المضخة</b><span>عمال المحطة يسلّمون كرت العرض للسائق على مدار اليوم في هذه المحطة.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>عامل المضخة يسلّم الكرت</h3><p>مع تسليم الباقي يعطي العامل السائق كرت الغسيل ويشير إلى رمز QR.</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>من يتحمّل ماذا</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <p class=\"note\">درب لا تتحمّل قيمة العرض ولا تكلفة التعاقد مع المؤثّرين. مساهمة الشريك هي العرض، ومساهمة درب هي التنفيذ والوصول.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>الطائف — الجمعية الوسام</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n      <p class=\"note\">عند معدل التقاط ٥٪ فقط في هذه المحطة، الناتج ١٬٢٣٥ سيارة في الشهر — أي ١٢٬٣٤٥ ريالًا عند سعر ١٠ ريالات.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">للتواصل</p>\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <p class=\"lede\">شركاء درب في المحطات — وأنت التالي في محطة الجمعية الوسام.</p>\n  <div class=\"brandrow\"><img src=\"@@brand1@@\" alt=\"\"><img src=\"@@brand2@@\" alt=\"\"><img src=\"@@brand3@@\" alt=\"\"><img src=\"@@brand4@@\" alt=\"\"><img src=\"@@brand5@@\" alt=\"\"><img src=\"@@brand6@@\" alt=\"\"><img src=\"@@brand7@@\" alt=\"\"></div>\n  <div class=\"grid\" style=\"margin-top:22px\">\n    <div class=\"card\"><div class=\"k\">فريق الحملة</div><div class=\"d\">المسؤول: ………<br>الجوال: ………<br>البريد: ………</div></div>\n    <div class=\"card\"><div class=\"k\">المحطة</div><div class=\"d\">الجمعية الوسام · MK035<br>الطائف</div></div>\n    <div class=\"card\"><div class=\"k\">مصدر الأرقام</div><div class=\"d\">تحليلات مبيعات محطات درب — حركة اليوم الكامل، ٦ أشهر من البيانات.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n", "MK023": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — بن درويش · MK023 · مكة</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <p class=\"sub\">دعوة لمغسلة السيارات في محطة بن درويش للمشاركة في حملة الغسيل. الأرقام أدناه من تحليلات هذه المحطة نفسها، على مدار اليوم الكامل.</p>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٨٠٧</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">٢٤٬٢١٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٤٥٫٢ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٩ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في بن درويش نحو ٨٠٧ سيارة كل يوم للتزوّد بالوقود، أي ٢٤٬٢١٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٤٧٪ من حركة اليوم والصباح ٢٣٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٢ · العملاء المستهدفون</p>\n  <h2>من نستهدف بالحملة داخل محطة بن درويش</h2>\n  <p class=\"lede\">هؤلاء أبرز شرائح أصحاب السيارات في هذه المحطة بحسب تحليل سلوك حركتها، وذروة مرورهم عند الساعة ٩ مساءً.</p>\n  <div class=\"gains\"><div class=\"gain\"><span class=\"mark\"></span><div><b>🕋 المعتمر والزائر</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🌆 رائد المساء</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>💵 عميل الكاش</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div></div>\n  <div class=\"grid\">\n    <div class=\"card accent\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٩ مساءً</div><div class=\"d\">أعلى ساعة حركة — أفضل وقت لتكثيف توزيع الكروت.</div></div>\n    <div class=\"card\"><div class=\"k\">نصيب المساء</div><div class=\"v\">٤٧٪</div><div class=\"d\">حصة الفترة المسائية من حركة اليوم الكامل في هذه المحطة.</div></div>\n    <div class=\"card\"><div class=\"k\">متوسط التعبئة</div><div class=\"v\">٢٠٫٠<small>لترًا</small></div><div class=\"d\">حجم التعبئة الواحدة — مؤشر على وقت وقوف السيارة تحت المظلة.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">٨٠٧ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">٨</td><td class=\"num\">٢٤٢</td><td class=\"num\">٢٬٤٢١ ر.س</td><td class=\"num\">٣٬٦٣٢ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">٢٤</td><td class=\"num\">٧٢٦</td><td class=\"num\">٧٬٢٦٣ ر.س</td><td class=\"num\">١٠٬٨٩٥ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٥٪</td><td class=\"num\">٤٠</td><td class=\"num\">١٬٢١٠</td><td class=\"num\">١٢٬١٠٥ ر.س</td><td class=\"num\">١٨٬١٥٨ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٨٪</td><td class=\"num\">٦٥</td><td class=\"num\">١٬٩٣٧</td><td class=\"num\">١٩٬٣٦٨ ر.س</td><td class=\"num\">٢٩٬٠٥٢ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">٩٧</td><td class=\"num\">٢٬٩٠٥</td><td class=\"num\">٢٩٬٠٥٢ ر.س</td><td class=\"num\">٤٣٬٥٧٨ ر.س</td></tr></tbody>\n  </table>\n  <p class=\"note\">نموذج حسابي مبني على حركة الوقود الفعلية في هذه المحطة وعلى فرضية سعر الغسلة، وليس مبيعات مسجّلة. الرقم الحقيقي يُثبَّت بعد أسبوعين من قياس عمليات مسح QR.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع الكروت على مدار اليوم، ولوحات المضخات ولافتات الطريق.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>حتى ٨٠٧ كرت يوميًا عند المضخة</b><span>عمال المحطة يسلّمون كرت العرض للسائق على مدار اليوم في هذه المحطة.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>عامل المضخة يسلّم الكرت</h3><p>مع تسليم الباقي يعطي العامل السائق كرت الغسيل ويشير إلى رمز QR.</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>من يتحمّل ماذا</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <p class=\"note\">درب لا تتحمّل قيمة العرض ولا تكلفة التعاقد مع المؤثّرين. مساهمة الشريك هي العرض، ومساهمة درب هي التنفيذ والوصول.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>مكة — بن درويش</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n      <p class=\"note\">عند معدل التقاط ٥٪ فقط في هذه المحطة، الناتج ١٬٢١٠ سيارة في الشهر — أي ١٢٬١٠٥ ريالًا عند سعر ١٠ ريالات.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">للتواصل</p>\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <p class=\"lede\">شركاء درب في المحطات — وأنت التالي في محطة بن درويش.</p>\n  <div class=\"brandrow\"><img src=\"@@brand1@@\" alt=\"\"><img src=\"@@brand2@@\" alt=\"\"><img src=\"@@brand3@@\" alt=\"\"><img src=\"@@brand4@@\" alt=\"\"><img src=\"@@brand5@@\" alt=\"\"><img src=\"@@brand6@@\" alt=\"\"><img src=\"@@brand7@@\" alt=\"\"></div>\n  <div class=\"grid\" style=\"margin-top:22px\">\n    <div class=\"card\"><div class=\"k\">فريق الحملة</div><div class=\"d\">المسؤول: ………<br>الجوال: ………<br>البريد: ………</div></div>\n    <div class=\"card\"><div class=\"k\">المحطة</div><div class=\"d\">بن درويش · MK023<br>مكة</div></div>\n    <div class=\"card\"><div class=\"k\">مصدر الأرقام</div><div class=\"d\">تحليلات مبيعات محطات درب — حركة اليوم الكامل، ٦ أشهر من البيانات.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n", "MK019": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — الشرايع · MK019 · مكة</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <p class=\"sub\">دعوة لمغسلة السيارات في محطة الشرايع للمشاركة في حملة الغسيل. الأرقام أدناه من تحليلات هذه المحطة نفسها، على مدار اليوم الكامل.</p>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٤٥٦</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">١٣٬٦٨٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٥٢٫٥ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٩ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في الشرايع نحو ٤٥٦ سيارة كل يوم للتزوّد بالوقود، أي ١٣٬٦٨٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٤٨٪ من حركة اليوم والصباح ٢٠٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٢ · العملاء المستهدفون</p>\n  <h2>من نستهدف بالحملة داخل محطة الشرايع</h2>\n  <p class=\"lede\">هؤلاء أبرز شرائح أصحاب السيارات في هذه المحطة بحسب تحليل سلوك حركتها، وذروة مرورهم عند الساعة ٩ مساءً.</p>\n  <div class=\"gains\"><div class=\"gain\"><span class=\"mark\"></span><div><b>🕋 المعتمر والزائر</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🌆 رائد المساء</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🌙 ساهر الليل</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>💵 عميل الكاش</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div></div>\n  <div class=\"grid\">\n    <div class=\"card accent\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٩ مساءً</div><div class=\"d\">أعلى ساعة حركة — أفضل وقت لتكثيف توزيع الكروت.</div></div>\n    <div class=\"card\"><div class=\"k\">نصيب المساء</div><div class=\"v\">٤٨٪</div><div class=\"d\">حصة الفترة المسائية من حركة اليوم الكامل في هذه المحطة.</div></div>\n    <div class=\"card\"><div class=\"k\">متوسط التعبئة</div><div class=\"v\">٢٣٫٢<small>لترًا</small></div><div class=\"d\">حجم التعبئة الواحدة — مؤشر على وقت وقوف السيارة تحت المظلة.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">٤٥٦ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">٥</td><td class=\"num\">١٣٧</td><td class=\"num\">١٬٣٦٨ ر.س</td><td class=\"num\">٢٬٠٥٢ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">١٤</td><td class=\"num\">٤١٠</td><td class=\"num\">٤٬١٠٤ ر.س</td><td class=\"num\">٦٬١٥٦ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٥٪</td><td class=\"num\">٢٣</td><td class=\"num\">٦٨٤</td><td class=\"num\">٦٬٨٤٠ ر.س</td><td class=\"num\">١٠٬٢٦٠ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٨٪</td><td class=\"num\">٣٦</td><td class=\"num\">١٬٠٩٤</td><td class=\"num\">١٠٬٩٤٤ ر.س</td><td class=\"num\">١٦٬٤١٦ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">٥٥</td><td class=\"num\">١٬٦٤٢</td><td class=\"num\">١٦٬٤١٦ ر.س</td><td class=\"num\">٢٤٬٦٢٤ ر.س</td></tr></tbody>\n  </table>\n  <p class=\"note\">نموذج حسابي مبني على حركة الوقود الفعلية في هذه المحطة وعلى فرضية سعر الغسلة، وليس مبيعات مسجّلة. الرقم الحقيقي يُثبَّت بعد أسبوعين من قياس عمليات مسح QR.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع الكروت على مدار اليوم، ولوحات المضخات ولافتات الطريق.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>حتى ٤٥٦ كرت يوميًا عند المضخة</b><span>عمال المحطة يسلّمون كرت العرض للسائق على مدار اليوم في هذه المحطة.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>عامل المضخة يسلّم الكرت</h3><p>مع تسليم الباقي يعطي العامل السائق كرت الغسيل ويشير إلى رمز QR.</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>من يتحمّل ماذا</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <p class=\"note\">درب لا تتحمّل قيمة العرض ولا تكلفة التعاقد مع المؤثّرين. مساهمة الشريك هي العرض، ومساهمة درب هي التنفيذ والوصول.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>مكة — الشرايع</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n      <p class=\"note\">عند معدل التقاط ٥٪ فقط في هذه المحطة، الناتج ٦٨٤ سيارة في الشهر — أي ٦٬٨٤٠ ريالًا عند سعر ١٠ ريالات.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">للتواصل</p>\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <p class=\"lede\">شركاء درب في المحطات — وأنت التالي في محطة الشرايع.</p>\n  <div class=\"brandrow\"><img src=\"@@brand1@@\" alt=\"\"><img src=\"@@brand2@@\" alt=\"\"><img src=\"@@brand3@@\" alt=\"\"><img src=\"@@brand4@@\" alt=\"\"><img src=\"@@brand5@@\" alt=\"\"><img src=\"@@brand6@@\" alt=\"\"><img src=\"@@brand7@@\" alt=\"\"></div>\n  <div class=\"grid\" style=\"margin-top:22px\">\n    <div class=\"card\"><div class=\"k\">فريق الحملة</div><div class=\"d\">المسؤول: ………<br>الجوال: ………<br>البريد: ………</div></div>\n    <div class=\"card\"><div class=\"k\">المحطة</div><div class=\"d\">الشرايع · MK019<br>مكة</div></div>\n    <div class=\"card\"><div class=\"k\">مصدر الأرقام</div><div class=\"d\">تحليلات مبيعات محطات درب — حركة اليوم الكامل، ٦ أشهر من البيانات.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n", "MK099": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — البيعة · MK099 · الطائف</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <p class=\"sub\">دعوة لمغسلة السيارات في محطة البيعة للمشاركة في حملة الغسيل. الأرقام أدناه من تحليلات هذه المحطة نفسها، على مدار اليوم الكامل.</p>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٤٥٥</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">١٣٬٦٥٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٤٦٫٠ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٩ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في البيعة نحو ٤٥٥ سيارة كل يوم للتزوّد بالوقود، أي ١٣٬٦٥٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٤٧٪ من حركة اليوم والصباح ١٨٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٢ · العملاء المستهدفون</p>\n  <h2>من نستهدف بالحملة داخل محطة البيعة</h2>\n  <p class=\"lede\">هؤلاء أبرز شرائح أصحاب السيارات في هذه المحطة بحسب تحليل سلوك حركتها، وذروة مرورهم عند الساعة ٩ مساءً.</p>\n  <div class=\"gains\"><div class=\"gain\"><span class=\"mark\"></span><div><b>🌆 رائد المساء</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🌙 ساهر الليل</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🏠 ابن الحي الوفي</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div></div>\n  <div class=\"grid\">\n    <div class=\"card accent\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٩ مساءً</div><div class=\"d\">أعلى ساعة حركة — أفضل وقت لتكثيف توزيع الكروت.</div></div>\n    <div class=\"card\"><div class=\"k\">نصيب المساء</div><div class=\"v\">٤٧٪</div><div class=\"d\">حصة الفترة المسائية من حركة اليوم الكامل في هذه المحطة.</div></div>\n    <div class=\"card\"><div class=\"k\">متوسط التعبئة</div><div class=\"v\">٢٠٫٣<small>لترًا</small></div><div class=\"d\">حجم التعبئة الواحدة — مؤشر على وقت وقوف السيارة تحت المظلة.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">٤٥٥ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">٥</td><td class=\"num\">١٣٦</td><td class=\"num\">١٬٣٦٥ ر.س</td><td class=\"num\">٢٬٠٤٨ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">١٤</td><td class=\"num\">٤١٠</td><td class=\"num\">٤٬٠٩٥ ر.س</td><td class=\"num\">٦٬١٤٢ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٥٪</td><td class=\"num\">٢٣</td><td class=\"num\">٦٨٢</td><td class=\"num\">٦٬٨٢٥ ر.س</td><td class=\"num\">١٠٬٢٣٨ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٨٪</td><td class=\"num\">٣٦</td><td class=\"num\">١٬٠٩٢</td><td class=\"num\">١٠٬٩٢٠ ر.س</td><td class=\"num\">١٦٬٣٨٠ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">٥٥</td><td class=\"num\">١٬٦٣٨</td><td class=\"num\">١٦٬٣٨٠ ر.س</td><td class=\"num\">٢٤٬٥٧٠ ر.س</td></tr></tbody>\n  </table>\n  <p class=\"note\">نموذج حسابي مبني على حركة الوقود الفعلية في هذه المحطة وعلى فرضية سعر الغسلة، وليس مبيعات مسجّلة. الرقم الحقيقي يُثبَّت بعد أسبوعين من قياس عمليات مسح QR.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع الكروت على مدار اليوم، ولوحات المضخات ولافتات الطريق.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>حتى ٤٥٥ كرت يوميًا عند المضخة</b><span>عمال المحطة يسلّمون كرت العرض للسائق على مدار اليوم في هذه المحطة.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>عامل المضخة يسلّم الكرت</h3><p>مع تسليم الباقي يعطي العامل السائق كرت الغسيل ويشير إلى رمز QR.</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>من يتحمّل ماذا</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <p class=\"note\">درب لا تتحمّل قيمة العرض ولا تكلفة التعاقد مع المؤثّرين. مساهمة الشريك هي العرض، ومساهمة درب هي التنفيذ والوصول.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>الطائف — البيعة</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n      <p class=\"note\">عند معدل التقاط ٥٪ فقط في هذه المحطة، الناتج ٦٨٢ سيارة في الشهر — أي ٦٬٨٢٥ ريالًا عند سعر ١٠ ريالات.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">للتواصل</p>\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <p class=\"lede\">شركاء درب في المحطات — وأنت التالي في محطة البيعة.</p>\n  <div class=\"brandrow\"><img src=\"@@brand1@@\" alt=\"\"><img src=\"@@brand2@@\" alt=\"\"><img src=\"@@brand3@@\" alt=\"\"><img src=\"@@brand4@@\" alt=\"\"><img src=\"@@brand5@@\" alt=\"\"><img src=\"@@brand6@@\" alt=\"\"><img src=\"@@brand7@@\" alt=\"\"></div>\n  <div class=\"grid\" style=\"margin-top:22px\">\n    <div class=\"card\"><div class=\"k\">فريق الحملة</div><div class=\"d\">المسؤول: ………<br>الجوال: ………<br>البريد: ………</div></div>\n    <div class=\"card\"><div class=\"k\">المحطة</div><div class=\"d\">البيعة · MK099<br>الطائف</div></div>\n    <div class=\"card\"><div class=\"k\">مصدر الأرقام</div><div class=\"d\">تحليلات مبيعات محطات درب — حركة اليوم الكامل، ٦ أشهر من البيانات.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n", "RY042": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — الناصفة · RY042 · الخرج</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <p class=\"sub\">دعوة لمغسلة السيارات في محطة الناصفة للمشاركة في حملة الغسيل. الأرقام أدناه من تحليلات هذه المحطة نفسها، على مدار اليوم الكامل.</p>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٤٠٢</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">١٢٬٠٦٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٦٢٫٨ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</d
