=\"t\">١</span><div><h3>اظهار الكيو آر للعميل</h3><p>مع توزيع كرت العرض</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>المسؤوليات</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>مكة — المعيصم</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>\n<section class=\"pg close\">\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK002</b> · المعيصم</span></div>\n</section>", "MK035": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — الجمعية الوسام · MK035 · الطائف</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٨٢٣</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">٢٤٬٦٩٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٦٦٫٣ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٥ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في الجمعية الوسام نحو ٨٢٣ سيارة كل يوم للتزوّد بالوقود، أي ٢٤٬٦٩٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٥٠٪ من حركة اليوم والصباح ٢٢٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">٨٢٣ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">٨</td><td class=\"num\">٢٤٧</td><td class=\"num\">٢٬٤٦٩ ر.س</td><td class=\"num\">٣٬٧٠٤ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">٢٥</td><td class=\"num\">٧٤١</td><td class=\"num\">٧٬٤٠٧ ر.س</td><td class=\"num\">١١٬١١٠ ر.س</td></tr><tr><td class=\"strong\">٥٪</td><td class=\"num\">٤١</td><td class=\"num\">١٬٢٣٤</td><td class=\"num\">١٢٬٣٤٥ ر.س</td><td class=\"num\">١٨٬٥١٨ ر.س</td></tr><tr><td class=\"strong\">٨٪</td><td class=\"num\">٦٦</td><td class=\"num\">١٬٩٧٥</td><td class=\"num\">١٩٬٧٥٢ ر.س</td><td class=\"num\">٢٩٬٦٢٨ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">٩٩</td><td class=\"num\">٢٬٩٦٣</td><td class=\"num\">٢٩٬٦٢٨ ر.س</td><td class=\"num\">٤٤٬٤٤٢ ر.س</td></tr></tbody>\n  </table>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع كروت عرض باسم الشريك خلال فترة الحملة.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>توزيع ١٠٠٠ كرت خلال فترة الحملة</b><span>عمال المحطة يسلّمون كرت العرض للسائق .</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>اظهار الكيو آر للعميل</h3><p>مع توزيع كرت العرض</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>المسؤوليات</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>الطائف — الجمعية الوسام</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>\n<section class=\"pg close\">\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK035</b> · الجمعية الوسام</span></div>\n</section>", "MK023": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — بن درويش · MK023 · مكة</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٨٠٧</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">٢٤٬٢١٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٤٥٫٢ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٩ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في بن درويش نحو ٨٠٧ سيارة كل يوم للتزوّد بالوقود، أي ٢٤٬٢١٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٤٧٪ من حركة اليوم والصباح ٢٣٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">٨٠٧ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">٨</td><td class=\"num\">٢٤٢</td><td class=\"num\">٢٬٤٢١ ر.س</td><td class=\"num\">٣٬٦٣٢ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">٢٤</td><td class=\"num\">٧٢٦</td><td class=\"num\">٧٬٢٦٣ ر.س</td><td class=\"num\">١٠٬٨٩٥ ر.س</td></tr><tr><td class=\"strong\">٥٪</td><td class=\"num\">٤٠</td><td class=\"num\">١٬٢١٠</td><td class=\"num\">١٢٬١٠٥ ر.س</td><td class=\"num\">١٨٬١٥٨ ر.س</td></tr><tr><td class=\"strong\">٨٪</td><td class=\"num\">٦٥</td><td class=\"num\">١٬٩٣٧</td><td class=\"num\">١٩٬٣٦٨ ر.س</td><td class=\"num\">٢٩٬٠٥٢ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">٩٧</td><td class=\"num\">٢٬٩٠٥</td><td class=\"num\">٢٩٬٠٥٢ ر.س</td><td class=\"num\">٤٣٬٥٧٨ ر.س</td></tr></tbody>\n  </table>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع كروت عرض باسم الشريك خلال فترة الحملة.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>توزيع ١٠٠٠ كرت خلال فترة الحملة</b><span>عمال المحطة يسلّمون كرت العرض للسائق .</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>اظهار الكيو آر للعميل</h3><p>مع توزيع كرت العرض</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>المسؤوليات</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>مكة — بن درويش</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>\n<section class=\"pg close\">\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK023</b> · بن درويش</span></div>\n</section>", "MK019": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — الشرايع · MK019 · مكة</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٤٥٦</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">١٣٬٦٨٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٥٢٫٥ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٩ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في الشرايع نحو ٤٥٦ سيارة كل يوم للتزوّد بالوقود، أي ١٣٬٦٨٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٤٨٪ من حركة اليوم والصباح ٢٠٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">٤٥٦ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">٥</td><td class=\"num\">١٣٧</td><td class=\"num\">١٬٣٦٨ ر.س</td><td class=\"num\">٢٬٠٥٢ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">١٤</td><td class=\"num\">٤١٠</td><td class=\"num\">٤٬١٠٤ ر.س</td><td class=\"num\">٦٬١٥٦ ر.س</td></tr><tr><td class=\"strong\">٥٪</td><td class=\"num\">٢٣</td><td class=\"num\">٦٨٤</td><td class=\"num\">٦٬٨٤٠ ر.س</td><td class=\"num\">١٠٬٢٦٠ ر.س</td></tr><tr><td class=\"strong\">٨٪</td><td class=\"num\">٣٦</td><td class=\"num\">١٬٠٩٤</td><td class=\"num\">١٠٬٩٤٤ ر.س</td><td class=\"num\">١٦٬٤١٦ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">٥٥</td><td class=\"num\">١٬٦٤٢</td><td class=\"num\">١٦٬٤١٦ ر.س</td><td class=\"num\">٢٤٬٦٢٤ ر.س</td></tr></tbody>\n  </table>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع كروت عرض باسم الشريك خلال فترة الحملة.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>توزيع ١٠٠٠ كرت خلال فترة الحملة</b><span>عمال المحطة يسلّمون كرت العرض للسائق .</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>اظهار الكيو آر للعميل</h3><p>مع توزيع كرت العرض</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>المسؤوليات</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>مكة — الشرايع</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>\n<section class=\"pg close\">\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK019</b> · الشرايع</span></div>\n</section>", "MK099": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — البيعة · MK099 · الطائف</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٤٥٥</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">١٣٬٦٥٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٤٦٫٠ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٩ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في البيعة نحو ٤٥٥ سيارة كل يوم للتزوّد بالوقود، أي ١٣٬٦٥٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٤٧٪ من حركة اليوم والصباح ١٨٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">٤٥٥ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">٥</td><td class=\"num\">١٣٦</td><td class=\"num\">١٬٣٦٥ ر.س</td><td class=\"num\">٢٬٠٤٨ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">١٤</td><td class=\"num\">٤١٠</td><td class=\"num\">٤٬٠٩٥ ر.س</td><td class=\"num\">٦٬١٤٢ ر.س</td></tr><tr><td class=\"strong\">٥٪</td><td class=\"num\">٢٣</td><td class=\"num\">٦٨٢</td><td class=\"num\">٦٬٨٢٥ ر.س</td><td class=\"num\">١٠٬٢٣٨ ر.س</td></tr><tr><td class=\"strong\">٨٪</td><td class=\"num\">٣٦</td><td class=\"num\">١٬٠٩٢</td><td class=\"num\">١٠٬٩٢٠ ر.س</td><td class=\"num\">١٦٬٣٨٠ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">٥٥</td><td class=\"num\">١٬٦٣٨</td><td class=\"num\">١٦٬٣٨٠ ر.س</td><td class=\"num\">٢٤٬٥٧٠ ر.س</td></tr></tbody>\n  </table>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع كروت عرض باسم الشريك خلال فترة الحملة.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>توزيع ١٠٠٠ كرت خلال فترة الحملة</b><span>عمال المحطة يسلّمون كرت العرض للسائق .</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>اظهار الكيو آر للعميل</h3><p>مع توزيع كرت العرض</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>المسؤوليات</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>الطائف — البيعة</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>\n<section class=\"pg close\">\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK099</b> · البيعة</span></div>\n</section>", "RY042": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — الناصفة · RY042 · الخرج</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٤٠٢</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">١٢٬٠٦٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٦٢٫٨ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٤ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في الناصفة نحو ٤٠٢ سيارة كل يوم للتزوّد بالوقود، أي ١٢٬٠٦٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٤٦٪ من حركة اليوم والصباح ٢٦٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY042</b> · الناصفة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">٤٠٢ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">٤</td><td class=\"num\">١٢١</td><td class=\"num\">١٬٢٠٦ ر.س</td><td class=\"num\">١٬٨٠٩ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">١٢</td><td class=\"num\">٣٦٢</td><td class=\"num\">٣٬٦١٨ ر.س</td><td class=\"num\">٥٬٤٢٧ ر.س</td></tr><tr><td class=\"strong\">٥٪</td><td class=\"num\">٢٠</td><td class=\"num\">٦٠٣</td><td class=\"num\">٦٬٠٣٠ ر.س</td><td class=\"num\">٩٬٠٤٥ ر.س</td></tr><tr><td class=\"strong\">٨٪</td><td class=\"num\">٣٢</td><td class=\"num\">٩٦٥</td><td class=\"num\">٩٬٦٤٨ ر.س</td><td class=\"num\">١٤٬٤٧٢ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">٤٨</td><td class=\"num\">١٬٤٤٧</td><td class=\"num\">١٤٬٤٧٢ ر.س</td><td class=\"num\">٢١٬٧٠٨ ر.س</td></tr></tbody>\n  </table>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY042</b> · الناصفة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY042</b> · الناصفة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع كروت عرض باسم الشريك خلال فترة الحملة.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY042</b> · الناصفة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY042</b> · الناصفة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY042</b> · الناصفة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>توزيع ١٠٠٠ كرت خلال فترة الحملة</b><span>عمال المحطة يسلّمون كرت العرض للسائق .</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY042</b> · الناصفة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>اظهار الكيو آر للعميل</h3><p>مع توزيع كرت العرض</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY042</b> · الناصفة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>المسؤوليات</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY042</b> · الناصفة</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>الخرج — الناصفة</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY042</b> · الناصفة</span></div>\n</section>\n<section class=\"pg close\">\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY042</b> · الناصفة</span></div>\n</section>"};

eateObjectURL(b), a=document.createElement('a');\n    a.href=u; a.download=name; document.body.appendChild(a); a.click();\n    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(u); },1000);\n  }\n  function send(base, html, done){\n    if(!(window.claude&&window.claude.downloads)){ drop(base+'.html',html); say(done); return; }\n    window.claude.downloads.save({filename:base+'.html', data:html}).then(function(){ say(done,6000); },\n      function(err){\n        var code=(err&&err.code)||'unavailable';\n        if(code==='declined'){ say('أُلغي التنزيل.'); return; }\n        try{ drop(base+'.html',html); }catch(e){}\n        window.claude.downloads.save({filename:base+'.html.txt', data:html}).then(function(){\n          say('صيغة html مقفلة هنا، فنزل الملف باسم '+base+'.html.txt — احذف «.txt» من آخر الاسم.',15000);\n        },function(){ say('تعذّر الحفظ. استخدم زر الطباعة ثم «حفظ بصيغة PDF».',9000); });\n      });\n  }\n\n  var api={ box:box, snap:snap, mark:mark, keep:keep, say:say, place:place, send:send,\n    show:function(html){ box.innerHTML=html; mark(); stack=[]; at=-1; snap(); place(null); } };\n  document.getElementById('dl').addEventListener('click',function(){ opts.download(api); });\n\n  /* أول عرض: المحفوظ إن وُجد، وإلا الأصل */\n  var saved=null; try{ saved=localStorage.getItem(opts.key); }catch(e){}\n  api.show(saved||opts.load());\n  if(saved) say('فيه تعديلات محفوظة، رجعناها لك.',5000);\n  return api;\n}\n";

/* ---------------------------------------------------------------------
   واحد لكل الحالات: صفحة المحطات، والملف المنزَّل لمحطة واحدة.
   opts.key  مفتاح الحفظ · opts.load() النص الأصلي · opts.file() الملف للتنزيل
   opts.name اسم الملف عند التنزيل
   ------------------------------------------------------------------ */
function darbEditor(opts){
  var box=document.getElementById('deck');
  var toast=document.getElementById('toast'), tT;
  var dot=document.getElementById('savedot');
  var bb=document.getElementById('bb'), target=null, editing=false;
  var stack=[], at=-1, snapT;

  function say(m,ms){ if(!toast) return; toast.textContent=m; toast.classList.add('show');
    clearTimeout(tT); tT=setTimeout(function(){ toast.classList.remove('show'); }, ms||4500); }

  var BSEL='.pg > *, .pg > .in > *, .split > *, .strip > .fact, .gains > .gain,'+
           '.tools > .tool, .clips > *, .example > .row, tbody > tr, li, img';
  function mark(){
    var p=box.querySelectorAll('.pg'), i;
    for(i=0;i<p.length;i++) p[i].setAttribute('data-block','pg');
    var n=box.querySelectorAll(BSEL);
    for(i=0;i<n.length;i++){
      if(n[i].classList.contains('art')||n[i].classList.contains('veil')) continue;
      if(!n[i].hasAttribute('data-block')) n[i].setAttribute('data-block','');
    }
  }
  function kind(el){
    if(el.tagName==='IMG') return 'صورة';
    if(el.classList.contains('pg')) return 'شريحة كاملة';
    if(el.classList.contains('gain')) return 'ميزة';
    if(el.classList.contains('tool')) return 'خدمة';
    if(el.classList.contains('fact')) return 'رقم';
    if(el.classList.contains('row')) return 'سطر';
    if(el.classList.contains('gains')||el.classList.contains('tools')||
       el.classList.contains('clips')) return 'مجموعة';
    var t=el.tagName;
    if(t==='TR') return 'صف';
    if(t==='TABLE') return 'جدول';
    if(t==='LI') return 'بند';
    if(t==='H1'||t==='H2'||t==='H3') return 'عنوان';
    return 'فقرة';
  }
  function keep(){
    try{
      localStorage.setItem(opts.key, box.innerHTML);
      var d=new Date();
      if(dot){ dot.textContent='محفوظ '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
               dot.className='savedot ok'; }
    }catch(e){ if(dot){ dot.textContent='تعذّر الحفظ'; dot.className='savedot'; } }
  }
  function ubtn(){
    document.getElementById('undo').disabled = at<=0;
    document.getElementById('redo').disabled = at>=stack.length-1;
  }
  function snap(){
    var h=box.innerHTML;
    if(at>=0 && stack[at]===h) return;
    stack=stack.slice(0,at+1); stack.push(h);
    if(stack.length>60) stack.shift();
    at=stack.length-1; ubtn();
  }
  function restore(h){ box.innerHTML=h; mark(); place(null); keep(); ubtn(); }

  function place(el){
    target=el;
    var hot=box.querySelectorAll('.hot');
    for(var i=0;i<hot.length;i++) hot[i].classList.remove('hot');
    if(!el){ bb.classList.remove('show'); return; }
    el.classList.add('hot');
    document.getElementById('bbk').textContent=kind(el);
    bb.querySelector('[data-a="img"]').hidden = el.tagName!=='IMG';
    var r=el.getBoundingClientRect();
    bb.classList.add('show');
    var top=window.scrollY+r.top-40;
    if(top < window.scrollY+6) top=window.scrollY+r.top+6;
    bb.style.top=top+'px';
    bb.style.left=Math.max(6, window.scrollX+r.left)+'px';
  }

  /* ---- استبدال صورة ---- */
  var pick=document.getElementById('pickimg');
  pick.addEventListener('change',function(){
    var f=this.files&&this.files[0]; this.value='';
    if(!f||!target||target.tagName!=='IMG') return;
    if(f.size>7*1024*1024){ say('الصورة كبيرة — اختر صورة أصغر من ٧ ميغابايت.',7000); return; }
    var r=new FileReader();
    r.onload=function(){ snap(); target.src=r.result; snap(); keep();
      say('تم استبدال الصورة.',4000); };
    r.onerror=function(){ say('تعذّرت قراءة الصورة.',5000); };
    r.readAsDataURL(f);
  });

  box.addEventListener('click',function(e){
    if(!editing) return;
    var el=e.target.closest('[data-block]');
    place(el&&box.contains(el)?el:null);
  });
  bb.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b||!target) return;
    var a=b.getAttribute('data-a');
    if(a==='img'){ pick.click(); return; }
    if(a==='out'){
      var up=target.parentElement && target.parentElement.closest('[data-block]');
      if(up && box.contains(up)) place(up); else say('هذه أكبر وحدة — الشريحة كاملة.',3000);
      return;
    }
    snap();
    if(a==='del'){ var g=target; target=null; g.parentNode.removeChild(g); place(null); }
    else if(a==='dup'){ var c2=target.cloneNode(true); target.parentNode.insertBefore(c2,target.nextSibling); place(c2); }
    else if(a==='up'&&target.previousElementSibling){ target.parentNode.insertBefore(target,target.previousElementSibling); place(target); }
    else if(a==='down'&&target.nextElementSibling){ target.parentNode.insertBefore(target.nextElementSibling,target); place(target); }
    snap(); keep();
  });
  box.addEventListener('input',function(){
    if(!editing) return;
    clearTimeout(snapT);
    snapT=setTimeout(function(){ snap(); keep(); },400);
  });

  function setEdit(on){
    editing=on;
    box.setAttribute('contenteditable', on?'true':'false');
    box.spellcheck=false;
    document.body.classList.toggle('editing', on);
    document.getElementById('edit').textContent = on?'إنهاء التحرير':'تحرير';
    ['addpg','undo','redo','reset'].forEach(function(id){ document.getElementById(id).hidden=!on; });
    if(!on) place(null);
    ubtn();
  }
  document.getElementById('edit').addEventListener('click',function(){ setEdit(!editing); });
  document.getElementById('undo').addEventListener('click',function(){
    if(at<=0) return; at--; restore(stack[at]); say('تراجع.',2000); });
  document.getElementById('redo').addEventListener('click',function(){
    if(at>=stack.length-1) return; at++; restore(stack[at]); say('إعادة.',2000); });
  document.getElementById('addpg').addEventListener('click',function(){
    snap();
    var d=document.createElement('section');
    d.className='pg';
    d.innerHTML='<p class="eyebrow">عنوان فرعي</p><h2>عنوان الشريحة</h2>'+
      '<p class="lede">اكتب هنا نص الشريحة. اضغط على أي عنصر ليظهر شريط الحذف والتكرار.</p>';
    var last=box.querySelector('.pg:last-of-type');
    if(last) last.parentNode.insertBefore(d,last.nextSibling); else box.appendChild(d);
    mark();
    d.scrollIntoView({behavior:'smooth',block:'center'});
    snap(); keep(); say('أُضيفت شريحة في آخر العرض.',4000);
  });
  var armed=false, armT;
  document.getElementById('reset').addEventListener('click',function(){
    var btn=this;
    if(!armed){ armed=true; btn.textContent='تأكيد؟';
      say('سيُلغى كل تعديل على هذه الشرائح. اضغط مرة أخرى للتأكيد.',5000);
      clearTimeout(armT); armT=setTimeout(function(){ armed=false; btn.textContent='استعادة الأصل'; },5000);
      return; }
    clearTimeout(armT); armed=false; btn.textContent='استعادة الأصل';
    snap();
    try{ localStorage.removeItem(opts.key); }catch(e){}
    box.innerHTML=opts.load(); mark();
    snap(); place(null);
    say('رجعت الشرائح إلى الأصل. «تراجع» يعيد تعديلاتك.',8000);
  });
  document.addEventListener('keydown',function(e){
    var m=e.ctrlKey||e.metaKey; if(!m) return;
    if(e.key==='z'||e.key==='Z'){ e.preventDefault();
      document.getElementById(e.shiftKey?'redo':'undo').click(); }
    if(e.key==='y'||e.key==='Y'){ e.preventDefault(); document.getElementById('redo').click(); }
  });
  document.getElementById('pr').addEventListener('click',function(){
    say('اختر «حفظ بصيغة PDF» وجهةً للطباعة، والاتجاه أفقيًا.',6000);
    setTimeout(function(){ try{ window.print(); }catch(e){} },700);
  });

  function drop(name, html){
    var b=new Blob([html],{type:'text/html;charset=utf-8'});
    var u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(u); },1000);
  }
  function send(base, html, done){
    if(!(window.claude&&window.claude.downloads)){ drop(base+'.html',html); say(done); return; }
    window.claude.downloads.save({filename:base+'.html', data:html}).then(function(){ say(done,6000); },
      function(err){
        var code=(err&&err.code)||'unavailable';
        if(code==='declined'){ say('أُلغي التنزيل.'); return; }
        try{ drop(base+'.html',html); }catch(e){}
        window.claude.downloads.save({filename:base+'.html.txt', data:html}).then(function(){
          say('صيغة html مقفلة هنا، فنزل الملف باسم '+base+'.html.txt — احذف «.txt» من آخر الاسم.',15000);
        },function(){ say('تعذّر الحفظ. استخدم زر الطباعة ثم «حفظ بصيغة PDF».',9000); });
      });
  }

  var api={ box:box, snap:snap, mark:mark, keep:keep, say:say, place:place, send:send,
    show:function(html){ box.innerHTML=html; mark(); stack=[]; at=-1; snap(); place(null); } };
  document.getElementById('dl').addEventListener('click',function(){ opts.download(api); });

  /* أول عرض: المحفوظ إن وُجد، وإلا الأصل */
  var saved=null; try{ saved=localStorage.getItem(opts.key); }catch(e){}
  api.show(saved||opts.load());
  if(saved) say('فيه تعديلات محفوظة، رجعناها لك.',5000);
  return api;
}

(function(){
  function fill(h){ return h.replace(/@@([a-z0-9]+)@@/g, function(_,k){ return IMGS[k]||''; }); }
  var sel=document.getElementById('pick');

  function clean(h){
    var t=document.createElement('div'); t.innerHTML=h;
    var n=t.querySelectorAll('[data-block]'), i;
    for(i=0;i<n.length;i++) n[i].removeAttribute('data-block');
    n=t.querySelectorAll('.hot'); for(i=0;i<n.length;i++) n[i].classList.remove('hot');
    n=t.querySelectorAll('[contenteditable]');
    for(i=0;i<n.length;i++) n[i].removeAttribute('contenteditable');
    return t.innerHTML;
  }
  /* الملف المنزَّل يحمل نفس الأدوات: تحرير وحذف وإضافة وصور وتراجع وإعادة */
  function fileFor(c, html){
    var title='حملة غسيل السيارات — '+NAMES[c]+' '+c;
    var body=clean(html!=null?html:fill(DECKS[c]));
    return '<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n'+
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
      '<title>'+title+'</title>\n'+CSSTEXT+'\n</head>\n<body>\n'+
      EXPORTBAR.replace('@@TITLE@@', 'محطة '+NAMES[c]+' · '+c)+
      '\n<div class="wrap"><div id="deck">'+body+'</div></div>\n'+
      "\n<div class=\"blockbar\" id=\"bb\">\n  <span class=\"kind\" id=\"bbk\">فقرة</span>\n  <button type=\"button\" data-a=\"img\" class=\"img\" hidden>استبدال الصورة</button>\n  <button type=\"button\" data-a=\"out\" title=\"تحديد العنصر الأكبر\">⤴</button>\n  <button type=\"button\" data-a=\"up\" title=\"لأعلى\">▲</button>\n  <button type=\"button\" data-a=\"down\" title=\"لأسفل\">▼</button>\n  <button type=\"button\" data-a=\"dup\">تكرار</button>\n  <button type=\"button\" data-a=\"del\" class=\"del\">حذف</button>\n</div>\n<div class=\"toast\" id=\"toast\"></div>\n<input type=\"file\" id=\"pickimg\" accept=\"image/*\" hidden>"+
      '\n<script>\n'+DARBEDITOR+'\n'+
      'var ORIGINAL='+'document.getElementById("deck").innerHTML;\n'+
      'darbEditor({key:'+JSON.stringify('darb-station-'+c)+',\n'+
      '  load:function(){ return ORIGINAL; },\n'+
      '  download:function(api){ api.send('+JSON.stringify('darb-carwash-'+c)+
      ', document.documentElement.outerHTML.replace(/^/,"<!doctype html>\\n"),'+
      ' '+JSON.stringify('نُزّل ملف محطة '+NAMES[c]+' بتعديلاتك.')+'); }});\n'+
      '<\/script>\n</body>\n</html>\n';
  }

  var ed=darbEditor({
    key:'darb-carwash-slides-v2-'+sel.value,
    load:function(){ return fill(DECKS[sel.value]); },
    download:function(api){
      var c=sel.value;
      api.send('darb-carwash-'+c, fileFor(c, api.box.innerHTML),
               'نُزّل ملف محطة '+NAMES[c]+' جاهزًا للإرسال، وهو نفسه قابل للتعديل.');
    }
  });
  function load(c){
    var saved=null; try{ saved=localStorage.getItem('darb-carwash-slides-v2-'+c); }catch(e){}
    return saved || fill(DECKS[c]);
  }
  sel.addEventListener('change',function(){
    ed.key='darb-carwash-slides-v2-'+this.value;
    ed.show(load(this.value));
    document.title='حملة غسيل السيارات — '+NAMES[this.value]+' '+this.value;
    window.scrollTo(0,0);
  });
  document.getElementById('dlall').addEventListener('click',function(){
    var codes=Object.keys(DECKS), i=0;
    (function next(){
      if(i>=codes.length){ ed.say('نُزّلت ملفات المحطات الإحدى عشرة.',7000); return; }
      var c=codes[i++];
      var body=(c===sel.value)?ed.box.innerHTML:load(c);
      drop('darb-carwash-'+c+'.html', fileFor(c, body));
      setTimeout(next, 450);
    })();
    ed.say('يجري تنزيل ملف لكل محطة…',6000);
  });
  function drop(name, html){
    var b=new Blob([html],{type:'text/html;charset=utf-8'});
    var u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(u); },1000);
  }
  document.title='حملة غسيل السيارات — '+NAMES[sel.value]+' '+sel.value;
})();
</script>
</body>
</html>
