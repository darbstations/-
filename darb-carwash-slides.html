<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حملة غسيل السيارات — عروض المحطات</title>
<style>

:root{
  --ink:#2A1D12; --ink-2:#6B5744; --ink-3:#9A8674;
  --ground:#FBF6EF; --surface:#F4E9DB; --line:#E0D0BA; --sand:#F1E2CC;
  --orange:#C85E05; --orange-hi:#E8760C; --amber:#F59A2E; --deep:#3A2416;
  --ok:#1B7A4B;
}
*{box-sizing:border-box}
html,body{margin:0;background:#2A1D12;color:var(--ink);
  font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:800}
p{margin:0}
.wrap{padding:26px 18px 60px}

/* ---------- the sheet ---------- */
.pg{width:1120px;height:630px;margin:0 auto 22px;background:var(--ground);
  border-radius:10px;overflow:hidden;position:relative;
  box-shadow:0 18px 44px rgba(0,0,0,.35);display:flex;flex-direction:column;
  padding:46px 54px 44px}
.pg .eyebrow{font-size:12px;letter-spacing:.16em;color:var(--orange);font-weight:800;
  margin-bottom:10px}
.pg h2{font-size:33px;margin-bottom:8px}
.pg .lede{font-size:15.5px;line-height:1.85;color:var(--ink-2);max-width:78ch}
.pg .foot{position:absolute;inset-inline:54px;bottom:18px;display:flex;
  justify-content:space-between;font-size:11.5px;color:var(--ink-3)}
.pg .foot b{color:var(--orange);font-weight:800}

/* ---------- cover ---------- */
.pg.cover{background:var(--deep);color:#FBF6EF;padding:0}
.pg.cover .art{position:absolute;inset:0}
.pg.cover .art img{width:100%;height:100%;object-fit:cover;opacity:.42}
.pg.cover .veil{position:absolute;inset:0;
  background:linear-gradient(270deg,rgba(42,29,18,.96) 34%,rgba(42,29,18,.55) 100%)}
.pg.cover .in{position:relative;padding:46px 54px;display:flex;flex-direction:column;height:100%}
.pg.cover .brand{display:flex;align-items:center;gap:12px;font-size:12.5px;color:#E4D3BC}
.pg.cover .brand img{height:26px;width:auto;border-radius:3px}
.pg.cover h1{font-size:46px;color:#fff;margin-top:26px;line-height:1.2}
.pg.cover h1 .hl{color:var(--amber)}
.pg.cover .sub{margin-top:14px;font-size:15px;line-height:1.9;color:#D9C7B2;max-width:62ch}
.pg.cover .strip{margin-top:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
.pg.cover .fact{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  border-radius:7px;padding:12px 14px}
.pg.cover .fact .k{font-size:10.5px;letter-spacing:.06em;color:#C6B29A}
.pg.cover .fact .v{font-size:26px;font-weight:800;color:#fff;line-height:1.3;
  font-variant-numeric:tabular-nums}
.pg.cover .fact .u{font-size:10.5px;color:#B49F86}
.pg.cover .tag{position:absolute;top:46px;inset-inline-start:54px;
  border:1px solid var(--amber);color:var(--amber);border-radius:99px;padding:3px 12px;
  font-size:11px;font-weight:800}

/* ---------- blocks ---------- */
.gains{display:grid;gap:9px;margin-top:16px}
.gain{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.gain .mark{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:8px}
.gain b{display:block;font-size:14.5px;margin-bottom:2px}
.gain span{font-size:13px;line-height:1.75;color:var(--ink-2)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center;margin-top:16px}
.split img{width:100%;height:330px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:15px 17px}
.card.accent{border-color:var(--orange);
  background:color-mix(in srgb,var(--orange-hi) 10%,var(--surface))}
.card .k{font-size:11px;letter-spacing:.06em;color:var(--ink-2)}
.card .v{font-size:27px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums}
.card .v small{font-size:13px;font-weight:700;color:var(--ink-2);margin-inline-start:4px}
.card .d{font-size:12px;line-height:1.7;color:var(--ink-2);margin-top:5px}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface);
  border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:16px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line)}
thead th{background:var(--sand);font-size:11px;letter-spacing:.07em;color:var(--ink-2);
  white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.num,td.strong{font-weight:800;font-variant-numeric:tabular-nums}
tr.hot td{background:color-mix(in srgb,var(--orange-hi) 13%,transparent)}
td.yes{color:var(--ok);font-weight:800}
td.no{color:var(--ink-3)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tool{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 15px}
.tool .t{width:26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:13px}
.tool h3{font-size:14px}
.tool p{font-size:12.5px;line-height:1.7;color:var(--ink-2);margin-top:3px}
.tool .reach{font-size:10.5px;color:var(--orange);font-weight:800}
.clips{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:16px}
.clips img{width:100%;height:250px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
.brandrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;
  margin-top:20px}
.brandrow img{height:56px;width:auto;border-radius:6px;background:#fff;padding:5px}
.note{font-size:12px;color:var(--ink-3);margin-top:12px;line-height:1.75}
.example{background:var(--surface);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.example .row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:11px 16px;
  border-bottom:1px solid var(--line);font-size:13.5px}
.example .row:last-child{border-bottom:0}
.example .row span{color:var(--ink-2)}
.cardshot{width:100%;height:330px;object-fit:contain;background:var(--sand);
  border-radius:7px;border:1px solid var(--line)}

/* ---------- picker ---------- */
.bar{position:sticky;top:0;z-index:30;background:#2A1D12;padding:14px 18px;
  border-bottom:1px solid #4A3524}
.bar .in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:11px;align-items:center}
.bar label{font-size:12px;letter-spacing:.05em;font-weight:800;color:#C6B29A}
.bar select{background:#3A2416;border:1px solid #5A4330;border-radius:6px;padding:9px 13px;
  font:inherit;color:#FBF6EF;min-width:280px}
.bar button{background:var(--orange);border:0;color:#fff;border-radius:6px;padding:10px 18px;
  font:inherit;font-weight:800;cursor:pointer}
.bar button:hover{background:var(--orange-hi)}
.bar button.ghost{background:transparent;border:1px solid #5A4330;color:#E4D3BC}
.bar .hint{font-size:12px;color:#9A8674}
.toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:92vw;
  background:#151515;color:#fff;border-radius:7px;padding:12px 20px;font-size:13.5px;
  opacity:0;transition:.18s;pointer-events:none;z-index:60}
.toast.show{opacity:1}

@media (max-width:1200px){
  .pg{width:100%;height:auto;min-height:0;padding:32px 26px 40px}
  .pg.cover .in{padding:32px 26px}
  .pg.cover h1{font-size:34px}
  .pg.cover .strip{grid-template-columns:repeat(2,1fr)}
  .split,.tools{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .clips{grid-template-columns:repeat(3,1fr)}
  .clips img{height:200px}
  .pg .foot{position:static;margin-top:18px;inset-inline:auto}
}
@media print{
  html,body{background:#fff}
  .bar,.toast{display:none !important}
  .wrap{padding:0}
  .pg{width:100%;height:auto;margin:0;border-radius:0;box-shadow:none;
      break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  @page{size:A4 landscape;margin:10mm}
}
</style>
</head>
<body>

<div class="bar">
  <div class="in">
    <label for="pick">المحطة</label>
    <select id="pick"><option value="MK072" selected>MK072 · العزيزية — مكة</option><option value="MK015">MK015 · النسيم — جدة</option><option value="MK017">MK017 · عرفات الشوقية — مكة</option><option value="RY075">RY075 · الدائري الشمالي — الرياض</option><option value="JA069">JA069 · كورنيش جيزان — جازان</option><option value="MK002">MK002 · المعيصم — مكة</option><option value="MK035">MK035 · الجمعية الوسام — الطائف</option><option value="MK023">MK023 · بن درويش — مكة</option><option value="MK019">MK019 · الشرايع — مكة</option><option value="MK099">MK099 · البيعة — الطائف</option><option value="RY042">RY042 · الناصفة — الخرج</option></select>
    <button type="button" id="dl">تنزيل ملف هذه المحطة</button>
    <button type="button" class="ghost" id="dlall">تنزيل ملفات كل المحطات</button>
    <button type="button" class="ghost" id="pr">طباعة / PDF</button>
    <span class="hint">الملف المُنزَّل شرائح جاهزة للإرسال للشريك، بأرقام هذه المحطة وحدها.</span>
  </div>
</div>
<div class="wrap"><div id="deck"></div></div>
<div class="toast" id="toast"></div>

<script>
var DECKS={"MK072": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — العزيزية · MK072 · مكة</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <p class=\"sub\">دعوة لمغسلة السيارات في محطة العزيزية للمشاركة في حملة الغسيل. الأرقام أدناه من تحليلات هذه المحطة نفسها، على مدار اليوم الكامل.</p>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٢٬٣٥٩</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">٧٠٬٧٧٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٤٨٫٤ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٥ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في العزيزية نحو ٢٬٣٥٩ سيارة كل يوم للتزوّد بالوقود، أي ٧٠٬٧٧٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٣٩٪ من حركة اليوم والصباح ٢٣٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK072</b> · العزيزية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٢ · العملاء المستهدفون</p>\n  <h2>من نستهدف بالحملة داخل محطة العزيزية</h2>\n  <p class=\"lede\">هؤلاء أبرز شرائح أصحاب السيارات في هذه المحطة بحسب تحليل سلوك حركتها، وذروة مرورهم عند الساعة ٥ مساءً.</p>\n  <div class=\"gains\"><div class=\"gain\"><span class=\"mark\"></span><div><b>🕋 المعتمر والزائر</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🌙 ساهر الليل</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🏠 ابن الحي الوفي</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>💵 عميل الكاش</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div></div>\n  <div class=\"grid\">\n    <div class=\"card accent\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٥ مساءً</div><div class=\"d\">أعلى ساعة حركة — أفضل وقت لتكثيف توزيع الكروت.</div></div>\n    <div class=\"card\"><div class=\"k\">نصيب المساء</div><div class=\"v\">٣٩٪</div><div class=\"d\">حصة الفترة المسائية من حركة اليوم الكامل في هذه المحطة.</div></div>\n    <div class=\"card\"><div class=\"k\">متوسط التعبئة</div><div class=\"v\">٢٢٫٤<small>لترًا</small></div><div class=\"d\">حجم التعبئة الواحدة — مؤشر على وقت وقوف السيارة تحت المظلة.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK072</b> · العزيزية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">٢٬٣٥٩ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">٢٤</td><td class=\"num\">٧٠٨</td><td class=\"num\">٧٬٠٧٧ ر.س</td><td class=\"num\">١٠٬٦١٦ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">٧١</td><td class=\"num\">٢٬١٢٣</td><td class=\"num\">٢١٬٢٣١ ر.س</td><td class=\"num\">٣١٬٨٤٦ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٥٪</td><td class=\"num\">١١٨</td><td class=\"num\">٣٬٥٣٨</td><td class=\"num\">٣٥٬٣٨٥ ر.س</td><td class=\"num\">٥٣٬٠٧٨ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٨٪</td><td class=\"num\">١٨٩</td><td class=\"num\">٥٬٦٦٢</td><td class=\"num\">٥٦٬٦١٦ ر.س</td><td class=\"num\">٨٤٬٩٢٤ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">٢٨٣</td><td class=\"num\">٨٬٤٩٢</td><td class=\"num\">٨٤٬٩٢٤ ر.س</td><td class=\"num\">١٢٧٬٣٨٦ ر.س</td></tr></tbody>\n  </table>\n  <p class=\"note\">نموذج حسابي مبني على حركة الوقود الفعلية في هذه المحطة وعلى فرضية سعر الغسلة، وليس مبيعات مسجّلة. الرقم الحقيقي يُثبَّت بعد أسبوعين من قياس عمليات مسح QR.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK072</b> · العزيزية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK072</b> · العزيزية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع الكروت على مدار اليوم، ولوحات المضخات ولافتات الطريق.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK072</b> · العزيزية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK072</b> · العزيزية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK072</b> · العزيزية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>حتى ٢٬٣٥٩ كرت يوميًا عند المضخة</b><span>عمال المحطة يسلّمون كرت العرض للسائق على مدار اليوم في هذه المحطة.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK072</b> · العزيزية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>عامل المضخة يسلّم الكرت</h3><p>مع تسليم الباقي يعطي العامل السائق كرت الغسيل ويشير إلى رمز QR.</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK072</b> · العزيزية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>من يتحمّل ماذا</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <p class=\"note\">درب لا تتحمّل قيمة العرض ولا تكلفة التعاقد مع المؤثّرين. مساهمة الشريك هي العرض، ومساهمة درب هي التنفيذ والوصول.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK072</b> · العزيزية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>مكة — العزيزية</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n      <p class=\"note\">عند معدل التقاط ٥٪ فقط في هذه المحطة، الناتج ٣٬٥٣٨ سيارة في الشهر — أي ٣٥٬٣٨٥ ريالًا عند سعر ١٠ ريالات.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK072</b> · العزيزية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">للتواصل</p>\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <p class=\"lede\">شركاء درب في المحطات — وأنت التالي في محطة العزيزية.</p>\n  <div class=\"brandrow\"><img src=\"@@brand1@@\" alt=\"\"><img src=\"@@brand2@@\" alt=\"\"><img src=\"@@brand3@@\" alt=\"\"><img src=\"@@brand4@@\" alt=\"\"><img src=\"@@brand5@@\" alt=\"\"><img src=\"@@brand6@@\" alt=\"\"><img src=\"@@brand7@@\" alt=\"\"></div>\n  <div class=\"grid\" style=\"margin-top:22px\">\n    <div class=\"card\"><div class=\"k\">فريق الحملة</div><div class=\"d\">المسؤول: ………<br>الجوال: ………<br>البريد: ………</div></div>\n    <div class=\"card\"><div class=\"k\">المحطة</div><div class=\"d\">العزيزية · MK072<br>مكة</div></div>\n    <div class=\"card\"><div class=\"k\">مصدر الأرقام</div><div class=\"d\">تحليلات مبيعات محطات درب — حركة اليوم الكامل، ٦ أشهر من البيانات.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK072</b> · العزيزية</span></div>\n</section>\n", "MK015": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — النسيم · MK015 · جدة</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <p class=\"sub\">دعوة لمغسلة السيارات في محطة النسيم للمشاركة في حملة الغسيل. الأرقام أدناه من تحليلات هذه المحطة نفسها، على مدار اليوم الكامل.</p>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٢٬٠٤١</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">٦١٬٢٣٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٤٩٫٨ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٨ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في النسيم نحو ٢٬٠٤١ سيارة كل يوم للتزوّد بالوقود، أي ٦١٬٢٣٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٤٥٪ من حركة اليوم والصباح ٢٢٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK015</b> · النسيم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٢ · العملاء المستهدفون</p>\n  <h2>من نستهدف بالحملة داخل محطة النسيم</h2>\n  <p class=\"lede\">هؤلاء أبرز شرائح أصحاب السيارات في هذه المحطة بحسب تحليل سلوك حركتها، وذروة مرورهم عند الساعة ٨ مساءً.</p>\n  <div class=\"gains\"><div class=\"gain\"><span class=\"mark\"></span><div><b>🌆 رائد المساء</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🌙 ساهر الليل</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🏠 ابن الحي الوفي</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div></div>\n  <div class=\"grid\">\n    <div class=\"card accent\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٨ مساءً</div><div class=\"d\">أعلى ساعة حركة — أفضل وقت لتكثيف توزيع الكروت.</div></div>\n    <div class=\"card\"><div class=\"k\">نصيب المساء</div><div class=\"v\">٤٥٪</div><div class=\"d\">حصة الفترة المسائية من حركة اليوم الكامل في هذه المحطة.</div></div>\n    <div class=\"card\"><div class=\"k\">متوسط التعبئة</div><div class=\"v\">٢٢٫١<small>لترًا</small></div><div class=\"d\">حجم التعبئة الواحدة — مؤشر على وقت وقوف السيارة تحت المظلة.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK015</b> · النسيم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">٢٬٠٤١ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">٢٠</td><td class=\"num\">٦١٢</td><td class=\"num\">٦٬١٢٣ ر.س</td><td class=\"num\">٩٬١٨٤ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">٦١</td><td class=\"num\">١٬٨٣٧</td><td class=\"num\">١٨٬٣٦٩ ر.س</td><td class=\"num\">٢٧٬٥٥٣ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٥٪</td><td class=\"num\">١٠٢</td><td class=\"num\">٣٬٠٦٢</td><td class=\"num\">٣٠٬٦١٥ ر.س</td><td class=\"num\">٤٥٬٩٢٢ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٨٪</td><td class=\"num\">١٦٣</td><td class=\"num\">٤٬٨٩٨</td><td class=\"num\">٤٨٬٩٨٤ ر.س</td><td class=\"num\">٧٣٬٤٧٦ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">٢٤٥</td><td class=\"num\">٧٬٣٤٨</td><td class=\"num\">٧٣٬٤٧٦ ر.س</td><td class=\"num\">١١٠٬٢١٤ ر.س</td></tr></tbody>\n  </table>\n  <p class=\"note\">نموذج حسابي مبني على حركة الوقود الفعلية في هذه المحطة وعلى فرضية سعر الغسلة، وليس مبيعات مسجّلة. الرقم الحقيقي يُثبَّت بعد أسبوعين من قياس عمليات مسح QR.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK015</b> · النسيم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK015</b> · النسيم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع الكروت على مدار اليوم، ولوحات المضخات ولافتات الطريق.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK015</b> · النسيم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK015</b> · النسيم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK015</b> · النسيم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>حتى ٢٬٠٤١ كرت يوميًا عند المضخة</b><span>عمال المحطة يسلّمون كرت العرض للسائق على مدار اليوم في هذه المحطة.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK015</b> · النسيم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>عامل المضخة يسلّم الكرت</h3><p>مع تسليم الباقي يعطي العامل السائق كرت الغسيل ويشير إلى رمز QR.</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK015</b> · النسيم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>من يتحمّل ماذا</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <p class=\"note\">درب لا تتحمّل قيمة العرض ولا تكلفة التعاقد مع المؤثّرين. مساهمة الشريك هي العرض، ومساهمة درب هي التنفيذ والوصول.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK015</b> · النسيم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>جدة — النسيم</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n      <p class=\"note\">عند معدل التقاط ٥٪ فقط في هذه المحطة، الناتج ٣٬٠٦٢ سيارة في الشهر — أي ٣٠٬٦١٥ ريالًا عند سعر ١٠ ريالات.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK015</b> · النسيم</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">للتواصل</p>\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <p class=\"lede\">شركاء درب في المحطات — وأنت التالي في محطة النسيم.</p>\n  <div class=\"brandrow\"><img src=\"@@brand1@@\" alt=\"\"><img src=\"@@brand2@@\" alt=\"\"><img src=\"@@brand3@@\" alt=\"\"><img src=\"@@brand4@@\" alt=\"\"><img src=\"@@brand5@@\" alt=\"\"><img src=\"@@brand6@@\" alt=\"\"><img src=\"@@brand7@@\" alt=\"\"></div>\n  <div class=\"grid\" style=\"margin-top:22px\">\n    <div class=\"card\"><div class=\"k\">فريق الحملة</div><div class=\"d\">المسؤول: ………<br>الجوال: ………<br>البريد: ………</div></div>\n    <div class=\"card\"><div class=\"k\">المحطة</div><div class=\"d\">النسيم · MK015<br>جدة</div></div>\n    <div class=\"card\"><div class=\"k\">مصدر الأرقام</div><div class=\"d\">تحليلات مبيعات محطات درب — حركة اليوم الكامل، ٣ أشهر من البيانات.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK015</b> · النسيم</span></div>\n</section>\n", "MK017": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — عرفات الشوقية · MK017 · مكة</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <p class=\"sub\">دعوة لمغسلة السيارات في محطة عرفات الشوقية للمشاركة في حملة الغسيل. الأرقام أدناه من تحليلات هذه المحطة نفسها، على مدار اليوم الكامل.</p>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">١٬٢٩٠</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">٣٨٬٧٠٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٤٧٫٧ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٩ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في عرفات الشوقية نحو ١٬٢٩٠ سيارة كل يوم للتزوّد بالوقود، أي ٣٨٬٧٠٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٤٨٪ من حركة اليوم والصباح ٢٠٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK017</b> · عرفات الشوقية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٢ · العملاء المستهدفون</p>\n  <h2>من نستهدف بالحملة داخل محطة عرفات الشوقية</h2>\n  <p class=\"lede\">هؤلاء أبرز شرائح أصحاب السيارات في هذه المحطة بحسب تحليل سلوك حركتها، وذروة مرورهم عند الساعة ٩ مساءً.</p>\n  <div class=\"gains\"><div class=\"gain\"><span class=\"mark\"></span><div><b>🕋 المعتمر والزائر</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🌆 رائد المساء</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>💵 عميل الكاش</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div></div>\n  <div class=\"grid\">\n    <div class=\"card accent\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٩ مساءً</div><div class=\"d\">أعلى ساعة حركة — أفضل وقت لتكثيف توزيع الكروت.</div></div>\n    <div class=\"card\"><div class=\"k\">نصيب المساء</div><div class=\"v\">٤٨٪</div><div class=\"d\">حصة الفترة المسائية من حركة اليوم الكامل في هذه المحطة.</div></div>\n    <div class=\"card\"><div class=\"k\">متوسط التعبئة</div><div class=\"v\">٢١٫١<small>لترًا</small></div><div class=\"d\">حجم التعبئة الواحدة — مؤشر على وقت وقوف السيارة تحت المظلة.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK017</b> · عرفات الشوقية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">١٬٢٩٠ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">١٣</td><td class=\"num\">٣٨٧</td><td class=\"num\">٣٬٨٧٠ ر.س</td><td class=\"num\">٥٬٨٠٥ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">٣٩</td><td class=\"num\">١٬١٦١</td><td class=\"num\">١١٬٦١٠ ر.س</td><td class=\"num\">١٧٬٤١٥ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٥٪</td><td class=\"num\">٦٤</td><td class=\"num\">١٬٩٣٥</td><td class=\"num\">١٩٬٣٥٠ ر.س</td><td class=\"num\">٢٩٬٠٢٥ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٨٪</td><td class=\"num\">١٠٣</td><td class=\"num\">٣٬٠٩٦</td><td class=\"num\">٣٠٬٩٦٠ ر.س</td><td class=\"num\">٤٦٬٤٤٠ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">١٥٥</td><td class=\"num\">٤٬٦٤٤</td><td class=\"num\">٤٦٬٤٤٠ ر.س</td><td class=\"num\">٦٩٬٦٦٠ ر.س</td></tr></tbody>\n  </table>\n  <p class=\"note\">نموذج حسابي مبني على حركة الوقود الفعلية في هذه المحطة وعلى فرضية سعر الغسلة، وليس مبيعات مسجّلة. الرقم الحقيقي يُثبَّت بعد أسبوعين من قياس عمليات مسح QR.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK017</b> · عرفات الشوقية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK017</b> · عرفات الشوقية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع الكروت على مدار اليوم، ولوحات المضخات ولافتات الطريق.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK017</b> · عرفات الشوقية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK017</b> · عرفات الشوقية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK017</b> · عرفات الشوقية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>حتى ١٬٢٩٠ كرت يوميًا عند المضخة</b><span>عمال المحطة يسلّمون كرت العرض للسائق على مدار اليوم في هذه المحطة.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK017</b> · عرفات الشوقية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>عامل المضخة يسلّم الكرت</h3><p>مع تسليم الباقي يعطي العامل السائق كرت الغسيل ويشير إلى رمز QR.</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK017</b> · عرفات الشوقية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>من يتحمّل ماذا</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <p class=\"note\">درب لا تتحمّل قيمة العرض ولا تكلفة التعاقد مع المؤثّرين. مساهمة الشريك هي العرض، ومساهمة درب هي التنفيذ والوصول.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK017</b> · عرفات الشوقية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>مكة — عرفات الشوقية</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n      <p class=\"note\">عند معدل التقاط ٥٪ فقط في هذه المحطة، الناتج ١٬٩٣٥ سيارة في الشهر — أي ١٩٬٣٥٠ ريالًا عند سعر ١٠ ريالات.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK017</b> · عرفات الشوقية</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">للتواصل</p>\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <p class=\"lede\">شركاء درب في المحطات — وأنت التالي في محطة عرفات الشوقية.</p>\n  <div class=\"brandrow\"><img src=\"@@brand1@@\" alt=\"\"><img src=\"@@brand2@@\" alt=\"\"><img src=\"@@brand3@@\" alt=\"\"><img src=\"@@brand4@@\" alt=\"\"><img src=\"@@brand5@@\" alt=\"\"><img src=\"@@brand6@@\" alt=\"\"><img src=\"@@brand7@@\" alt=\"\"></div>\n  <div class=\"grid\" style=\"margin-top:22px\">\n    <div class=\"card\"><div class=\"k\">فريق الحملة</div><div class=\"d\">المسؤول: ………<br>الجوال: ………<br>البريد: ………</div></div>\n    <div class=\"card\"><div class=\"k\">المحطة</div><div class=\"d\">عرفات الشوقية · MK017<br>مكة</div></div>\n    <div class=\"card\"><div class=\"k\">مصدر الأرقام</div><div class=\"d\">تحليلات مبيعات محطات درب — حركة اليوم الكامل، ٦ أشهر من البيانات.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>MK017</b> · عرفات الشوقية</span></div>\n</section>\n", "RY075": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — الدائري الشمالي · RY075 · الرياض</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <p class=\"sub\">دعوة لمغسلة السيارات في محطة الدائري الشمالي للمشاركة في حملة الغسيل. الأرقام أدناه من تحليلات هذه المحطة نفسها، على مدار اليوم الكامل.</p>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">١٬١٦٩</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">٣٥٬٠٧٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٧٤٫٣ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٨ مساءً</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في الدائري الشمالي نحو ١٬١٦٩ سيارة كل يوم للتزوّد بالوقود، أي ٣٥٬٠٧٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٤٤٪ من حركة اليوم والصباح ٢٣٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY075</b> · الدائري الشمالي</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٢ · العملاء المستهدفون</p>\n  <h2>من نستهدف بالحملة داخل محطة الدائري الشمالي</h2>\n  <p class=\"lede\">هؤلاء أبرز شرائح أصحاب السيارات في هذه المحطة بحسب تحليل سلوك حركتها، وذروة مرورهم عند الساعة ٨ مساءً.</p>\n  <div class=\"gains\"><div class=\"gain\"><span class=\"mark\"></span><div><b>🌆 رائد المساء</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🛣️ عابر الطريق</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🚙 قائد الدفع الرباعي</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div></div>\n  <div class=\"grid\">\n    <div class=\"card accent\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">٨ مساءً</div><div class=\"d\">أعلى ساعة حركة — أفضل وقت لتكثيف توزيع الكروت.</div></div>\n    <div class=\"card\"><div class=\"k\">نصيب المساء</div><div class=\"v\">٤٤٪</div><div class=\"d\">حصة الفترة المسائية من حركة اليوم الكامل في هذه المحطة.</div></div>\n    <div class=\"card\"><div class=\"k\">متوسط التعبئة</div><div class=\"v\">٣٣٫٦<small>لترًا</small></div><div class=\"d\">حجم التعبئة الواحدة — مؤشر على وقت وقوف السيارة تحت المظلة.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY075</b> · الدائري الشمالي</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">١٬١٦٩ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">١٢</td><td class=\"num\">٣٥١</td><td class=\"num\">٣٬٥٠٧ ر.س</td><td class=\"num\">٥٬٢٦٠ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">٣٥</td><td class=\"num\">١٬٠٥٢</td><td class=\"num\">١٠٬٥٢١ ر.س</td><td class=\"num\">١٥٬٧٨١ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٥٪</td><td class=\"num\">٥٨</td><td class=\"num\">١٬٧٥٤</td><td class=\"num\">١٧٬٥٣٥ ر.س</td><td class=\"num\">٢٦٬٣٠٢ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٨٪</td><td class=\"num\">٩٤</td><td class=\"num\">٢٬٨٠٦</td><td class=\"num\">٢٨٬٠٥٦ ر.س</td><td class=\"num\">٤٢٬٠٨٤ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">١٤٠</td><td class=\"num\">٤٬٢٠٨</td><td class=\"num\">٤٢٬٠٨٤ ر.س</td><td class=\"num\">٦٣٬١٢٦ ر.س</td></tr></tbody>\n  </table>\n  <p class=\"note\">نموذج حسابي مبني على حركة الوقود الفعلية في هذه المحطة وعلى فرضية سعر الغسلة، وليس مبيعات مسجّلة. الرقم الحقيقي يُثبَّت بعد أسبوعين من قياس عمليات مسح QR.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY075</b> · الدائري الشمالي</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY075</b> · الدائري الشمالي</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع الكروت على مدار اليوم، ولوحات المضخات ولافتات الطريق.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY075</b> · الدائري الشمالي</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY075</b> · الدائري الشمالي</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY075</b> · الدائري الشمالي</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>حتى ١٬١٦٩ كرت يوميًا عند المضخة</b><span>عمال المحطة يسلّمون كرت العرض للسائق على مدار اليوم في هذه المحطة.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY075</b> · الدائري الشمالي</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّلة.</p>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>عامل المضخة يسلّم الكرت</h3><p>مع تسليم الباقي يعطي العامل السائق كرت الغسيل ويشير إلى رمز QR.</p><span class=\"reach\">طوال اليوم</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>العميل يمسح الرمز ويفعّل العرض</h3><p>تفتح صفحة العروض، يختار المغسلة ويُدخل جواله فتصله رسالة توجّهه إليك.</p><span class=\"reach\">أقل من دقيقة</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>موظف المغسلة يطبّق العرض</h3><p>يعرض العميل الرسالة عند الطلب فيُطبَّق العرض مباشرة دون إجراء إضافي.</p><span class=\"reach\">عند الطلب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>لوحة القياس تسجّل العملية</h3><p>كل مسح يُسجّل تلقائيًا، ويصلك تقرير أسبوعي بعدد السيارات الواصلة من الحملة.</p><span class=\"reach\">تقرير كل أسبوع</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY075</b> · الدائري الشمالي</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٨ · توزيع المسؤوليات</p>\n  <h2>من يتحمّل ماذا</h2>\n  <table>\n    <thead><tr><th>البند</th><th>درب</th><th>الشريك</th></tr></thead>\n    <tbody>\n      <tr><td>التصوير والتصميم والمونتاج</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>إطلاق الحملات والنشر على مواقع التواصل</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>آلية التنفيذ ورمز QR وتدريب عمال المحطة</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>التنسيق مع المؤثّرين</td><td class=\"yes\">✓</td><td class=\"no\">—</td></tr>\n      <tr><td>تكلفة التعاقد مع المؤثّرين</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>قيمة العرض أو الخصم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n      <tr><td>الالتزام بالعرض طوال ساعات العمل وتدريب الطاقم</td><td class=\"no\">—</td><td class=\"yes\">✓</td></tr>\n    </tbody>\n  </table>\n  <p class=\"note\">درب لا تتحمّل قيمة العرض ولا تكلفة التعاقد مع المؤثّرين. مساهمة الشريك هي العرض، ومساهمة درب هي التنفيذ والوصول.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY075</b> · الدائري الشمالي</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٩ · مثال على العرض</p>\n  <h2>كيف يبدو العرض المكتمل</h2>\n  <div class=\"split\">\n    <div class=\"example\">\n      <div class=\"row\"><span>فكرة العرض</span><b>غسلة خارجية بـ ١٠ ريالات</b></div>\n      <div class=\"row\"><span>المقابل</span><b>تعبئة وقود بقيمة يحدّدها الاتفاق</b></div>\n      <div class=\"row\"><span>طريقة التفعيل</span><b>مسح رمز QR على كرت الغسيل</b></div>\n      <div class=\"row\"><span>الموقع</span><b>الرياض — الدائري الشمالي</b></div>\n      <div class=\"row\"><span>فترة العرض</span><b>طوال ساعات عمل المحطة</b></div>\n      <div class=\"row\"><span>المدة</span><b>أسبوع قابل للتجديد</b></div>\n    </div>\n    <div>\n      <p class=\"lede\">العرض مكتوب على الكرت الذي يسلّمه العامل، ومربوط برمز QR باسم مغسلتك، فيُحسب كل عميل يصلك منه.</p>\n      <p class=\"note\">عند معدل التقاط ٥٪ فقط في هذه المحطة، الناتج ١٬٧٥٤ سيارة في الشهر — أي ١٧٬٥٣٥ ريالًا عند سعر ١٠ ريالات.</p>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY075</b> · الدائري الشمالي</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">للتواصل</p>\n  <h2>كن شريكًا لنا وشاركنا النجاح</h2>\n  <p class=\"lede\">شركاء درب في المحطات — وأنت التالي في محطة الدائري الشمالي.</p>\n  <div class=\"brandrow\"><img src=\"@@brand1@@\" alt=\"\"><img src=\"@@brand2@@\" alt=\"\"><img src=\"@@brand3@@\" alt=\"\"><img src=\"@@brand4@@\" alt=\"\"><img src=\"@@brand5@@\" alt=\"\"><img src=\"@@brand6@@\" alt=\"\"><img src=\"@@brand7@@\" alt=\"\"></div>\n  <div class=\"grid\" style=\"margin-top:22px\">\n    <div class=\"card\"><div class=\"k\">فريق الحملة</div><div class=\"d\">المسؤول: ………<br>الجوال: ………<br>البريد: ………</div></div>\n    <div class=\"card\"><div class=\"k\">المحطة</div><div class=\"d\">الدائري الشمالي · RY075<br>الرياض</div></div>\n    <div class=\"card\"><div class=\"k\">مصدر الأرقام</div><div class=\"d\">تحليلات مبيعات محطات درب — حركة اليوم الكامل، ٦ أشهر من البيانات.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>RY075</b> · الدائري الشمالي</span></div>\n</section>\n", "JA069": "\n<section class=\"pg cover\">\n  <div class=\"art\"><img src=\"@@hero@@\" alt=\"\"></div><div class=\"veil\"></div>\n  <div class=\"in\">\n    <div class=\"brand\"><img src=\"@@logo@@\" alt=\"درب\"><span>محطة درب — كورنيش جيزان · JA069 · جازان</span></div>\n    <h1>حملة غسيل السيارات.<br><span class=\"hl\">درب تنفّذ الحملة، وأنت تقدّم العرض.</span></h1>\n    <p class=\"sub\">دعوة لمغسلة السيارات في محطة كورنيش جيزان للمشاركة في حملة الغسيل. الأرقام أدناه من تحليلات هذه المحطة نفسها، على مدار اليوم الكامل.</p>\n    <div class=\"strip\">\n      <div class=\"fact\"><div class=\"k\">سيارات كل يوم</div><div class=\"v\">٩٢٢</div><div class=\"u\">اليوم كامل</div></div>\n      <div class=\"fact\"><div class=\"k\">سيارات في الشهر</div><div class=\"v\">٢٧٬٦٦٠</div><div class=\"u\">على مدار اليوم</div></div>\n      <div class=\"fact\"><div class=\"k\">متوسط فاتورة الوقود</div><div class=\"v\">٥٠٫٨ ر.س</div><div class=\"u\">لكل تعبئة</div></div>\n      <div class=\"fact\"><div class=\"k\">مشاهدات الحملة</div><div class=\"v\">١٠٠ ألف</div><div class=\"u\">خلال أسبوع</div></div>\n      <div class=\"fact\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">١٢ صباحًا</div><div class=\"u\">أفضل وقت للتوزيع</div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">١ · لماذا الشراكة في الحملة</p>\n  <h2>السيارة الواقفة تحت المظلة هي عميلك</h2>\n  <div class=\"split\">\n    <img src=\"@@station@@\" alt=\"محطة درب\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء درب تحت المظلة يصيرون عملاءك</b><span>تقف في كورنيش جيزان نحو ٩٢٢ سيارة كل يوم للتزوّد بالوقود، أي ٢٧٬٦٦٠ سيارة في الشهر. السائق داخل الموقع فعلًا وسيارته أمامه.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>العميل موجود طوال اليوم</b><span>حصة المساء ٣٨٪ من حركة اليوم والصباح ٢٣٪، فالعرض يعمل من فتح المحطة إلى إغلاقها لا في ساعة واحدة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تسويق ميداني فعّال</b><span>عمال المحطة يسلّمون كرت العرض للسائق عند المضخة ويشيرون إلى المغسلة.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>فريق تسويق جاهز</b><span>فريق محتوى ومؤثّرون وحملات إعلانية ينفّذون الحملة بدلًا عنك.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>JA069</b> · كورنيش جيزان</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٢ · العملاء المستهدفون</p>\n  <h2>من نستهدف بالحملة داخل محطة كورنيش جيزان</h2>\n  <p class=\"lede\">هؤلاء أبرز شرائح أصحاب السيارات في هذه المحطة بحسب تحليل سلوك حركتها، وذروة مرورهم عند الساعة ١٢ صباحًا.</p>\n  <div class=\"gains\"><div class=\"gain\"><span class=\"mark\"></span><div><b>🌙 ساهر الليل</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div><div class=\"gain\"><span class=\"mark\"></span><div><b>🚗 المتنقل اليومي</b><span>من أبرز شرائح عملاء هذه المحطة بحسب تحليل حركتها.</span></div></div></div>\n  <div class=\"grid\">\n    <div class=\"card accent\"><div class=\"k\">ذروة الحركة</div><div class=\"v\">١٢ صباحًا</div><div class=\"d\">أعلى ساعة حركة — أفضل وقت لتكثيف توزيع الكروت.</div></div>\n    <div class=\"card\"><div class=\"k\">نصيب المساء</div><div class=\"v\">٣٨٪</div><div class=\"d\">حصة الفترة المسائية من حركة اليوم الكامل في هذه المحطة.</div></div>\n    <div class=\"card\"><div class=\"k\">متوسط التعبئة</div><div class=\"v\">٢٢٫٦<small>لترًا</small></div><div class=\"d\">حجم التعبئة الواحدة — مؤشر على وقت وقوف السيارة تحت المظلة.</div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>JA069</b> · كورنيش جيزان</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٣ · حسبة العائد</p>\n  <h2>ماذا يعني كل ١٪ من سيارات اليوم</h2>\n  <p class=\"lede\">٩٢٢ سيارة تدخل المحطة يوميًا على مدار اليوم. معدل الالتقاط هو نسبة من يغسل سيارته منهم، والجدول يعرض الناتج عند سعر غسلة ١٠ ريالات وعند ١٥ ريالًا.</p>\n  <table>\n    <thead><tr><th>معدل الالتقاط</th><th>سيارات/يوم</th><th>سيارات/شهر</th><th>المبيعات الشهرية عند ١٠ ر.س</th><th>المبيعات الشهرية عند ١٥ ر.س</th></tr></thead>\n    <tbody><tr><td class=\"strong\">١٪</td><td class=\"num\">٩</td><td class=\"num\">٢٧٧</td><td class=\"num\">٢٬٧٦٦ ر.س</td><td class=\"num\">٤٬١٤٩ ر.س</td></tr><tr><td class=\"strong\">٣٪</td><td class=\"num\">٢٨</td><td class=\"num\">٨٣٠</td><td class=\"num\">٨٬٢٩٨ ر.س</td><td class=\"num\">١٢٬٤٤٧ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٥٪</td><td class=\"num\">٤٦</td><td class=\"num\">١٬٣٨٣</td><td class=\"num\">١٣٬٨٣٠ ر.س</td><td class=\"num\">٢٠٬٧٤٥ ر.س</td></tr><tr class=\"hot\"><td class=\"strong\">٨٪</td><td class=\"num\">٧٤</td><td class=\"num\">٢٬٢١٣</td><td class=\"num\">٢٢٬١٢٨ ر.س</td><td class=\"num\">٣٣٬١٩٢ ر.س</td></tr><tr><td class=\"strong\">١٢٪</td><td class=\"num\">١١١</td><td class=\"num\">٣٬٣١٩</td><td class=\"num\">٣٣٬١٩٢ ر.س</td><td class=\"num\">٤٩٬٧٨٨ ر.س</td></tr></tbody>\n  </table>\n  <p class=\"note\">نموذج حسابي مبني على حركة الوقود الفعلية في هذه المحطة وعلى فرضية سعر الغسلة، وليس مبيعات مسجّلة. الرقم الحقيقي يُثبَّت بعد أسبوعين من قياس عمليات مسح QR.</p>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>JA069</b> · كورنيش جيزان</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٤ · ماذا يكسب الشريك</p>\n  <h2>خمسة مكاسب مباشرة</h2>\n  <div class=\"gains\">\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عملاء جدد</b><span>نحوّل الزائر العابر تحت المظلة إلى عميل يدخل مغسلتك.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>وصول واسع</b><span>علامتك أمام أكثر من ١٠٠ ألف مشاهدة خلال أسبوع واحد.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>محتوى احترافي جاهز</b><span>تصوير وتصميم ومونتاج وإدارة مؤثّرين، ينفّذه فريق درب بالكامل.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>حضور داخل المحطة</b><span>كروت تحمل اسم المغسلة، ولوحات على المضخات طوال مدة الحملة.</span></div></div>\n    <div class=\"gain\"><span class=\"mark\"></span><div><b>عائد قابل للقياس</b><span>كل عميل يصلك عبر رمز QR قابل للتتبع، مع تقرير أداء أسبوعي.</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>JA069</b> · كورنيش جيزان</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٥ · ما تنفّذه درب</p>\n  <h2>ست خدمات ينفّذها فريق درب بالكامل</h2>\n  <div class=\"tools\">\n    <div class=\"tool\"><span class=\"t\">١</span><div><h3>صناعة محتوى الحملة</h3><p>كتابة فكرة الحملة ورسائلها وإعداد محتوى العروض للنشر.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٢</span><div><h3>التصوير والتصميم والمونتاج</h3><p>تصوير المغسلة والخدمة، وتصميم الكروت، ومونتاج المقاطع.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٣</span><div><h3>بناء الحملة الإعلانية</h3><p>تصميم خطة النشر وتوقيتها وتوزيع المحتوى على المنصات.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٤</span><div><h3>النشر على منصات التواصل</h3><p>نشر المحتوى على قنوات درب ومتابعة التفاعل والنتائج.</p><span class=\"reach\">درب</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٥</span><div><h3>إدارة المؤثّرين</h3><p>اختيار المؤثّرين والتنسيق معهم وإدارة المحتوى.</p><span class=\"reach\">درب تنفّذ · الشريك يتحمّل تكلفة التعاقد</span></div></div>\n    <div class=\"tool\"><span class=\"t\">٦</span><div><h3>الترويج الميداني داخل المحطة</h3><p>توزيع الكروت على مدار اليوم، ولوحات المضخات ولافتات الطريق.</p><span class=\"reach\">درب</span></div></div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>JA069</b> · كورنيش جيزان</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>فيديوهات الحملة</h2>\n  <p class=\"lede\">فيديو تشويقي قصير يُنشر قبل الانطلاق ليصنع ترقّبًا، ثم فيديو يعرض عرض مغسلتك وسعره ومدته على منصات درب. نماذج حقيقية من حملات نفّذتها درب، وعدد المشاهدات ظاهر على كل مقطع.</p>\n  <div class=\"clips\"><img src=\"@@clip1@@\" alt=\"\"><img src=\"@@clip2@@\" alt=\"\"><img src=\"@@clip3@@\" alt=\"\"><img src=\"@@clip4@@\" alt=\"\"><img src=\"@@clip5@@\" alt=\"\"><img src=\"@@clip6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>JA069</b> · كورنيش جيزان</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — تسويق رقمي</p>\n  <h2>الترويج عبر المؤثّرين</h2>\n  <p class=\"lede\">اختيار مؤثّرين مناسبين لجمهور الطريق والتنسيق معهم وإدارة المحتوى. هذه نماذج من فيديوهات مؤثّرين في حملات درب السابقة.</p>\n  <div class=\"clips\"><img src=\"@@infl1@@\" alt=\"\"><img src=\"@@infl2@@\" alt=\"\"><img src=\"@@infl3@@\" alt=\"\"><img src=\"@@infl4@@\" alt=\"\"><img src=\"@@infl5@@\" alt=\"\"><img src=\"@@infl6@@\" alt=\"\"></div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>JA069</b> · كورنيش جيزان</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٦ · مكوّنات الحملة — رقمي وميداني</p>\n  <h2>حملة واتساب وكروت العرض</h2>\n  <div class=\"split\">\n    <img class=\"cardshot\" src=\"@@card@@\" alt=\"كرت العرض\">\n    <div class=\"gains\" style=\"margin-top:0\">\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>تصل إلى الجوال مباشرة</b><span>عرض محدّد المدة مع رابط تفعيل، لا يعتمد على أن يرى العميل إعلانًا.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>محدّدة المدة</b><span>تدفع العميل للاستفادة قبل انتهاء العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>قابلة للقياس</b><span>يُحصى عدد من فتح الرسالة وعدد من فعّل العرض.</span></div></div>\n      <div class=\"gain\"><span class=\"mark\"></span><div><b>حتى ٩٢٢ كرت يوميًا عند المضخة</b><span>عمال المحطة يسلّمون كرت العرض للسائق على مدار اليوم في هذه المحطة.</span></div></div>\n    </div>\n  </div>\n  <div class=\"foot\"><span>حملة غسيل السيارات — درب</span><span><b>JA069</b> · كورنيش جيزان</span></div>\n</section>\n\n<section class=\"pg\">\n  <p class=\"eyebrow\">٧ · آلية التنفيذ</p>\n  <h2>أربع خطوات من المضخة إلى مغسلتك</h2>\n  <p class=\"lede\">كل خطوة واضحة ومسؤول عنها طرف واحد، وكل عملية مسجّ
