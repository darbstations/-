<title>الجمعة البرتقالية ٢٠٢٦ — محطات درب</title>
<style id="darbcss">

:root{
  --orange:#E9760C; --orange-dk:#C85E05; --ink:#1A1917; --ink-2:#4A443D;
  --cream:#FBF6F0; --sand:#F2E7D8; --line:#E0D0BA; --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;background:#231E18;color:var(--ink);
  font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.18;font-weight:800}
p{margin:0}
.wrap{padding:26px 18px 60px}

/* ---------- the sheet ---------- */
.pg{width:1120px;height:630px;margin:0 auto 22px;background:var(--cream);
  border-radius:10px;overflow:hidden;position:relative;display:flex;
  flex-direction:column;padding:52px 60px;
  box-shadow:0 18px 44px rgba(0,0,0,.38)}
.pg.orange{background:var(--orange);color:var(--ink)}
.pg.dark{background:var(--ink);color:var(--cream)}
.pg .eyebrow{font-size:12px;letter-spacing:.18em;font-weight:800;color:var(--orange);
  margin-bottom:14px}
.pg.orange .eyebrow{color:var(--ink)}
.pg.dark .eyebrow{color:var(--orange)}
.pg h2{font-size:40px;margin-bottom:14px}
.pg .lede{font-size:15.5px;line-height:1.85;color:var(--ink-2);max-width:74ch}
.pg.dark .lede{color:#CFC6BA}
.pg.orange .lede{color:#4A2E09}
.hl{background:var(--orange);color:#fff;padding:0 10px;border-radius:4px}
.pg.orange .hl{background:var(--ink);color:var(--orange)}

/* ---------- cover ---------- */
.cover{flex-direction:row;gap:46px;align-items:stretch;padding:40px 48px}
.cover .shot{width:330px;flex:0 0 330px;border-radius:8px;overflow:hidden;
  position:relative;background:#2A2520}
.cover .shot img{width:100%;height:100%;object-fit:cover;display:block}
.cover .shot .stat{position:absolute;inset-inline:16px;bottom:16px;background:rgba(20,18,16,.9);
  border-radius:8px;padding:14px 18px;display:flex;align-items:baseline;
  justify-content:space-between;gap:12px;color:#fff}
.cover .shot .stat b{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.cover .shot .stat span{font-size:11.5px;color:#C6B29A}
.cover .side{flex:1;display:flex;flex-direction:column}
.cover .top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.cover .top span{font-size:12.5px;color:#4A2E09;font-weight:700}
.cover .top img{height:30px;width:auto}
.cover .when{display:inline-block;align-self:flex-start;background:var(--ink);color:#fff;
  border-radius:99px;padding:9px 20px;font-size:12.5px;font-weight:700;margin-top:auto}
.cover h1{font-size:92px;line-height:1.02;margin-top:16px;letter-spacing:-.01em}
.cover h1 .b{display:block;color:#fff}
.cover .tag{margin-top:18px;font-size:17px;font-weight:700;color:#4A2E09}

/* ---------- bits ---------- */
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:99px;padding:10px 18px;font-size:13.5px}
.pill b{font-weight:800}
.pg.cream .pill,.pg:not(.dark):not(.orange) .pill{background:var(--sand);
  border-color:var(--line);color:var(--ink)}
.pg.orange .pill{background:rgba(26,25,23,.12);border-color:rgba(26,25,23,.22);color:var(--ink)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:0;flex:1;
  margin:-52px -60px;align-items:stretch}
.split > div{padding:52px 54px;display:flex;flex-direction:column}
.half{padding:52px 54px;display:flex;flex-direction:column}
.half.orange{background:var(--orange);color:var(--ink)}
.half.dark{background:var(--ink);color:var(--cream)}
.half.orange .eyebrow{color:var(--ink)}
.half.dark .eyebrow{color:var(--orange)}
.half.dark .lede{color:#CFC6BA}

.cards{display:grid;gap:16px;margin-top:auto}
.card{border-radius:10px;padding:22px 24px}
.card.w{background:#fff;color:var(--ink)}
.card.d{background:var(--ink);color:var(--cream)}
.card.o{background:var(--orange);color:#fff}
.card .n{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
  flex:0 0 30px}
.card.o .n{background:var(--ink)}
.card.row{display:flex;align-items:center;gap:14px;font-size:15.5px;font-weight:700}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:auto}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:auto}
.goal{display:flex;align-items:center;gap:13px;font-size:15.5px;font-weight:700;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  border-radius:10px;padding:16px 20px}
.goal .n{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--orange);
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;
  font-size:13px}
.stat2{border-radius:10px;padding:26px 24px}
.stat2 .v{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat2 .k{font-size:15px;font-weight:800;margin-top:10px}
.stat2 .u{font-size:12.5px;line-height:1.7;margin-top:8px;opacity:.82}

/* ---------- bars ---------- */
.bars{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.barrow{display:grid;grid-template-columns:120px 1fr 80px;align-items:center;gap:14px;
  font-size:13.5px}
.barrow .t{font-weight:700}
.barrow .track{display:block;height:18px;background:var(--sand);border-radius:99px;
  overflow:hidden}
.barrow .fill{display:block;height:100%;background:var(--orange);border-radius:99px}
.barrow .v{text-align:left;font-weight:800;font-variant-numeric:tabular-nums}
.bignum{display:flex;align-items:baseline;gap:12px;margin-top:6px}
.bignum b{font-size:58px;font-weight:800;color:var(--orange);line-height:1;
  font-variant-numeric:tabular-nums}
.bignum span{font-size:14px;color:var(--ink-2);font-weight:700}
.segs{display:flex;flex-wrap:wrap;align-items:baseline;gap:0}
.segs > span{display:inline-block}
.segs > span + span::before{content:"·";display:inline-block;padding:0 12px;
  color:var(--orange);font-weight:800}

/* ---------- steps / phases ---------- */
.rows{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.rowi{display:flex;align-items:center;gap:14px;font-size:14.5px;
  border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:10px}
.pg:not(.dark) .rowi{border-color:var(--line)}
.rowi .tagx{margin-inline-start:auto;font-size:11px;font-weight:800;border-radius:99px;
  padding:4px 12px;background:var(--orange);color:#fff;white-space:nowrap}
.rowi .tagx.f{background:#3E7D5D}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:auto}
.step{border-radius:10px;padding:20px;background:#fff;border:1px solid var(--line);
  display:flex;flex-direction:column;gap:10px}
.step:first-child{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.step h3{font-size:15px}
.step p{font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.step:first-child p{color:#CFC6BA}
.step .when{font-size:11px;font-weight:800;color:var(--orange);margin-top:auto}

/* ---------- offer ---------- */
.offer{display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;gap:18px;
  margin-top:auto}
.offer .box{border-radius:12px;padding:34px 30px;text-align:center}
.offer .box.d{background:var(--ink);color:var(--cream)}
.offer .box.o{background:var(--orange);color:#fff}
.offer .box b{display:block;font-size:66px;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums}
.offer .box span{display:block;font-size:14px;margin-top:12px;font-weight:700}
.offer .swap{font-size:34px;text-align:center;color:var(--ink-2)}

/* ---------- media grids ---------- */
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-top:auto}
.grid6 img{width:100%;height:190px;object-fit:cover;border-radius:8px;display:block}
.logos{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-top:14px}
.logos img{width:100%;height:104px;object-fit:contain;background:#fff;border-radius:8px;
  border:1px solid var(--line);padding:9px;display:block}
.chips{display:flex;gap:12px;margin-bottom:16px}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:8px;padding:12px 18px;text-align:center}
.chip b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.chip span{font-size:11.5px;opacity:.8}

/* ---------- year ---------- */
.year{position:absolute;inset-inline-start:40px;top:46px;font-size:220px;font-weight:800;
  color:rgba(26,25,23,.13);line-height:1;letter-spacing:.02em;pointer-events:none}

/* ---------- close ---------- */
.close{justify-content:flex-end}
.close .art{position:absolute;inset:0}
.close .art img{width:100%;height:100%;object-fit:cover;opacity:.3;display:block}
.close .in{position:relative}
.close h2{font-size:58px;max-width:18ch}
.close .when{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.close .when span{background:var(--ink);color:#fff;border-radius:99px;padding:9px 18px;
  font-size:12.5px;font-weight:700}
.close .sig{display:flex;align-items:center;gap:14px;margin-top:24px;font-size:13px;
  color:#4A2E09;font-weight:700}
.close .sig img{height:30px}

.foot{position:absolute;inset-inline:60px;bottom:20px;display:flex;
  justify-content:space-between;font-size:11.5px;color:var(--ink-2);opacity:.8}
.pg.dark .foot{color:#9A9086}
.pg.orange .foot{color:#6B4409}

/* ---------- picker ---------- */
.bar{position:sticky;top:0;z-index:30;background:#2A1D12;padding:14px 18px;
  border-bottom:1px solid #4A3524}
.bar .in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:11px;align-items:center}
.bar label{font-size:12px;letter-spacing:.05em;font-weight:800;color:#C6B29A}
.bar select{background:#3A2416;border:1px solid #5A4330;border-radius:6px;padding:9px 13px;
  font:inherit;color:#FBF6EF;min-width:280px}
.bar button{background:var(--orange);border:0;color:#fff;border-radius:6px;padding:10px 18px;
  font:inherit;font-weight:800;cursor:pointer}
.bar button:hover{background:var(--orange-hi)}
.bar button.ghost{background:transparent;border:1px solid #5A4330;color:#E4D3BC}
.bar .hint{font-size:12px;color:#9A8674}
/* ---------- editing ---------- */
body.editing .pg{height:auto;min-height:630px;overflow:visible}
body.editing [data-block]{outline:1px dashed transparent;transition:outline-color .12s}
body.editing [data-block]:hover{outline-color:var(--line)}
body.editing [data-block].hot{outline:2px solid var(--orange-hi);outline-offset:2px}
.blockbar{position:absolute;z-index:50;display:none;gap:5px;background:#151515;
  border-radius:7px;padding:5px 7px;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.blockbar.show{display:flex;align-items:center}
.blockbar .kind{color:#E4D8C8;font-size:12px;padding:0 6px 0 2px;white-space:nowrap}
.blockbar button{background:#2C2C2C;border:0;color:#fff;border-radius:5px;padding:5px 10px;
  font:inherit;font-size:12px;cursor:pointer}
.blockbar button:hover{background:var(--orange)}
.blockbar button.del:hover{background:#A33A22}
.savedot{font-size:12px;color:#9A8674}
.savedot.ok{color:#7BC49A}
.toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:92vw;
  background:#151515;color:#fff;border-radius:7px;padding:12px 20px;font-size:13.5px;
  opacity:0;transition:.18s;pointer-events:none;z-index:60}
.toast.show{opacity:1}

@media (max-width:1200px){
  .pg{width:100%;height:auto;min-height:0;padding:32px 26px 40px}
  .pg.cover .in{padding:32px 26px}
  .pg.cover h1{font-size:34px}
  .pg.cover .strip{grid-template-columns:repeat(2,1fr)}
  .split,.tools{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .clips{grid-template-columns:repeat(3,1fr)}
  .clips img{height:200px}
  .pg .foot{position:static;margin-top:18px;inset-inline:auto}
}
@media print{
  html,body{background:#fff}
  .bar,.toast{display:none !important}
  .wrap{padding:0}
  .pg{width:100%;height:auto;margin:0;border-radius:0;box-shadow:none;
      break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  @page{size:A4 landscape;margin:10mm}
}

.blockbar .kind{color:#E4D8C8;font-size:12px;padding:0 6px 0 2px;white-space:nowrap}
.blockbar.show{display:flex;align-items:center}
.blockbar button.img{background:#2F5D46}
.blockbar button.img:hover{background:#3E7D5D}
body.editing img[data-block]{cursor:pointer}
body.editing img[data-block]:hover{outline:2px dashed var(--orange-hi);outline-offset:2px}
.pg.close{align-items:center;justify-content:center;text-align:center}
.pg.close h2{font-size:44px}


.toast{display:flex;align-items:center;gap:12px;line-height:1.75}
.toast.show{pointer-events:auto}
#toastmsg{max-width:62ch}
#toastact{background:var(--orange);color:#fff;border:0;border-radius:6px;padding:7px 15px;
  font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap}
#toastact:hover{background:var(--orange-dk)}
</style>

<div class="bar">
  <div class="in">
    <button type="button" id="edit" class="ghost">تحرير</button>
    <button type="button" id="addpg" class="ghost" hidden>+ شريحة</button>
    <button type="button" id="undo" class="ghost" hidden disabled>↶ تراجع</button>
    <button type="button" id="redo" class="ghost" hidden disabled>↷ إعادة</button>
    <button type="button" id="reset" class="ghost" hidden>استعادة الأصل</button>
    <button type="button" id="dl">تنزيل الملف للشريك</button>
    <button type="button" class="ghost" id="pr">طباعة / PDF</button>
    <span class="savedot" id="savedot">جاهز</span>
    <span class="hint">اضغط «تحرير» عشان تعدّل أي كلام أو تحذفه أو تضيف شريحة، واضغط أي صورة عشان تبدّلها — والملف اللي ينزل للشريك يطلع بلا أزرار.</span>
  </div>
</div>
<div class="wrap"><div id="deck"></div></div>
<div class="blockbar" id="bb">
  <span class="kind" id="bbk">فقرة</span>
  <button type="button" data-a="img" class="img" hidden>استبدال الصورة</button>
  <button type="button" data-a="out" title="تحديد العنصر الأكبر">⤴</button>
  <button type="button" data-a="up" title="لأعلى">▲</button>
  <button type="button" data-a="down" title="لأسفل">▼</button>
  <button type="button" data-a="dup">تكرار</button>
  <button type="button" data-a="del" class="del">حذف</button>
</div>
<div class="toast" id="toast"><span id="toastmsg"></span><button type="button" id="toastact" hidden></button></div>
<input type="file" id="pickimg" accept="image/*" hidden>
<script>
var DECK="\n<section class=\"pg dark\">\n  <p class=\"eyebrow\">المستهدفات</p>\n  <h2>هدفان، وثلاثة أرقام نقيسها</h2>\n  <div class=\"goals\">\n    <div class=\"goal\"><span class=\"n\">١</span><span>بناء صورة ذهنية إيجابية عن الشريك</span></div>\n    <div class=\"goal\"><span class=\"n\">٢</span><span>زيادة التفاعل والحضور الرقمي والميداني</span></div>\n  </div>\n  <div class=\"stats\">\n    <div class=\"stat2 card o\"><div class=\"v\">+٥٠٠٠</div><div class=\"k\">عميل واتساب</div>\n      <div class=\"u\">رسالة فيها عرضك ومدته، ورابط يفعّله على طول</div></div>\n    <div class=\"stat2 card d\" style=\"border:1px solid #3A352F\"><div class=\"v\">+١٠٠٠</div>\n      <div class=\"k\">عميل مباشر</div>\n      <div class=\"u\">لكل شريك، من الكوبونات والباركود</div></div>\n    <div class=\"stat2 card o\"><div class=\"v\">+٥ مليون</div><div class=\"k\">مشاهدة</div>\n      <div class=\"u\">كل مشاهدات الحملة على حسابات درب</div></div>\n  </div>\n  <div class=\"foot\"><span>الجمعة البرتقالية ٢٠٢٦ — محطات درب</span><span>١</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">أرقام محطاتنا</p>\n  <h2 class=\"segs\"><span>١١ محطة</span><span>٦ مناطق</span><span>+١١ ألف سيارة يوميًا</span></h2>\n  <div class=\"bignum\"><b>٣٤٩ ألف</b><span>تعبئة في الشهر</span></div>\n  <div class=\"bars\" style=\"margin-top:26px\"><div class=\"barrow\"><span class=\"t\">مكة · ٥ محطات</span><span class=\"track\"><span class=\"fill\" style=\"width:100.0%\"></span></span><span class=\"v\">٥٬٨٢٤</span></div><div class=\"barrow\"><span class=\"t\">جدة</span><span class=\"track\"><span class=\"fill\" style=\"width:35.0%\"></span></span><span class=\"v\">٢٬٠٤١</span></div><div class=\"barrow\"><span class=\"t\">الطائف · محطتان</span><span class=\"track\"><span class=\"fill\" style=\"width:21.9%\"></span></span><span class=\"v\">١٬٢٧٨</span></div><div class=\"barrow\"><span class=\"t\">الرياض</span><span class=\"track\"><span class=\"fill\" style=\"width:20.1%\"></span></span><span class=\"v\">١٬١٦٩</span></div><div class=\"barrow\"><span class=\"t\">جازان</span><span class=\"track\"><span class=\"fill\" style=\"width:15.8%\"></span></span><span class=\"v\">٩٢٢</span></div><div class=\"barrow\"><span class=\"t\">الخرج</span><span class=\"track\"><span class=\"fill\" style=\"width:6.9%\"></span></span><span class=\"v\">٤٠٢</span></div></div>\n  <div class=\"pills\" style=\"margin-top:auto\">\n    <div class=\"pill\">متوسط الفاتورة <b>٥٠٫٧ ر.س</b></div>\n    <div class=\"pill\"><b>٤٤٪</b> من الحركة بعد ٥ مساءً</div>\n    <div class=\"pill\">العرض يشتغل من الفتح للإغلاق</div>\n  </div>\n  <div class=\"foot\"><span>الجمعة البرتقالية ٢٠٢٦ — محطات درب</span><span>٢</span></div>\n</section>\n<section class=\"pg dark\">\n  <p class=\"eyebrow\">مراحل الحملة</p>\n  <h2>نشر يخلّي الناس تنتظر العرض، وتوزيع داخل المحطة يجيب العميل.</h2>\n  <div class=\"rows\" style=\"margin-top:26px;flex:1;justify-content:space-evenly\"><div class=\"rowi\"><span>فيديوهات قبل البداية تشوّق الناس</span><span class=\"tagx\">إعلان</span></div><div class=\"rowi\"><span>فيديو خاص بعرضك وسعره ومدته</span><span class=\"tagx\">إعلان</span></div><div class=\"rowi\"><span>مؤثّرون يوصلون عرضك للسائقين</span><span class=\"tagx\">إعلان</span></div><div class=\"rowi\"><span>رسالة واتساب لأكثر من ٥٬٠٠٠ عميل، فيها رابط التفعيل</span><span class=\"tagx\">إعلان</span></div><div class=\"rowi\"><span>١٠٠٠ كوبون باسمك يتسلّمه العميل عند المضخة</span><span class=\"tagx f\">في المحطة</span></div><div class=\"rowi\"><span>لوحات ومطبوعات بعرضك داخل المحطة</span><span class=\"tagx f\">في المحطة</span></div></div>\n  <div class=\"foot\"><span>الجمعة البرتقالية ٢٠٢٦ — محطات درب</span><span>٣</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">العائد</p>\n  <h2>لو دخل ١٪ فقط من السيارات مغسلتك</h2>\n  <p class=\"lede\">١١٬٦٣٦ سيارة تدخل محطات درب يوميًا. الحسبة على ستة أيام من أسبوعك:\n    مرة بغسلة بعشرة ريالات، ومرة بمتوسط طلب ٢٥ ريالًا مع الخدمات الزيادة.</p>\n  <div class=\"stats\"><div class=\"stat2 card w\"><div class=\"v\">١٪</div><div class=\"k\">٦٩٨ سيارة في الأسبوع</div><div class=\"u\">٦٬٩٨٢ ر.س عند ١٠ ر.س<br>١٧٬٤٥٤ ر.س عند ٢٥ ر.س</div></div><div class=\"stat2 card o\"><div class=\"v\">٥٪</div><div class=\"k\">٣٬٤٩١ سيارة في الأسبوع</div><div class=\"u\">٣٤٬٩٠٨ ر.س عند ١٠ ر.س<br>٨٧٬٢٧٠ ر.س عند ٢٥ ر.س</div></div><div class=\"stat2 card w\"><div class=\"v\">١٢٪</div><div class=\"k\">٨٬٣٧٨ سيارة في الأسبوع</div><div class=\"u\">٨٣٬٧٧٩ ر.س عند ١٠ ر.س<br>٢٠٩٬٤٤٨ ر.س عند ٢٥ ر.س</div></div></div>\n  <p class=\"lede\" style=\"margin-top:18px;font-weight:700;color:var(--orange)\">\n    خلّ عدد الكوبونات على قدر ما تقدر تغسله في اليوم — ردّ عميل جاك بالعرض أسوأ من عرض أصغر.</p>\n  <div class=\"foot\"><span>الجمعة البرتقالية ٢٠٢٦ — محطات درب</span><span>٤</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">الآلية</p>\n  <h2>من المضخة إلى مغسلتك في أربع خطوات</h2>\n  <div class=\"steps\"><div class=\"step\"><span class=\"n\">١</span><h3>كوبون وباركود عند المضخة</h3><p>عامل المحطة يعطيه للعميل بعد التعبئة ويدلّه على مكانك.</p><span class=\"when\">طول اليوم</span></div><div class=\"step\"><span class=\"n\">٢</span><h3>العميل يمسح ويفعّل</h3><p>يختارك ويكتب رقم جواله، فتوصله رسالة تدلّه عليك.</p><span class=\"when\">أقل من دقيقة</span></div><div class=\"step\"><span class=\"n\">٣</span><h3>موظفك يطبّق العرض</h3><p>العميل يوريه الرسالة، ويطبّق العرض على طول بلا أي إجراء.</p><span class=\"when\">عند الطلب</span></div><div class=\"step\"><span class=\"n\">٤</span><h3>نحسب ونرسل لك التقرير</h3><p>كل مسح ينحفظ، وتعرف بالضبط كم سيارة وصلتك.</p><span class=\"when\">تقرير كل أسبوع</span></div></div>\n  <div class=\"foot\"><span>الجمعة البرتقالية ٢٠٢٦ — محطات درب</span><span>٥</span></div>\n</section>\n<section class=\"pg orange\" style=\"justify-content:center\">\n  <div class=\"year\">٢٠٢٥</div>\n  <div style=\"position:relative\">\n    <h2 style=\"font-size:56px\">مو وعود.<br>هذي نتائج ٢٠٢٥.</h2>\n    <p class=\"lede\" style=\"margin-top:18px;font-size:17px\">شركاء ومؤثّرون حقيقيون،\n      وعدد المشاهدات ظاهر على كل مقطع.</p>\n  </div>\n  <div class=\"foot\"><span>الجمعة البرتقالية ٢٠٢٦ — محطات درب</span><span>٦</span></div>\n</section>\n<section class=\"pg dark\">\n  <p class=\"eyebrow\">نتائج ٢٠٢٥</p>\n  <h2 style=\"font-size:34px\">وصلنا لعملائك عن طريق المؤثّرين</h2>\n  <div class=\"chips\" style=\"margin-top:16px\">\n    <div class=\"chip\"><b>+١٠٠ ألف</b><span>مشاهدة في أسبوع</span></div>\n    <div class=\"chip\"><b>١١</b><span>محطة</span></div>\n    <div class=\"chip\"><b>١٠٠٠</b><span>كوبون لكل شريك</span></div>\n  </div>\n  <p class=\"lede\">نفكّر ونكتب ونصوّر ونجهّز مقطعًا خاصًا لكل شريك. أمثلة حقيقية من حسابات درب:</p>\n  <div class=\"grid6\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgFBgcGBQgHBgcJCAgJDBMMDAsLDBgREg4THBgdHRsYGxofIywlHyEqIRobJjQnKi4vMTIxHiU2OjYwOiwwMTD/2wBDAQgJCQwKDBcMDBcwIBsgMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDD/wgARCAGfASwDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAABQABAgMEBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAARBIDs8P1iGbPU6byvP6OfkNSDWcOZATLD39Gp8su/fTVNnNtNEsXbXQuet3eefdD6/n9CufXfzdAufUdAufVdAufR0C59HQLn0dCueR0C59HQeV9pwQHsqsHSQzSU1C2LTpr0C2x3NSC6Z36I1xl8vouzy7brh6K3JmennKPCd4umQ6ZDpISSHZJEyQkkJJC8w9O8xOdsrmrvFx0zjpkOkhmkpa5STd2kfHHc1IHdn0HDPJ6JrvS/l89cvUH4Q1rzdCs+jfF0kyySGSYdJCSQ3mPp3mIAnO5csdMShWxIOmHeKJJkSTId4olF0sWmppaM7Z7Erwqz6DZLmdOenbGvN5XHqi83M683XIUU3wdOrhlnEqd8x9N8yQPqxSXZHJaWQnYZobImNtcTItMClWRIuyHTIkouO8ZK8Xcg1kWo2RU3qvHNjuYuB3579Yf870M9LiHad8/QfM/TfMt+AfsYhQykpXQqoxEEW7qVhKqqNUc1pKNszJDbGMTa4mRaIlLzgO8EWNB1kouOmRJkiKkpvTuDz5+z0jkKsN5Eyost38cI2OzRDUy46yEAdDBnzSlFd9ZqS7ge0hQtVlVMaoZ7CULpmOG6EYo7ImRaIFTvEdMiTxclGUlUVmz6NJHKa35sBkWW1LndJHLszLz8t9WO+GvTRF86bKo001uZOQOVwXo3ZTHSWmoW0jSUyrpNEKZir1uD47aozPOBKyNg2EjhavtLlLjlero0o6d9Iii1JyO0pmMprnHzd9gqS7cpObYfVurm4D9uaXLXoviktj3awzCM95m8uRIrduVboV7DDSQqTFY8pZDyQ2o7hkoO7eWSdto4Kyu5fkdp0KFbtL8+lIPpLoxgupY45dVllDbp75dA/EMCEK9DWKzqsU2DSsUvU2/XLmte var CSSTEXT=(function(){
  var mine=document.getElementById('darbcss');
  if(mine) return mine.outerHTML;
  var all=document.querySelectorAll('style'), out='';
  for(var i=0;i<all.length;i++)
    if(all[i].textContent.indexOf('.pg{')>=0) out+=all[i].outerHTML;
  return out || (all.length?all[all.length-1].outerHTML:'');
})();
function darbEditor(opts){
  var box=document.getElementById('deck');
  var toast=document.getElementById('toast'), tT;
  var dot=document.getElementById('savedot');
  var bb=document.getElementById('bb'), target=null, editing=false;
  var stack=[], at=-1, snapT;

  function say(m,ms,actLabel,actFn){
    if(!toast) return;
    var msg=document.getElementById('toastmsg'), act=document.getElementById('toastact');
    if(msg) msg.textContent=m; else toast.textContent=m;
    if(act){
      if(actLabel){ act.hidden=false; act.textContent=actLabel;
        act.onclick=function(){ act.hidden=true; toast.classList.remove('show');
                                if(actFn) actFn(); }; }
      else { act.hidden=true; act.onclick=null; }
    }
    toast.classList.add('show');
    clearTimeout(tT); tT=setTimeout(function(){ toast.classList.remove('show'); }, ms||4500); }

  var BSEL='.pg > *, .pg > .in > *, .split > *, .strip > .fact, .gains > .gain,'+
           '.tools > .tool, .clips > *, .example > .row, tbody > tr, li, img';
  function mark(){
    var p=box.querySelectorAll('.pg'), i;
    for(i=0;i<p.length;i++) p[i].setAttribute('data-block','pg');
    var n=box.querySelectorAll(BSEL);
    for(i=0;i<n.length;i++){
      if(n[i].classList.contains('art')||n[i].classList.contains('veil')) continue;
      if(!n[i].hasAttribute('data-block')) n[i].setAttribute('data-block','');
    }
  }
  function kind(el){
    if(el.tagName==='IMG') return 'صورة';
    if(el.classList.contains('pg')) return 'شريحة كاملة';
    if(el.classList.contains('gain')) return 'ميزة';
    if(el.classList.contains('tool')) return 'خدمة';
    if(el.classList.contains('fact')) return 'رقم';
    if(el.classList.contains('row')) return 'سطر';
    if(el.classList.contains('gains')||el.classList.contains('tools')||
       el.classList.contains('clips')) return 'مجموعة';
    var t=el.tagName;
    if(t==='TR') return 'صف';
    if(t==='TABLE') return 'جدول';
    if(t==='LI') return 'بند';
    if(t==='H1'||t==='H2'||t==='H3') return 'عنوان';
    return 'فقرة';
  }
  function keep(){
    try{
      localStorage.setItem(opts.key, box.innerHTML);
      var d=new Date();
      if(dot){ dot.textContent='محفوظ '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
               dot.className='savedot ok'; }
    }catch(e){ if(dot){ dot.textContent='تعذّر الحفظ'; dot.className='savedot'; } }
  }
  function ubtn(){
    document.getElementById('undo').disabled = at<=0;
    document.getElementById('redo').disabled = at>=stack.length-1;
  }
  function snap(){
    var h=box.innerHTML;
    if(at>=0 && stack[at]===h) return;
    stack=stack.slice(0,at+1); stack.push(h);
    if(stack.length>60) stack.shift();
    at=stack.length-1; ubtn();
  }
  function restore(h){ box.innerHTML=h; mark(); place(null); keep(); ubtn(); }

  function place(el){
    target=el;
    var hot=box.querySelectorAll('.hot');
    for(var i=0;i<hot.length;i++) hot[i].classList.remove('hot');
    if(!el){ bb.classList.remove('show'); return; }
    el.classList.add('hot');
    document.getElementById('bbk').textContent=kind(el);
    bb.querySelector('[data-a="img"]').hidden = el.tagName!=='IMG';
    var r=el.getBoundingClientRect();
    bb.classList.add('show');
    var top=window.scrollY+r.top-40;
    if(top < window.scrollY+6) top=window.scrollY+r.top+6;
    bb.style.top=top+'px';
    bb.style.left=Math.max(6, window.scrollX+r.left)+'px';
  }

  /* ---- استبدال صورة ---- */
  var pick=document.getElementById('pickimg');
  pick.addEventListener('change',function(){
    var f=this.files&&this.files[0]; this.value='';
    if(!f||!target||target.tagName!=='IMG') return;
    if(f.size>7*1024*1024){ say('الصورة كبيرة — اختر صورة أصغر من ٧ ميغابايت.',7000); return; }
    var r=new FileReader();
    r.onload=function(){ snap(); target.src=r.result; snap(); keep();
      say('تم استبدال الصورة.',4000); };
    r.onerror=function(){ say('تعذّرت قراءة الصورة.',5000); };
    r.readAsDataURL(f);
  });

  box.addEventListener('click',function(e){
    if(!editing) return;
    var el=e.target.closest('[data-block]');
    place(el&&box.contains(el)?el:null);
  });
  bb.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b||!target) return;
    var a=b.getAttribute('data-a');
    if(a==='img'){ pick.click(); return; }
    if(a==='out'){
      var up=target.parentElement && target.parentElement.closest('[data-block]');
      if(up && box.contains(up)) place(up); else say('هذه أكبر وحدة — الشريحة كاملة.',3000);
      return;
    }
    snap();
    if(a==='del'){ var g=target; target=null; g.parentNode.removeChild(g); place(null); }
    else if(a==='dup'){ var c2=target.cloneNode(true); target.parentNode.insertBefore(c2,target.nextSibling); place(c2); }
    else if(a==='up'&&target.previousElementSibling){ target.parentNode.insertBefore(target,target.previousElementSibling); place(target); }
    else if(a==='down'&&target.nextElementSibling){ target.parentNode.insertBefore(target.nextElementSibling,target); place(target); }
    snap(); keep();
  });
  box.addEventListener('input',function(){
    if(!editing) return;
    clearTimeout(snapT);
    snapT=setTimeout(function(){ snap(); keep(); },400);
  });

  function setEdit(on){
    editing=on;
    box.setAttribute('contenteditable', on?'true':'false');
    box.spellcheck=false;
    document.body.classList.toggle('editing', on);
    document.getElementById('edit').textContent = on?'إنهاء التحرير':'تحرير';
    ['addpg','undo','redo','reset'].forEach(function(id){ document.getElementById(id).hidden=!on; });
    if(!on) place(null);
    ubtn();
  }
  document.getElementById('edit').addEventListener('click',function(){ setEdit(!editing); });
  document.getElementById('undo').addEventListener('click',function(){
    if(at<=0) return; at--; restore(stack[at]); say('تراجع.',2000); });
  document.getElementById('redo').addEventListener('click',function(){
    if(at>=stack.length-1) return; at++; restore(stack[at]); say('إعادة.',2000); });
  document.getElementById('addpg').addEventListener('click',function(){
    snap();
    var d=document.createElement('section');
    d.className='pg';
    d.innerHTML='<p class="eyebrow">عنوان فرعي</p><h2>عنوان الشريحة</h2>'+
      '<p class="lede">اكتب هنا نص الشريحة. اضغط على أي عنصر ليظهر شريط الحذف والتكرار.</p>';
    var last=box.querySelector('.pg:last-of-type');
    if(last) last.parentNode.insertBefore(d,last.nextSibling); else box.appendChild(d);
    mark();
    d.scrollIntoView({behavior:'smooth',block:'center'});
    snap(); keep(); say('أُضيفت شريحة في آخر العرض.',4000);
  });
  var armed=false, armT;
  document.getElementById('reset').addEventListener('click',function(){
    var btn=this;
    if(!armed){ armed=true; btn.textContent='تأكيد؟';
      say('سيُلغى كل تعديل على هذه الشرائح. اضغط مرة أخرى للتأكيد.',5000);
      clearTimeout(armT); armT=setTimeout(function(){ armed=false; btn.textContent='استعادة الأصل'; },5000);
      return; }
    clearTimeout(armT); armed=false; btn.textContent='استعادة الأصل';
    snap();
    try{ localStorage.removeItem(opts.key); }catch(e){}
    box.innerHTML=opts.load(); mark();
    snap(); place(null);
    say('رجعت الشرائح إلى الأصل. «تراجع» يعيد تعديلاتك.',8000);
  });
  document.addEventListener('keydown',function(e){
    var m=e.ctrlKey||e.metaKey; if(!m) return;
    if(e.key==='z'||e.key==='Z'){ e.preventDefault();
      document.getElementById(e.shiftKey?'redo':'undo').click(); }
    if(e.key==='y'||e.key==='Y'){ e.preventDefault(); document.getElementById('redo').click(); }
  });
  document.getElementById('pr').addEventListener('click',function(){
    say('اختر «حفظ بصيغة PDF» وجهةً للطباعة، والاتجاه أفقيًا.',6000);
    setTimeout(function(){ try{ window.print(); }catch(e){} },700);
  });

  function drop(name, html){
    var b=new Blob([html],{type:'text/html;charset=utf-8'});
    var u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(u); },1000);
  }
  function send(base, html, done){
    if(!(window.claude&&window.claude.downloads)){ drop(base+'.html',html); say(done); return; }
    window.claude.downloads.save({filename:base+'.html', data:html}).then(function(){ say(done,6000); },
      function(err){
        var code=(err&&err.code)||'unavailable';
        if(code==='declined'){ say('أُلغي التنزيل.'); return; }
        try{ drop(base+'.html',html); }catch(e){}
        window.claude.downloads.save({filename:base+'.html.txt', data:html}).then(function(){
          say('صيغة html مقفلة هنا، فنزل الملف باسم '+base+'.html.txt — احذف «.txt» من آخر الاسم.',15000);
        },function(){ say('تعذّر الحفظ. استخدم زر الطباعة ثم «حفظ بصيغة PDF».',9000); });
      });
  }

  var api={ box:box, snap:snap, mark:mark, keep:keep, say:say, place:place, send:send,
    show:function(html){ box.innerHTML=html; mark(); stack=[]; at=-1; snap(); place(null); } };
  document.getElementById('dl').addEventListener('click',function(){ opts.download(api); });

  /* أول عرض: المحفوظ إن وُجد، وإلا الأصل */
  var saved=null; try{ saved=localStorage.getItem(opts.key); }catch(e){}
  api.show(saved||opts.load());
  if(saved) say('فيه تعديلات محفوظة، رجعناها لك.',5000);
  return api;
}

(function(){
  document.documentElement.lang='ar';
  document.documentElement.dir='rtl';
  function clean(h){
    var t=document.createElement('div'); t.innerHTML=h;
    var n=t.querySelectorAll('[data-block]'), i;
    for(i=0;i<n.length;i++) n[i].removeAttribute('data-block');
    n=t.querySelectorAll('.hot'); for(i=0;i<n.length;i++) n[i].classList.remove('hot');
    n=t.querySelectorAll('[contenteditable]');
    for(i=0;i<n.length;i++) n[i].removeAttribute('contenteditable');
    return t.innerHTML;
  }
  /* ملف الشريك: شرائح فقط، بلا شريط ولا أزرار */
  function fileFor(html){
    return '<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n'+
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
      '<title>الجمعة البرتقالية ٢٠٢٦ — محطات درب</title>\n'+CSSTEXT+'\n</head>\n<body>\n'+
      '<div class="wrap"><div id="deck">'+clean(html)+'</div></div>\n</body>\n</html>\n';
  }
  var ed=darbEditor({
    key:'darb-orange-friday-v1',
    load:function(){ return DECK; },
    download:function(api){
      api.send('darb-orange-friday', fileFor(api.box.innerHTML),
               'نُزّل ملف الجمعة البرتقالية جاهزًا للإرسال للشريك.');
    }
  });
  document.title='الجمعة البرتقالية ٢٠٢٦ — محطات درب';
  /* نسخة محفوظة ما زالت تحمل الشرائح المحذوفة: نعرض التحديث ولا نفرضه */
  (function(){
    var old=null; try{ old=localStorage.getItem('darb-orange-friday-v1'); }catch(e){}
    if(!old) return;
    if(old.indexOf('pg orange cover')<0 && old.indexOf('خطة النشر')<0) return;
    ed.say('نسختك المحفوظة ما زالت تحمل الشرائح الثلاث المحذوفة. '+
           '«حدّث» يجيب النسخة الجديدة، و«تراجع» بعده يرجّع نسختك.',
      20000, 'حدّث', function(){
        ed.snap();
        ed.box.innerHTML=DECK;
        ed.mark(); ed.snap(); ed.keep(); ed.place(null);
        window.scrollTo(0,0);
        ed.say('حُدّثت الشرائح. «تراجع» يرجّع نسختك السابقة.',9000);
      });
  })();
})();
</script>
