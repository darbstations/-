:root{
  /* من الشعار نفسه */
  --orange:#FC6C05; --orange-dk:#C9500A; --orange-lt:#FFA24D;
  --cream:#FDF5DE;  --paper:#F7F0DE;     --ink:#141210;
  /* السلّم الرمادي */
  --g900:#2A2724; --g800:#39342F; --g700:#4A4540; --g500:#7D776A;
  --g400:#9B948A; --g300:#C2BBAE; --g200:#DED8C9; --g100:#EDE8DA;
  --head:"Araboto","Araboto Normal","Araboto Medium","OFHead",system-ui,sans-serif;
  --body:"DIN Next LT Arabic","DIN Next Arabic","DIN Next W23","OFBody",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#1B1916;color:var(--ink);font-family:var(--body)}
h1,h2,h3{margin:0;font-family:var(--head);font-weight:900;line-height:1.14;
  letter-spacing:-.015em}
p{margin:0}
.wrap{padding:26px 18px 60px}

/* ---------------- الورقة ---------------- */
.pg{width:1120px;height:630px;margin:0 auto 22px;background:var(--cream);
  border-radius:12px;overflow:hidden;position:relative;display:flex;
  flex-direction:column;padding:50px 58px;
  box-shadow:0 20px 48px rgba(0,0,0,.45)}
.pg.grey{background:var(--g900);color:var(--cream)}
.pg.orange{background:var(--orange);color:var(--ink)}

/* تنقيط الهاف‑تون: نسيج الريترو */
.pg::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(var(--ink) 1.3px,transparent 1.4px);
  background-size:9px 9px;opacity:.055}
.pg.grey::before{background-image:radial-gradient(var(--cream) 1.3px,transparent 1.4px);
  opacity:.07}
.pg > *{position:relative}

.eyebrow{font-family:var(--head);font-size:12px;font-weight:900;letter-spacing:.2em;
  color:var(--orange-dk);margin-bottom:12px;display:flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:22px;height:4px;background:var(--orange);
  border:2px solid var(--ink);border-radius:2px}
.pg.grey .eyebrow{color:var(--orange-lt)}
.pg.grey .eyebrow::before{border-color:var(--cream)}
.pg.orange .eyebrow{color:var(--ink)}
h2{font-size:40px;margin-bottom:12px}
.lede{font-size:15.5px;line-height:1.9;font-weight:500;color:var(--g700);max-width:74ch}
.pg.grey .lede{color:var(--g300)}
.pg.orange .lede{color:#4A2A05}

/* علامة مميّزة داخل العنوان */
.hl{background:var(--orange);color:var(--ink);padding:1px 10px;border:3px solid var(--ink);
  border-radius:8px;box-shadow:-4px 4px 0 var(--ink);display:inline-block}
.pg.grey .hl{box-shadow:-4px 4px 0 var(--cream)}

/* ---------------- بطاقات الريترو: حدّ سميك وظلّ مصمت ---------------- */
.rcard{background:var(--cream);color:var(--ink);border:3px solid var(--ink);
  border-radius:14px;box-shadow:-6px 6px 0 var(--ink);padding:20px 22px}
.rcard.o{background:var(--orange);color:var(--ink)}
.rcard.d{background:var(--g900);color:var(--cream);box-shadow:-6px 6px 0 var(--orange)}
.pg.grey .rcard{box-shadow:-6px 6px 0 var(--orange)}
.pg.orange .rcard{box-shadow:-6px 6px 0 var(--ink)}

/* ---------------- الأيقونات ---------------- */
.ric{width:42px;height:42px;flex:0 0 42px;border:3px solid var(--ink);border-radius:50%;
  background:var(--cream);display:flex;align-items:center;justify-content:center;
  box-shadow:-3px 3px 0 var(--ink)}
.ric.on{background:var(--orange)}
.ric svg{width:23px;height:23px;fill:none;stroke:var(--ink);stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round}
.pg.grey .ric{box-shadow:-3px 3px 0 var(--orange)}

/* ---------------- الأشعّة: من الشعار ---------------- */
.rays{position:absolute;width:760px;height:760px;pointer-events:none;opacity:.16;
  background:repeating-conic-gradient(from 8deg,var(--orange) 0deg 5deg,transparent 5deg 13deg)}
.pg.orange .rays{background:repeating-conic-gradient(from 8deg,var(--ink) 0deg 5deg,
  transparent 5deg 13deg);opacity:.10}

/* ---------------- الغلاف ---------------- */
.cover{align-items:center;justify-content:center;text-align:center;background:var(--g900)}
.cover .rays{inset-inline-start:50%;top:-240px;transform:translateX(50%)}
.cover .mark{width:560px;max-width:86%;height:auto;display:block;
  filter:drop-shadow(-8px 10px 0 rgba(0,0,0,.45))}
.cover .when{margin-top:26px;display:inline-flex;align-items:center;gap:10px;
  background:var(--orange);border:3px solid var(--cream);border-radius:99px;
  padding:11px 24px;font-weight:800;font-size:14px;color:var(--ink);
  box-shadow:-5px 5px 0 var(--ink)}
.cover .tag{margin-top:20px;font-family:var(--head);font-weight:900;font-size:25px;
  color:var(--cream)}
.cover .foot2{position:absolute;inset-inline:40px;bottom:26px;display:flex;
  align-items:center;justify-content:space-between;font-size:12px;color:var(--g400)}
.cover .foot2 img{height:26px}

/* ---------------- الأرقام ---------------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:auto}
.stat2 .v{font-family:var(--head);font-size:50px;font-weight:900;line-height:1;
  font-variant-numeric:tabular-nums}
.stat2 .k{font-size:15px;font-weight:800;margin-top:9px}
.stat2 .u{font-size:12.5px;line-height:1.7;margin-top:7px;color:var(--g700)}
.rcard.d .u,.rcard.o .u{color:inherit;opacity:.85}

.goals{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:auto;
  margin-bottom:auto}
.goal{display:flex;align-items:center;gap:15px;font-size:16px;font-weight:700;
  background:var(--g800);border:3px solid var(--cream);border-radius:14px;
  padding:20px 22px;box-shadow:-6px 6px 0 var(--orange)}

.bignum{display:flex;align-items:baseline;gap:12px;margin-top:8px}
.bignum b{font-family:var(--head);font-size:56px;font-weight:900;color:var(--orange-dk);
  line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:-3px 3px 0 var(--ink)}
.bignum span{font-size:14px;color:var(--g700);font-weight:700}
.segs{display:flex;flex-wrap:wrap;align-items:baseline}
.segs > span + span::before{content:"";display:inline-block;width:7px;height:7px;
  margin:0 13px;background:var(--orange);border:2px solid var(--ink);border-radius:50%;
  vertical-align:middle}

.bars{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.barrow{display:grid;grid-template-columns:150px 1fr 82px;align-items:center;gap:14px;
  font-size:13.5px}
.barrow .t{font-weight:700}
.barrow .track{display:block;height:20px;background:var(--g100);border:2.5px solid var(--ink);
  border-radius:99px;overflow:hidden}
.barrow .fill{display:block;height:100%;background:var(--orange)}
.barrow .v{text-align:left;font-weight:900;font-variant-numeric:tabular-nums;
  font-family:var(--head)}

.pills{display:flex;flex-wrap:wrap;gap:11px;margin-top:auto}
.pill{background:var(--cream);border:3px solid var(--ink);border-radius:99px;
  padding:9px 18px;font-size:13px;font-weight:700;box-shadow:-4px 4px 0 var(--ink)}
.pill b{font-weight:900;font-family:var(--head)}
.pg.grey .pill{background:var(--g800);color:var(--cream);box-shadow:-4px 4px 0 var(--orange)}
.pg.orange .pill{background:var(--cream)}

/* ---------------- صفوف ---------------- */
.rows{display:flex;flex-direction:column;gap:11px;margin-top:20px}
.rowi{display:flex;align-items:center;gap:14px;font-size:14.5px;font-weight:600}
.rowi .tagx{margin-inline-start:auto;font-size:11px;font-weight:900;font-family:var(--head);
  border:2.5px solid var(--ink);border-radius:99px;padding:4px 13px;background:var(--orange);
  color:var(--ink);white-space:nowrap;box-shadow:-3px 3px 0 var(--ink)}
.rowi .tagx.f{background:var(--g200)}
.pg.grey .rowi .tagx{box-shadow:-3px 3px 0 var(--cream)}

/* ---------------- خطوات ---------------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:auto}
.step{display:flex;flex-direction:column;gap:11px}
.step h3{font-size:15px}
.step p{font-size:12.5px;line-height:1.7;color:var(--g700);font-weight:500}
.step .when{font-size:11px;font-weight:900;font-family:var(--head);color:var(--orange-dk);
  margin-top:auto}

/* ---------------- نصفان ---------------- */
.split{display:grid;grid-template-columns:1fr 1fr;flex:1;margin:-50px -58px;
  align-items:stretch}
.half{padding:50px 54px;display:flex;flex-direction:column;position:relative}
.half.orange{background:var(--orange)}
.half.grey{background:var(--g900);color:var(--cream)}
.half.grey .eyebrow{color:var(--orange-lt)}
.half.grey .rowi .tagx{box-shadow:-3px 3px 0 var(--cream)}

/* ---------------- صور ---------------- */
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:auto}
.grid6 img{width:100%;height:200px;object-fit:cover;border:3px solid var(--ink);
  border-radius:10px;box-shadow:-4px 4px 0 var(--ink);display:block}
.pg.grey .grid6 img{box-shadow:-4px 4px 0 var(--orange)}
.logos{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:12px}
.logos img{width:100%;height:96px;object-fit:contain;background:var(--cream);
  border:3px solid var(--ink);border-radius:10px;padding:9px;display:block;
  box-shadow:-4px 4px 0 var(--ink)}
.chips{display:flex;gap:13px;margin-bottom:16px}
.chip{border:3px solid var(--ink);border-radius:12px;padding:12px 20px;text-align:center;
  background:var(--cream);color:var(--ink);box-shadow:-4px 4px 0 var(--orange)}
.chip b{display:block;font-family:var(--head);font-size:25px;font-weight:900;
  font-variant-numeric:tabular-nums}
.chip span{font-size:11.5px;color:var(--g700);font-weight:700}

/* ---------------- السنة العملاقة ---------------- */
.year{position:absolute;inset-inline-start:46px;top:40px;font-family:var(--head);
  font-size:210px;font-weight:900;line-height:1;color:transparent;
  -webkit-text-stroke:4px rgba(20,18,16,.22);pointer-events:none}

/* ---------------- جدول العروض ---------------- */
.otab{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;
  background:var(--cream);border:3px solid var(--ink);border-radius:12px;
  overflow:hidden;margin-top:20px;box-shadow:-6px 6px 0 var(--ink)}
.otab th,.otab td{padding:14px 16px;text-align:right;border-bottom:2px solid var(--ink)}
.otab thead th{background:var(--orange);font-family:var(--head);font-size:12px;
  font-weight:900;letter-spacing:.05em;color:var(--ink)}
.otab tbody tr:last-child td{border-bottom:0}
.otab td.fill{color:var(--g400);background:var(--paper)}

/* ---------------- الختام ---------------- */
.close{justify-content:flex-end;background:var(--orange)}
.close .art{position:absolute;inset:0}
.close .art img{width:100%;height:100%;object-fit:cover;opacity:.26;display:block}
.close h2{font-size:54px;max-width:17ch}
.close .when{display:flex;gap:11px;flex-wrap:wrap;margin-top:22px}
.close .when span{background:var(--g900);color:var(--cream);border:3px solid var(--ink);
  border-radius:99px;padding:9px 18px;font-size:12.5px;font-weight:800;
  box-shadow:-4px 4px 0 var(--cream)}
.close .sig{display:flex;align-items:center;gap:14px;margin-top:22px;font-size:13px;
  font-weight:800;color:#4A2A05}
.close .sig img{height:30px}

.foot{position:absolute;inset-inline:58px;bottom:18px;display:flex;
  justify-content:space-between;font-size:11.5px;color:var(--g500);font-weight:600}
.pg.grey .foot{color:var(--g400)}
.pg.orange .foot{color:#6B4409}

/* ---------- picker ---------- */
.bar{position:sticky;top:0;z-index:30;background:#2A1D12;padding:14px 18px;
  border-bottom:1px solid #4A3524}
.bar .in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;gap:11px;align-items:center}
.bar label{font-size:12px;letter-spacing:.05em;font-weight:800;color:#C6B29A}
.bar select{background:#3A2416;border:1px solid #5A4330;border-radius:6px;padding:9px 13px;
  font:inherit;color:#FBF6EF;min-width:280px}
.bar button{background:var(--orange);border:0;color:#fff;border-radius:6px;padding:10px 18px;
  font:inherit;font-weight:800;cursor:pointer}
.bar button:hover{background:var(--orange-hi)}
.bar button.ghost{background:transparent;border:1px solid #5A4330;color:#E4D3BC}
.bar .hint{font-size:12px;color:#9A8674}
/* ---------- editing ---------- */
body.editing .pg{height:auto;min-height:630px;overflow:visible}
body.editing [data-block]{outline:1px dashed transparent;transition:outline-color .12s}
body.editing [data-block]:hover{outline-color:var(--line)}
body.editing [data-block].hot{outline:2px solid var(--orange-hi);outline-offset:2px}
.blockbar{position:absolute;z-index:50;display:none;gap:5px;background:#151515;
  border-radius:7px;padding:5px 7px;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.blockbar.show{display:flex;align-items:center}
.blockbar .kind{color:#E4D8C8;font-size:12px;padding:0 6px 0 2px;white-space:nowrap}
.blockbar button{background:#2C2C2C;border:0;color:#fff;border-radius:5px;padding:5px 10px;
  font:inherit;font-size:12px;cursor:pointer}
.blockbar button:hover{background:var(--orange)}
.blockbar button.del:hover{background:#A33A22}
.savedot{font-size:12px;color:#9A8674}
.savedot.ok{color:#7BC49A}
.toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:92vw;
  background:#151515;color:#fff;border-radius:7px;padding:12px 20px;font-size:13.5px;
  opacity:0;transition:.18s;pointer-events:none;z-index:60}
.toast.show{opacity:1}

@media (max-width:1200px){
  .pg{width:100%;height:auto;min-height:0;padding:32px 26px 40px}
  .pg.cover .in{padding:32px 26px}
  .pg.cover h1{font-size:34px}
  .pg.cover .strip{grid-template-columns:repeat(2,1fr)}
  .split,.tools{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .clips{grid-template-columns:repeat(3,1fr)}
  .clips img{height:200px}
  .pg .foot{position:static;margin-top:18px;inset-inline:auto}
}
@media print{
  html,body{background:#fff}
  .bar,.toast{display:none !important}
  .wrap{padding:0}
  .pg{width:100%;height:auto;margin:0;border-radius:0;box-shadow:none;
      break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  @page{size:A4 landscape;margin:10mm}
}

.blockbar .kind{color:#E4D8C8;font-size:12px;padding:0 6px 0 2px;white-space:nowrap}
.blockbar.show{display:flex;align-items:center}
.blockbar button.img{background:#2F5D46}
.blockbar button.img:hover{background:#3E7D5D}
body.editing img[data-block]{cursor:pointer}
body.editing img[data-block]:hover{outline:2px dashed var(--orange-hi);outline-offset:2px}
.pg.close{align-items:center;justify-content:center;text-align:center}
.pg.close h2{font-size:44px}


.toast{display:flex;align-items:center;gap:12px;line-height:1.75}
.toast.show{pointer-events:auto}
#toastmsg{max-width:62ch}
#toastact{background:var(--orange);color:var(--ink);border:0;border-radius:6px;
  padding:7px 15px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
  white-space:nowrap}
.bar{background:var(--g900) !important;border-bottom-color:var(--g700) !important}
.bar button{background:var(--orange) !important;color:var(--ink) !important}
.bar button.ghost{background:transparent !important;color:var(--g200) !important;
  border-color:var(--g700) !important}
</style>

span class=\"v\">٧٬٣٩١</span></div><div class=\"barrow\"><span class=\"t\">الرياض · محطتان</span><span class=\"track\"><span class=\"fill\" style=\"width:5.8%\"></span></span><span class=\"v\">١٬٩٧٦</span></div><div class=\"barrow\"><span class=\"t\">الخرج · ٣ محطات</span><span class=\"track\"><span class=\"fill\" style=\"width:5.2%\"></span></span><span class=\"v\">١٬٧٦٧</span></div><div class=\"barrow\"><span class=\"t\">٧ مناطق أخرى</span><span class=\"track\"><span class=\"fill\" style=\"width:13.7%\"></span></span><span class=\"v\">٤٬٦٩٦</span></div></div>\n  <div class=\"pills\">\n    <div class=\"pill\">متوسط الفاتورة <b>٥٦٫٥ ر.س</b></div>\n    <div class=\"pill\"><b>٤٦٪</b> من الحركة بعد ٥ مساءً</div>\n    <div class=\"pill\">العرض يشتغل من الفتح للإغلاق</div>\n  </div>\n  <div class=\"foot\"><span>الجمعة البرتقالية ٢٠٢٦ — محطات درب</span><span>٢</span></div>\n</section>\n<section class=\"pg grey\">\n  <p class=\"eyebrow\">مراحل الحملة</p>\n  <h2>نشر يخلّي الناس تنتظر العرض، وتوزيع داخل المحطة يجيب العميل.</h2>\n  <div class=\"rows\" style=\"flex:1;justify-content:space-evenly\"><div class=\"rowi\"><span class=\"ric on\"><svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M16 3l3 9 9 3-9 3-3 9-3-9-9-3 9-3z\"/></svg></span><span>فيديوهات قبل البداية تشوّق الناس</span><span class=\"tagx\">إعلان</span></div><div class=\"rowi\"><span class=\"ric on\"><svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M12 9l12 7-12 7z\"/></svg></span><span>فيديو خاص بعرضك وسعره ومدته</span><span class=\"tagx\">إعلان</span></div><div class=\"rowi\"><span class=\"ric on\"><svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><rect x=\"12\" y=\"4\" width=\"8\" height=\"15\" rx=\"4\"/><path d=\"M7 16a9 9 0 0018 0M16 25v4M11 29h10\"/></svg></span><span>مؤثّرون يوصلون عرضك للسائقين</span><span class=\"tagx\">إعلان</span></div><div class=\"rowi\"><span class=\"ric on\"><svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M4 8h24v15H16l-7 6v-6H4z\"/></svg></span><span>رسالة واتساب لأكثر من ٥٬٠٠٠ عميل، فيها رابط التفعيل</span><span class=\"tagx\">إعلان</span></div><div class=\"rowi\"><span class=\"ric\"><svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M4 10h24v5a3 3 0 000 6v5H4v-5a3 3 0 000-6z\"/><path d=\"M16 10v16\"/></svg></span><span>١٠٠٠ كوبون باسمك يتسلّمه العميل عند المضخة</span><span class=\"tagx f\">في المحطة</span></div><div class=\"rowi\"><span class=\"ric\"><svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><rect x=\"4\" y=\"6\" width=\"24\" height=\"13\" rx=\"2\"/><path d=\"M16 19v9M10 28h12\"/></svg></span><span>لوحات ومطبوعات بعرضك داخل المحطة</span><span class=\"tagx f\">في المحطة</span></div></div>\n  <div class=\"foot\"><span>الجمعة البرتقالية ٢٠٢٦ — محطات درب</span><span>٣</span></div>\n</section>\n<section class=\"pg\">\n  <p class=\"eyebrow\">الآلية</p>\n  <h2>من المضخة إلى مغسلتك في أربع خطوات</h2>\n  <div class=\"steps\"><div class=\"step rcard o\"><span class=\"ric\"><svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M4 10h24v5a3 3 0 000 6v5H4v-5a3 3 0 000-6z\"/><path d=\"M16 10v16\"/></svg></span><h3>كوبون وباركود عند المضخة</h3><p>عامل المحطة يعطيه للعميل بعد التعبئة ويدلّه على مكانك.</p><span class=\"when\">طول اليوم</span></div><div class=\"step rcard\"><span class=\"ric on\"><svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M5 11V6h5M27 11V6h-5M5 21v5h5M27 21v5h-5\"/><path d=\"M9 16h14\"/></svg></span><h3>العميل يمسح ويفعّل</h3><p>يختارك ويكتب رقم جواله، فتوصله رسالة تدلّه عليك.</p><span class=\"when\">أقل من دقيقة</span></div><div class=\"step rcard\"><span class=\"ric on\"><svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M6 17l6 6 14-14\"/></svg></span><h3>موظفك يطبّق العرض</h3><p>العميل يوريه الرسالة، ويطبّق العرض على طول بلا أي إجراء.</p><span class=\"when\">عند الطلب</span></div><div class=\"step rcard\"><span class=\"ric on\"><svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M5 27V17M13 27V8M21 27V13M29 27V20\"/></svg></span><h3>نحسب ونرسل لك التقرير</h3><p>كل مسح ينحفظ، وتعرف بالضبط كم سيارة وصلتك.</p><span class=\"when\">تقرير كل أسبوع</span></div></div>\n  <div class=\"foot\"><span>الجمعة البرتقالية ٢٠٢٦ — محطات درب</span><span>٤</span></div>\n</section>\n<section class=\"pg orange\" style=\"justify-content:center\">\n  <div class=\"rays\" style=\"inset-inline-end:-300px;top:-300px\"></div>\n  <div class=\"year\">٢٠٢٥</div>\n  <div>\n    <h2 style=\"font-size:56px\">مو وعود.<br>هذي نتائج ٢٠٢٥.</h2>\n    <p class=\"lede\" style=\"margin-top:16px;font-size:17px\">شركاء ومؤثّرون حقيقيون،\n      وعدد المشاهدات ظاهر على كل مقطع.</p>\n  </div>\n  <div class=\"foot\"><span>الجمعة البرتقالية ٢٠٢٦ — محطات درب</span><span>٥</span></div>\n</section>\n<section class=\"pg grey\">\n  <p class=\"eyebrow\">نتائج ٢٠٢٥</p>\n  <h2 style=\"font-size:34px\">وصلنا لعملائك عن طريق المؤثّرين</h2>\n  <div class=\"chips\" style=\"margin-top:16px\">\n    <div class=\"chip\"><b>+١٠٠ ألف</b><span>مشاهدة في أسبوع</span></div>\n    <div class=\"chip\"><b>١١</b><span>محطة</span></div>\n    <div class=\"chip\"><b>١٠٠٠</b><span>كوبون لكل شريك</span></div>\n  </div>\n  <p class=\"lede\">نفكّر ونكتب ونصوّر ونجهّز مقطعًا خاصًا لكل شريك. أمثلة حقيقية من حسابات درب:</p>\n  <div class=\"grid6\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgFBgcGBQgHBgcJCAgJDBMMDAsLDBgREg4THBgdHRsYGxofIywlHyEqIRobJjQnKi4vMTIxHiU2OjYwOiwwMTD/2wBDAQgJCQwKDBcMDBcwIBsgMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDD/wgARCAGfASwDASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAABQABAgMEBgf/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIDBAX/2gAMAwEAAhADEAAAARBIDs8P1iGbPU6byvP6OfkNSDWcOZATLD39Gp8su/fTVNnNtNEsXbXQuet3eefdD6/n9CufXfzdAufUdAufVdAufR0C59HQLn0dCueR0C59HQeV9pwQHsqsHSQzSU1C2LTpr0C2x3NSC6Z36I1xl8vouzy7brh6K3JmennKPCd4umQ6ZDpISSHZJEyQkkJJC8w9O8xOdsrmrvFx0zjpkOkhmkpa5STd2kfHHc1IHdn0HDPJ6JrvS/l89cvUH4Q1rzdCs+jfF0kyySGSYdJCSQ3mPp3mIAnO5csdMShWxIOmHeKJJkSTId4olF0sWmppaM7Z7Erwqz6DZLmdOenbGvN5XHqi83M683XIUU3wdOrhlnEqd8x9N8yQPqxSXZHJaWQnYZobImNtcTItMClWRIuyHTIkouO8ZK8Xc   function say(m,ms){ if(!toast) return; toast.textContent=m; toast.classList.add('show');
    clearTimeout(tT); tT=setTimeout(function(){ toast.classList.remove('show'); }, ms||4500); }

  var BSEL='.pg > *, .pg > .in > *, .split > *, .strip > .fact, .gains > .gain,'+
           '.tools > .tool, .clips > *, .example > .row, tbody > tr, li, img';
  function mark(){
    var p=box.querySelectorAll('.pg'), i;
    for(i=0;i<p.length;i++) p[i].setAttribute('data-block','pg');
    var n=box.querySelectorAll(BSEL);
    for(i=0;i<n.length;i++){
      if(n[i].classList.contains('art')||n[i].classList.contains('veil')) continue;
      if(!n[i].hasAttribute('data-block')) n[i].setAttribute('data-block','');
    }
  }
  function kind(el){
    if(el.tagName==='IMG') return 'صورة';
    if(el.classList.contains('pg')) return 'شريحة كاملة';
    if(el.classList.contains('gain')) return 'ميزة';
    if(el.classList.contains('tool')) return 'خدمة';
    if(el.classList.contains('fact')) return 'رقم';
    if(el.classList.contains('row')) return 'سطر';
    if(el.classList.contains('gains')||el.classList.contains('tools')||
       el.classList.contains('clips')) return 'مجموعة';
    var t=el.tagName;
    if(t==='TR') return 'صف';
    if(t==='TABLE') return 'جدول';
    if(t==='LI') return 'بند';
    if(t==='H1'||t==='H2'||t==='H3') return 'عنوان';
    return 'فقرة';
  }
  function keep(){
    try{
      localStorage.setItem(opts.key, box.innerHTML);
      var d=new Date();
      if(dot){ dot.textContent='محفوظ '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
               dot.className='savedot ok'; }
    }catch(e){ if(dot){ dot.textContent='تعذّر الحفظ'; dot.className='savedot'; } }
  }
  function ubtn(){
    document.getElementById('undo').disabled = at<=0;
    document.getElementById('redo').disabled = at>=stack.length-1;
  }
  function snap(){
    var h=box.innerHTML;
    if(at>=0 && stack[at]===h) return;
    stack=stack.slice(0,at+1); stack.push(h);
    if(stack.length>60) stack.shift();
    at=stack.length-1; ubtn();
  }
  function restore(h){ box.innerHTML=h; mark(); place(null); keep(); ubtn(); }

  function place(el){
    target=el;
    var hot=box.querySelectorAll('.hot');
    for(var i=0;i<hot.length;i++) hot[i].classList.remove('hot');
    if(!el){ bb.classList.remove('show'); return; }
    el.classList.add('hot');
    document.getElementById('bbk').textContent=kind(el);
    bb.querySelector('[data-a="img"]').hidden = el.tagName!=='IMG';
    var r=el.getBoundingClientRect();
    bb.classList.add('show');
    var top=window.scrollY+r.top-40;
    if(top < window.scrollY+6) top=window.scrollY+r.top+6;
    bb.style.top=top+'px';
    bb.style.left=Math.max(6, window.scrollX+r.left)+'px';
  }

  /* ---- استبدال صورة ---- */
  var pick=document.getElementById('pickimg');
  pick.addEventListener('change',function(){
    var f=this.files&&this.files[0]; this.value='';
    if(!f||!target||target.tagName!=='IMG') return;
    if(f.size>7*1024*1024){ say('الصورة كبيرة — اختر صورة أصغر من ٧ ميغابايت.',7000); return; }
    var r=new FileReader();
    r.onload=function(){ snap(); target.src=r.result; snap(); keep();
      say('تم استبدال الصورة.',4000); };
    r.onerror=function(){ say('تعذّرت قراءة الصورة.',5000); };
    r.readAsDataURL(f);
  });

  box.addEventListener('click',function(e){
    if(!editing) return;
    var el=e.target.closest('[data-block]');
    place(el&&box.contains(el)?el:null);
  });
  bb.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b||!target) return;
    var a=b.getAttribute('data-a');
    if(a==='img'){ pick.click(); return; }
    if(a==='out'){
      var up=target.parentElement && target.parentElement.closest('[data-block]');
      if(up && box.contains(up)) place(up); else say('هذه أكبر وحدة — الشريحة كاملة.',3000);
      return;
    }
    snap();
    if(a==='del'){ var g=target; target=null; g.parentNode.removeChild(g); place(null); }
    else if(a==='dup'){ var c2=target.cloneNode(true); target.parentNode.insertBefore(c2,target.nextSibling); place(c2); }
    else if(a==='up'&&target.previousElementSibling){ target.parentNode.insertBefore(target,target.previousElementSibling); place(target); }
    else if(a==='down'&&target.nextElementSibling){ target.parentNode.insertBefore(target.nextElementSibling,target); place(target); }
    snap(); keep();
  });
  box.addEventListener('input',function(){
    if(!editing) return;
    clearTimeout(snapT);
    snapT=setTimeout(function(){ snap(); keep(); },400);
  });

  function setEdit(on){
    editing=on;
    box.setAttribute('contenteditable', on?'true':'false');
    box.spellcheck=false;
    document.body.classList.toggle('editing', on);
    document.getElementById('edit').textContent = on?'إنهاء التحرير':'تحرير';
    ['addpg','undo','redo','reset'].forEach(function(id){ document.getElementById(id).hidden=!on; });
    if(!on) place(null);
    ubtn();
  }
  document.getElementById('edit').addEventListener('click',function(){ setEdit(!editing); });
  document.getElementById('undo').addEventListener('click',function(){
    if(at<=0) return; at--; restore(stack[at]); say('تراجع.',2000); });
  document.getElementById('redo').addEventListener('click',function(){
    if(at>=stack.length-1) return; at++; restore(stack[at]); say('إعادة.',2000); });
  document.getElementById('addpg').addEventListener('click',function(){
    snap();
    var d=document.createElement('section');
    d.className='pg';
    d.innerHTML='<p class="eyebrow">عنوان فرعي</p><h2>عنوان الشريحة</h2>'+
      '<p class="lede">اكتب هنا نص الشريحة. اضغط على أي عنصر ليظهر شريط الحذف والتكرار.</p>';
    var last=box.querySelector('.pg:last-of-type');
    if(last) last.parentNode.insertBefore(d,last.nextSibling); else box.appendChild(d);
    mark();
    d.scrollIntoView({behavior:'smooth',block:'center'});
    snap(); keep(); say('أُضيفت شريحة في آخر العرض.',4000);
  });
  var armed=false, armT;
  document.getElementById('reset').addEventListener('click',function(){
    var btn=this;
    if(!armed){ armed=true; btn.textContent='تأكيد؟';
      say('سيُلغى كل تعديل على هذه الشرائح. اضغط مرة أخرى للتأكيد.',5000);
      clearTimeout(armT); armT=setTimeout(function(){ armed=false; btn.textContent='استعادة الأصل'; },5000);
      return; }
    clearTimeout(armT); armed=false; btn.textContent='استعادة الأصل';
    snap();
    try{ localStorage.removeItem(opts.key); }catch(e){}
    box.innerHTML=opts.load(); mark();
    snap(); place(null);
    say('رجعت الشرائح إلى الأصل. «تراجع» يعيد تعديلاتك.',8000);
  });
  document.addEventListener('keydown',function(e){
    var m=e.ctrlKey||e.metaKey; if(!m) return;
    if(e.key==='z'||e.key==='Z'){ e.preventDefault();
      document.getElementById(e.shiftKey?'redo':'undo').click(); }
    if(e.key==='y'||e.key==='Y'){ e.preventDefault(); document.getElementById('redo').click(); }
  });
  document.getElementById('pr').addEventListener('click',function(){
    say('اختر «حفظ بصيغة PDF» وجهةً للطباعة، والاتجاه أفقيًا.',6000);
    setTimeout(function(){ try{ window.print(); }catch(e){} },700);
  });

  function drop(name, html){
    var b=new Blob([html],{type:'text/html;charset=utf-8'});
    var u=URL.createObjectURL(b), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(u); },1000);
  }
  function send(base, html, done){
    if(!(window.claude&&window.claude.downloads)){ drop(base+'.html',html); say(done); return; }
    window.claude.downloads.save({filename:base+'.html', data:html}).then(function(){ say(done,6000); },
      function(err){
        var code=(err&&err.code)||'unavailable';
        if(code==='declined'){ say('أُلغي التنزيل.'); return; }
        try{ drop(base+'.html',html); }catch(e){}
        window.claude.downloads.save({filename:base+'.html.txt', data:html}).then(function(){
          say('صيغة html مقفلة هنا، فنزل الملف باسم '+base+'.html.txt — احذف «.txt» من آخر الاسم.',15000);
        },function(){ say('تعذّر الحفظ. استخدم زر الطباعة ثم «حفظ بصيغة PDF».',9000); });
      });
  }

  var api={ box:box, snap:snap, mark:mark, keep:keep, say:say, place:place, send:send,
    show:function(html){ box.innerHTML=html; mark(); stack=[]; at=-1; snap(); place(null); } };
  document.getElementById('dl').addEventListener('click',function(){ opts.download(api); });

  /* أول عرض: المحفوظ إن وُجد، وإلا الأصل */
  var saved=null; try{ saved=localStorage.getItem(opts.key); }catch(e){}
  api.show(saved||opts.load());
  if(saved) say('فيه تعديلات محفوظة، رجعناها لك.',5000);
  return api;
}

(function(){
  document.documentElement.lang='ar';
  document.documentElement.dir='rtl';
  function clean(h){
    var t=document.createElement('div'); t.innerHTML=h;
    var n=t.querySelectorAll('[data-block]'), i;
    for(i=0;i<n.length;i++) n[i].removeAttribute('data-block');
    n=t.querySelectorAll('.hot'); for(i=0;i<n.length;i++) n[i].classList.remove('hot');
    n=t.querySelectorAll('[contenteditable]');
    for(i=0;i<n.length;i++) n[i].removeAttribute('contenteditable');
    return t.innerHTML;
  }
  function fileFor(html){
    return '<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n'+
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
      '<title>الجمعة البرتقالية ٢٠٢٦ — محطات درب</title>\n'+CSSTEXT+'\n</head>\n<body>\n'+
      '<div class="wrap"><div id="deck">'+clean(html)+'</div></div>\n</body>\n</html>\n';
  }
  var ed=darbEditor({
    key:'darb-orange-friday-v2',
    load:function(){ return DECK; },
    download:function(api){
      api.send('darb-orange-friday', fileFor(api.box.innerHTML),
               'نُزّل ملف الجمعة البرتقالية جاهزًا للإرسال للشريك.');
    }
  });
  document.title='الجمعة البرتقالية ٢٠٢٦ — محطات درب';
  /* التصميم تغيّر بالكامل، فالمفتاح جديد. نسخة التصميم السابق تبقى محفوظة
     ولا تُحذف، ونخبرها بمكانها مرّة واحدة. */
  (function(){
    var seen=null; try{ seen=localStorage.getItem('darb-orange-friday-v2-note'); }catch(e){}
    if(seen) return;
    var prev=null; try{ prev=localStorage.getItem('darb-orange-friday-v1'); }catch(e){}
    try{ localStorage.setItem('darb-orange-friday-v2-note','1'); }catch(e){}
    if(!prev) return;
    ed.say('هذا تصميم جديد بهوية الجمعة البرتقالية. نسختك من التصميم السابق محفوظة '+
           'ولم تُحذف — قولي لي إن أردتِ نصًّا منها.', 13000);
  })();
})();
</script>
